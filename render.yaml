services:
  - type: web
    name: data-enrichment-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false   # set manually in Render dashboard
      # ── Auth / RBAC ──────────────────────────────────────────────────────────
      - key: SESSION_SECRET        # random 32+ byte string; signs session cookies
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN  # Google Workspace domain allowed to sign in
        value: unstuck-agency.com
      - key: APP_BASE_URL          # public https URL; OAuth redirect base
        sync: false
      - key: GOOGLE_CLIENT_ID      # reused from the Copy Bank export OAuth client
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Emergency rollback lever: set to "1" to disable all auth without a deploy.
      # - key: AUTH_DISABLED
      #   value: "1"
    healthCheckPath: /healthz
