{# Shared Outbound Pulse styles.
   Included by both internal pages. Kept in one file rather than duplicated so
   the funnel looks identical on the overview and the client detail view.
   Follows the house pattern: scoped <style> using base.html's CSS variables. #}
<style>
  .page-inner { max-width: 1180px; }

  select {
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    transition: border-color .18s var(--ease), background .18s var(--ease);
  }
  select:hover  { background: rgba(255,255,255,.09); }
  select:focus  { border-color: var(--border-focus); box-shadow: var(--sh-glow); }
  select option { background: #17172c; color: var(--text); }

  /* ── Tabs ────────────────────────────────────────────────── */
  .pulse-tabs {
    display: flex; gap: 4px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .pulse-tab {
    appearance: none; background: none; border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;            /* sit on the strip's own border */
    padding: 10px 16px;
    font-family: var(--font); font-size: 13.5px; font-weight: 500;
    color: var(--text-3); cursor: pointer;
    transition: color .18s var(--ease), border-color .18s var(--ease);
  }
  .pulse-tab:hover { color: var(--text-2); }
  .pulse-tab.is-active { color: var(--text); border-bottom-color: var(--purple); }
  .pulse-tab:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }

  /* ── Source tabs (within a client view) ──────────────────── */
  .source-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .source-tab {
    appearance: none; cursor: pointer;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 15px;
    font-family: var(--font); font-size: 12.5px; font-weight: 500;
    color: var(--text-2);
    transition: all .18s var(--ease);
  }
  .source-tab:hover:not([disabled]) { background: rgba(255,255,255,.09); color: var(--text); }
  .source-tab.is-active {
    background: rgba(139,92,246,.18);
    border-color: rgba(139,92,246,.45);
    color: #c4b5fd;
  }
  /* Disabled, not hidden: a source with no activity in range should still be
     visibly a source, so its absence reads as "nothing yet", not "not set up". */
  .source-tab[disabled] { opacity: .4; cursor: not-allowed; }

  /* ── Date range ──────────────────────────────────────────── */
  /* The [hidden] rule has to come with the display rule. An author-origin
     `display` beats the browser's own `[hidden] { display: none }`, so without
     this the custom-range inputs were never actually hidden — people typed
     dates into boxes that looked live while the dropdown still said "Last 30
     days", and the dates were then discarded. */
  .date-range { display: inline-flex; align-items: center; gap: 8px; }
  .date-range[hidden] { display: none; }
  .date-range input[type="date"] {
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 12.5px; font-family: var(--font);
    color: var(--text); outline: none;
    color-scheme: dark;             /* native picker matches the dark surface */
  }
  .date-range input[type="date"]:focus {
    border-color: var(--border-focus); box-shadow: var(--sh-glow);
  }
  .date-range-sep { color: var(--text-3); font-size: 12px; }
  .date-range .btn { padding: 7px 14px; font-size: 12.5px; }

  .pulse-meta   { font-size: 12.5px; color: var(--text-3); }
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-3); margin: 0 0 12px;
  }

  .pulse-section { margin-bottom: 30px; }
  .pulse-section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
  }

  /* ── Toolbar ─────────────────────────────────────────────── */
  .pulse-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 24px;
  }
  .pulse-toolbar label {
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text-3);
  }
  .pulse-toolbar .spacer { flex: 1; }

  /* ── Funnel ──────────────────────────────────────────────── */
  .pulse-funnel { display: flex; flex-direction: column; gap: 14px; }
  .pulse-funnel.is-compact { gap: 9px; }

  .funnel-stage { animation: funnelIn .38s var(--ease-out) both; animation-delay: calc(var(--i) * .05s); }
  @keyframes funnelIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }

  .funnel-stage-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 5px;
  }
  .funnel-label { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
  .funnel-value {
    font-family: var(--font-display);
    font-size: 17px; font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .is-compact .funnel-label { font-size: 11.5px; }
  .is-compact .funnel-value { font-size: 14px; }

  .funnel-track {
    height: 9px; border-radius: 6px;
    background: rgba(255,255,255,.06);
    overflow: hidden;
  }
  .is-compact .funnel-track { height: 6px; }
  .funnel-bar {
    height: 100%; border-radius: 6px;
    background: var(--gradient-vivid);
    /* Zero-width bars still need to read as "a stage with nothing in it"
       rather than as a missing row. */
    min-width: 2px;
    transition: width .5s var(--ease-out);
  }

  .funnel-rates {
    display: flex; gap: 12px; margin-top: 5px;
    font-size: 11px; color: var(--text-3);
  }
  .is-compact .funnel-rates { margin-top: 3px; font-size: 10.5px; }
  .rate-step    { color: #c4b5fd; }
  .rate-overall { color: var(--text-3); }

  /* ── Agency total card ───────────────────────────────────── */
  .pulse-total-card {
    display: block;
    background: rgba(255,255,255,.07);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: var(--sh-md), inset 0 1px 0 rgba(255,255,255,.07);
  }
  /* A strip under the numbers rather than a column beside them. */
  .pulse-channel-split {
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .channel-rows {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px;
  }
  .channel-row {
    display: flex; flex-direction: column; gap: 3px;
    padding: 10px 12px; border-radius: 10px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  }
  .channel-name  { font-size: 13px; font-weight: 600; color: var(--text); }
  .channel-stats { font-size: 12px; color: var(--text-3); }
  .channel-stats b { color: #c4b5fd; font-weight: 600; }

  /* ── Client grid ─────────────────────────────────────────── */
  .pulse-client-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .pulse-client-card {
    --card-accent: var(--purple);
    display: block; text-decoration: none;
    background: rgba(255,255,255,.07);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px 18px;
    transition: transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .pulse-client-card:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--card-accent) 55%, transparent);
    box-shadow: var(--sh-md);
  }
  .pulse-client-head {
    display: flex; align-items: center; gap: 9px; margin-bottom: 14px;
  }
  .pulse-client-name {
    flex: 1; font-family: var(--font-display);
    font-size: 17px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pulse-client-meetings {
    font-size: 12px; font-weight: 600; color: #c4b5fd;
    background: rgba(139,92,246,.14);
    border: 1px solid rgba(139,92,246,.3);
    border-radius: 999px; padding: 2px 10px;
  }
  .pulse-client-meetings::after { content: ' lead rate'; font-weight: 400; color: var(--text-3); }

  /* ── Reply outcomes + lead rate ──────────────────────────── */
  /* Three rates, equal width: they share a base (sends), so making one bigger
     than the others would imply a hierarchy the numbers do not have. */
  .pulse-rates {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-top: 20px; padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .rate-card {
    padding: 12px 16px; border-radius: 12px;
    background: rgba(139,92,246,.12);
    border: 1px solid rgba(139,92,246,.32);
  }
  .rate-value {
    font-family: var(--font-display); font-size: 26px; font-weight: 600;
    color: var(--text); line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  .rate-label { font-size: 11.5px; color: #c4b5fd; margin-top: 4px; font-weight: 500; }
  .rate-n { display: block; color: var(--text-3); font-weight: 400; margin-top: 2px; }

  .pulse-outcomes { margin-top: 12px; }
  .outcome-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .outcome-item {
    display: flex; flex-direction: column; gap: 2px;
    padding: 10px 12px; border-radius: 10px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  }
  /* Leads are marked so it is visible which two outcomes feed the lead rate. */
  .outcome-item.is-lead { border-color: rgba(139,92,246,.32); }
  /* Unsubscribes are the one number here you want going down, so they are
     tinted away from the purple the good outcomes share. */
  .outcome-item.is-negative { border-color: rgba(248,113,113,.28); background: rgba(248,113,113,.06); }
  .outcome-item.is-negative .outcome-value { color: #fca5a5; }
  .outcome-label { font-size: 11.5px; color: var(--text-2); }
  .outcome-value {
    font-family: var(--font-display); font-size: 18px; font-weight: 600;
    color: var(--text); font-variant-numeric: tabular-nums;
  }
  .outcome-share { font-size: 10.5px; color: var(--text-3); }

  /* ── Connectors ──────────────────────────────────────────── */
  .pulse-connectors {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px;
  }
  .connector-card {
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .connector-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .connector-pill {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-3); flex-shrink: 0;
  }
  .connector-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .connector-state {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-3); font-weight: 600;
  }
  .connector-meta  { font-size: 12px; color: var(--text-3); line-height: 1.5; }
  .connector-note  { font-size: 11.5px; color: #fbbf24; margin-top: 6px; line-height: 1.5; }
  .connector-error {
    font-size: 11.5px; color: var(--red); margin-top: 6px; line-height: 1.5;
    max-height: 60px; overflow: auto;
  }
  .connector-sync-btn { margin-top: 12px; font-size: 12px; padding: 7px 15px; }
  .connector-sync-btn[disabled] { opacity: .4; cursor: not-allowed; }

  .state-ok      .connector-pill { background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,.6); }
  .state-ok      .connector-state { color: #4ade80; }
  .state-running .connector-pill { background: #60a5fa; animation: dotPulse 1.1s infinite var(--ease); }
  .state-running .connector-state { color: #60a5fa; }
  .state-partial .connector-pill { background: #fbbf24; }
  .state-partial .connector-state { color: #fbbf24; }
  .state-stale   .connector-pill { background: #fbbf24; }
  .state-stale   .connector-state { color: #fbbf24; }
  .state-error   .connector-pill { background: var(--red); }
  .state-error   .connector-state { color: var(--red); }

  .pulse-run-result { margin-bottom: 14px; }
  .run-line {
    font-size: 12.5px; color: var(--text-2); line-height: 1.6;
    padding: 8px 12px; border-radius: 10px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .run-line.run-error { color: var(--red); background: var(--red-bg); border-color: var(--red-bdr); }
  .run-line.run-ok    { border-color: rgba(74,222,128,.3); }

  .pulse-logs { margin-top: 16px; }
  .pulse-logs summary {
    font-size: 12px; color: var(--text-3); cursor: pointer;
    padding: 6px 0; user-select: none;
  }
  .pulse-logs summary:hover { color: var(--text-2); }
  .log-status  { text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; }
  .log-ok      { color: #4ade80; }
  .log-partial, .log-running { color: #fbbf24; }
  .log-error   { color: var(--red); }
  td.log-error { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

  /* ── Panels, warnings, empties ───────────────────────────── */
  .pulse-panel {
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 22px;
  }
  .pulse-panel > h3 {
    font-family: var(--font-display);
    font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px;
  }
  .pulse-panel > .panel-hint {
    font-size: 12.5px; color: var(--text-3); line-height: 1.55; margin-bottom: 14px;
  }

  .pulse-warn {
    background: rgba(251,191,36,.09);
    border: 1px solid rgba(251,191,36,.28);
    border-radius: 12px;
    padding: 12px 16px; margin-bottom: 20px;
    font-size: 13px; color: #fbbf24; line-height: 1.6;
  }
  .link-btn {
    background: none; border: none; color: #c4b5fd; cursor: pointer;
    font-size: 13px; font-family: var(--font); text-decoration: underline; padding: 0;
  }

  .pulse-empty {
    text-align: center; padding: 46px 24px;
    background: rgba(255,255,255,.04);
    border: 1px dashed var(--border);
    border-radius: 16px;
  }
  .pulse-empty h3 {
    font-family: var(--font-display); font-size: 16px;
    font-weight: 600; color: var(--text-2); margin-bottom: 8px;
  }
  .pulse-empty p { font-size: 13px; color: var(--text-3); line-height: 1.6; max-width: 460px; margin: 0 auto; }

  .row-unmapped td { color: #fbbf24; }
  .row-revoked  td { opacity: .45; }
  .map-select { padding: 5px 9px; font-size: 12px; min-width: 150px; }

  /* ── Column filters ──────────────────────────────────────── */
  .filter-row th {
    padding: 6px 12px 10px;
    background: rgba(255,255,255,.03);
    border-bottom: 1px solid var(--border);
    text-transform: none;
    letter-spacing: normal;
  }
  .filter-select {
    width: 100%;
    min-width: 108px;
    padding: 5px 8px;
    font-size: 11.5px;
    border-radius: 8px;
    /* Reads as a control rather than another header cell, without shouting. */
    background: rgba(255,255,255,.07);
  }
  .filter-clear {
    background: none;
    border: none;
    padding: 0;
    color: #c4b5fd;
    font-family: var(--font);
    font-size: 11.5px;
    cursor: pointer;
    text-decoration: underline;
    white-space: nowrap;
  }
  .filter-clear:hover { color: var(--text); }

  .filter-search {
    width: 100%;
    min-width: 150px;
    padding: 5px 9px;
    font-size: 11.5px;
    font-family: var(--font);
    color: var(--text);
    background: rgba(255,255,255,.07);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    margin-bottom: 4px;
  }
  .filter-search:focus { border-color: var(--border-focus); box-shadow: var(--sh-glow); }
  .filter-search::placeholder { color: var(--text-3); }

  /* ── Bulk mapping ────────────────────────────────────────── */
  .tick-col { width: 34px; text-align: center; padding-left: 12px; padding-right: 0; }
  .tick-col input[type="checkbox"] { cursor: pointer; width: 14px; height: 14px; accent-color: var(--purple); }

  .bulk-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(139,92,246,.12);
    border: 1px solid rgba(139,92,246,.35);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    /* Sticks to the top of the scroll region so the action stays reachable
       while working down a long filtered list. */
    position: sticky;
    top: 58px;
    z-index: 20;
    backdrop-filter: saturate(160%) blur(12px);
    animation: resultIn .2s var(--ease-out) both;
  }
  .bulk-count { font-size: 13px; font-weight: 600; color: #c4b5fd; }
  .bulk-label { font-size: 12px; color: var(--text-2); }

  .btn-delete {
    background: var(--red-bg); border: 1px solid var(--red-bdr); color: var(--red);
    border-radius: 8px; width: 26px; height: 26px; cursor: pointer;
    font-size: 12px; line-height: 1; transition: all .18s var(--ease);
  }
  .btn-delete:hover { background: var(--red); color: #fff; }

  /* ── Access links ────────────────────────────────────────── */
  .access-new {
    background: rgba(139,92,246,.1);
    border: 1px solid rgba(139,92,246,.32);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 4px;
  }
  .access-new-label { font-size: 12px; color: #c4b5fd; margin-bottom: 9px; font-weight: 500; }
  .access-new-row { display: flex; gap: 9px; }
  .access-new-row input {
    flex: 1; background: rgba(0,0,0,.28); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 13px; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text);
  }
  .access-new-row .btn { padding: 9px 18px; font-size: 13px; }


  /* ── Account manager notes ─────────────────────────── */
  .note-form textarea, .note-edit textarea {
    width: 100%; box-sizing: border-box; resize: vertical;
    background: rgba(0,0,0,.28); border: 1px solid var(--border);
    border-radius: 11px; padding: 11px 13px; font: inherit; font-size: 13px;
    color: var(--text); line-height: 1.6;
  }
  .note-form textarea:focus, .note-edit textarea:focus {
    outline: none; border-color: rgba(139,92,246,.5);
  }
  .note-form-actions {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px;
  }
  .note-form-actions .btn { margin-left: auto; }
  .note-form-actions .btn + .btn { margin-left: 0; }
  .note-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text-2); cursor: pointer;
  }
  .note-toggle input { accent-color: #8b5cf6; }

  .note-list { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  .note {
    border: 1px solid var(--border); border-radius: 13px; padding: 13px 15px;
    background: rgba(255,255,255,.03);
  }
  .note.is-hidden { opacity: .72; border-style: dashed; }
  .note-meta {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--text-3); margin-bottom: 8px;
  }
  .note-meta .spacer { flex: 1; }
  .note-author { color: var(--text-2); font-weight: 500; }
  .note-edited { font-style: italic; }
  .note-badge {
    font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
  }
  .note-badge.is-live { color: #c4b5fd; border-color: rgba(139,92,246,.45); }
  .note-body { font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; }
  .note-act {
    background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; font-size: 11.5px; color: var(--text-2);
    text-decoration: underline; text-underline-offset: 2px;
  }
  .note-act:hover { color: var(--text); }
  .note-act.is-danger:hover { color: #fca5a5; }
  .note-edit { margin-top: 4px; }


  /* ── Client reports ─────────────────────────────────── */
  .report-new-row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .report-field { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-2); }
  .report-field em { color: var(--text-3); font-style: normal; }
  .report-field-wide { flex: 1; min-width: 220px; }
  .report-field input {
    background: rgba(0,0,0,.28); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px;
    color: var(--text); color-scheme: dark;
  }
  .report-field input:focus { outline: none; border-color: rgba(139,92,246,.5); }
  .report-arrow { color: var(--text-3); padding-bottom: 9px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .report-list { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  .report {
    border: 1px solid var(--border); border-radius: 13px; padding: 13px 15px;
    background: rgba(255,255,255,.03);
  }
  .report.is-published { border-color: rgba(139,92,246,.32); }
  .report-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
