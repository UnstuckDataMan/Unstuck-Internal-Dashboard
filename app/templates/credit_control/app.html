    </div>`, true);

  document.getElementById('cd-edit').onclick = () => clientForm(cid);
}

/* ── Client add/edit form ── */
// onCreated(newClientId), when given, is called after a brand-new client is
// saved instead of the normal close-and-refresh — used by the invoice form's
// "+ New client…" option to hand control straight back with the new client
// ready to pick. Not invoked when editing an existing client (cid set).
function clientForm(cid, onCreated) {
  const c = cid ? clientById(cid) : null;
  const s = DB.settings;
  openModal(`
    <div class="modal-head"><h3>${c ? 'Edit client — ' + esc(c.companyName) : 'Add client'}</h3><button class="modal-x" data-close>×</button></div>
    <div class="fgrid">
      <div class="fld"><label>Company name *</label><input id="cf-name" value="${esc(c?.companyName || '')}"></div>
      <div class="fld"><label>QuickBooks name</label><input id="cf-qb" value="${esc(c?.qbName || '')}"></div>
      <div class="fld full"><label>Email(s)</label><input id="cf-email" value="${esc(c?.email || '')}"></div>
      <div class="fld"><label>Account manager</label><select id="cf-am" data-add-list="accountManagers">${selectOptions(s.accountManagers, c?.accountManager, true, 'accountManagers')}</select></div>
      <div class="fld"><label>Package</label><select id="cf-pkg" data-add-list="packages">${selectOptions(s.packages, c?.package, true, 'packages')}</select></div>
      <div class="fld"><label>Industry</label><select id="cf-industry" data-add-list="industries">${selectOptions(s.industries, c?.industry, true, 'industries')}</select>
        <div class="muted" id="cf-wide-hint" style="font-size:11px; margin-top:4px"></div></div>
      <div class="fld"><label>Country</label><select id="cf-country" data-add-list="countries">${selectOptions(s.countries, c?.country, true, 'countries')}</select></div>
      <div class="fld"><label>Company size</label><select id="cf-size" data-add-list="companySizes">${selectOptions(s.companySizes, c?.companySize, true, 'companySizes')}</select></div>
      <div class="fld"><label>Monthly fee £ *</label><input type="number" step="0.01" id="cf-gbp" value="${c?.feeGBP ?? ''}"></div>
      <div class="fld"><label>Fee $ (optional)</label><input type="number" step="0.01" id="cf-usd" value="${c?.feeUSD ?? ''}"></div>
      <div class="fld"><label>Fee € (optional)</label><input type="number" step="0.01" id="cf-eur" value="${c?.feeEUR ?? ''}"></div>
      <div class="fld"><label>Issue day of month</label><input type="number" min="1" max="31" id="cf-day" value="${c?.issueDay ?? 1}"></div>
      <div class="fld"><label>Days until due</label><input type="number" min="0" id="cf-duedays" value="${c?.dueDays ?? 7}"></div>
      <div class="fld"><label>Contract terms</label><input id="cf-terms" value="${esc(c?.contractTerms || '')}"></div>
      <div class="fld"><label>Agreed trial months</label><input type="number" id="cf-trial" value="${c?.agreedTrialMonths ?? ''}"></div>
      <div class="fld"><label>Start month</label><input type="month" id="cf-start" value="${esc(c?.startMonth || currentMonthKey())}"></div>
      <div class="fld"><label>Status</label>
        <select id="cf-status"><option value="active" ${c?.status !== 'churned' ? 'selected' : ''}>Active</option><option value="churned" ${c?.status === 'churned' ? 'selected' : ''}>Churned</option></select>
      </div>
      <div class="fld" id="cf-churn-wrap" style="display:${c?.status === 'churned' ? 'block' : 'none'}"><label>Churn month</label><input type="month" id="cf-churn" value="${esc(c?.churnMonth || '')}"></div>
      <div class="fld"><label>Lead generated by (${s.commission.leadGenPct}%)</label><select id="cf-lead" data-add-list="salesTeam">${selectOptions(s.salesTeam, c?.leadGenBy, true, 'salesTeam')}</select></div>
      <div class="fld"><label>Converted by (${s.commission.converterPct}%)</label><select id="cf-conv" data-add-list="salesTeam">${selectOptions(s.salesTeam, c?.convertedBy, true, 'salesTeam')}</select></div>
      <div class="fld"><label class="chk"><input type="checkbox" id="cf-auto" ${c?.autoIssue ? 'checked' : ''}> Issues automatically (GoCardless)</label>
        <label class="chk"><input type="checkbox" id="cf-mm" ${c?.mailMerge ? 'checked' : ''}> Mail merge</label></div>
      <div class="fld"><label>Lifetime value — correct figure today (£)</label><input type="number" step="0.01" min="0" id="cf-ltv-fix" value="${c && c.ltvAdjust ? Math.round(clientLifetimeValue(c.id) * 100) / 100 : ''}" placeholder="${c ? 'Calculated: ' + fmtMoney(clientCalcLifetimeValue(c.id)) : 'Calculated from invoices'}">${c && c.ltvAdjust ? `<div class="note" style="margin:4px 0 0">Includes a manual adjustment of ${c.ltvAdjust > 0 ? '+' : '−'}${fmtMoney(Math.abs(c.ltvAdjust))} on top of the ${fmtMoney(clientCalcLifetimeValue(c.id))} from invoices.</div>` : ''}</div>
      <div class="fld"><label>Tenure — correct figure today (months)</label><input type="number" step="1" min="0" id="cf-ten-fix" value="${c && c.tenureAdjust ? clientMaxMonthNo(c.id) : ''}" placeholder="${c ? 'Calculated: ' + clientCalcMonthNo(c.id) : 'Calculated from invoices'}">${c && c.tenureAdjust ? `<div class="note" style="margin:4px 0 0">Includes a manual adjustment of ${c.tenureAdjust > 0 ? '+' : '−'}${Math.abs(c.tenureAdjust)} month${Math.abs(c.tenureAdjust) === 1 ? '' : 's'} on top of the ${clientCalcMonthNo(c.id)} from invoices.</div>` : ''}</div>
      <div class="fld full"><p class="note" style="margin:0"><strong>Manual lifetime value / tenure</strong> — for when the invoice history is incomplete. Enter the correct figure as it stands <em>today</em>; the app keeps the difference from the invoice-based figure as an adjustment, so every new invoice still adds on top. It applies everywhere LTV and tenure are shown (Insights, AM Performance). Leave blank to use the calculated figure. Revenue, invoices and commission aren't affected.</p></div>
      <div class="fld full"><label>Notes</label><textarea id="cf-notes">${esc(c?.notes || '')}</textarea></div>
    </div>
    ${c ? `<p class="note">Changing <strong>Package</strong> here carries forward onto all of this client's not-yet-issued invoices — except any invoice where you've manually set a different package, which stays locked.</p>` : ''}
    ${!c ? `<p class="note"><strong>Issue day of month</strong> and <strong>Days until due</strong> start this client's invoices populating on the Invoices tab immediately, from invoice 2 onward. Invoice 1 doesn't use these — go to the Invoices tab afterward and add it separately with its own real dates.</p>` : ''}
    <div class="modal-foot">
      ${c ? '<button class="btn btn-danger left" id="cf-del">Delete client</button>' : ''}
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn-primary" id="cf-save">${c ? 'Save changes' : 'Add client'}</button>
    </div>`);

  const $ = id => document.getElementById(id);
  $('cf-status').onchange = () => { $('cf-churn-wrap').style.display = $('cf-status').value === 'churned' ? 'block' : 'none'; };
  const updateWideHint = () => {
    const ind = $('cf-industry').value;
    const wide = ind && ind !== ADD_NEW_OPTION ? ((DB.settings.industryGroups || {})[ind] || '') : '';
    $('cf-wide-hint').textContent = !ind || ind === ADD_NEW_OPTION ? '' : wide ? `Wider industry: ${wide}` : 'Not in a wider industry yet — set it in Operational Settings.';
  };
  $('cf-industry').addEventListener('change', updateWideHint);
  $('cf-industry').addEventListener('input', updateWideHint);
  updateWideHint();

  $('cf-save').onclick = () => {
    const name = $('cf-name').value.trim();
    if (!name) { $('cf-name').focus(); return; }
    const rec = c || { id: uid() };
    const oldPackage = c?.package || '';
    // Changing a client's account manager must never rewrite history: first freeze every invoice
    // that has no AM of its own to the previous AM, then (after saving) offer the handover month.
    const oldAM = (c?.accountManager || '').trim(), newAM = ($('cf-am').value || '').trim();
    const amChanged = !!c && !!oldAM && newAM !== oldAM && newAM !== ADD_NEW_OPTION;
    if (amChanged) stampUnassignedInvoices(c.id, oldAM);
    rec.companyName = name;
    rec.qbName      = $('cf-qb').value.trim();
    rec.email       = $('cf-email').value.trim();
    rec.accountManager = $('cf-am').value;
    rec.package     = $('cf-pkg').value;
    rec.industry    = $('cf-industry').value;
    rec.country     = $('cf-country').value;
    rec.companySize = $('cf-size').value;
    rec.feeGBP      = $('cf-gbp').value ? Number($('cf-gbp').value) : 0;
    rec.feeUSD      = $('cf-usd').value ? Number($('cf-usd').value) : null;
    rec.feeEUR      = $('cf-eur').value ? Number($('cf-eur').value) : null;
    rec.issueDay    = $('cf-day').value ? Number($('cf-day').value) : 1;
    rec.dueDays     = $('cf-duedays').value ? Number($('cf-duedays').value) : 7;
    rec.contractTerms = $('cf-terms').value.trim();
    rec.agreedTrialMonths = $('cf-trial').value ? Number($('cf-trial').value) : null;
    rec.startMonth  = $('cf-start').value || currentMonthKey();
    rec.status      = $('cf-status').value;
    rec.churnMonth  = rec.status === 'churned' ? ($('cf-churn').value || currentMonthKey()) : null;
    rec.leadGenBy   = $('cf-lead').value;
    rec.convertedBy = $('cf-conv').value;
    rec.autoIssue   = $('cf-auto').checked;
    rec.mailMerge   = $('cf-mm').checked;
    rec.notes       = $('cf-notes').value.trim();
    // What's typed is the correct total today; what's stored is its difference from the invoice-based figure.
    const adjustFor = (raw, calc) => { raw = String(raw).trim(); const n = Number(raw); if (raw === '' || !isFinite(n) || n < 0) return null; const d = Math.round((n - calc) * 100) / 100; return d || null; };
    rec.ltvAdjust    = adjustFor($('cf-ltv-fix').value, c ? clientCalcLifetimeValue(c.id) : 0);
    rec.tenureAdjust = adjustFor($('cf-ten-fix').value, c ? clientCalcMonthNo(c.id) : 0);
    delete rec.ltvOverride; delete rec.tenureOverride;
    if (!c) DB.clients.push(rec);
    if (c && rec.package !== oldPackage) applyPackageToFutureInvoices(rec.id, rec.package);
    touch();
    modalOnCancel = null; // this is a successful save, not a cancel — don't run the invoice form's fallback
    closeModal(); renderAll();
    if (!c && onCreated) onCreated(rec.id);
    if (amChanged) openHandoverModal(rec, oldAM, newAM);
  };

  if (c) $('cf-del')?.addEventListener('click', () => {
    const n = DB.invoices.filter(i => i.clientId === c.id).length;
    confirmModal(`Delete <strong>${esc(c.companyName)}</strong> and their ${n} invoice${n === 1 ? '' : 's'}? This removes them from all stats and cannot be undone.<br><br>If they've simply left, mark them as <strong>Churned</strong> instead so history is kept.`, () => {
      DB.clients  = DB.clients.filter(x => x.id !== c.id);
      DB.invoices = DB.invoices.filter(i => i.clientId !== c.id);
      touch(); renderAll();
    }, 'Delete permanently');
  });
}

/* ════════════════ RETENTION VIEW ════════════════ */
// An invoice counts as "Account maintenance fee" only if it was snapshotted as
// such at creation time — historical invoices with no stored package are never
// retroactively reclassified, so this only takes effect from here forward.
function isMaintenanceInvoice(inv) {
  const pkg = inv.package;
  if (!pkg) return false;
  return pkg.trim().toLowerCase() === 'account maintenance fee';

    }
  } else {
    for (let v = 0; v <= countMaxV + 0.001; v += countStep) {
      const yy = yCount(v);
      gridSvg += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>`;
      gridSvg += `<text x="${padL - 8}" y="${yy + 3}" text-anchor="end" font-size="10" fill="var(--text-muted)">${Math.round(v)}</text>`;
    }
  }
  // Right axis: only when churn and at least one count metric share the chart.
  let rightAxisSvg = '';
  if (dual) {
    for (let v = 0; v <= countMaxV + 0.001; v += countStep) {
      rightAxisSvg += `<text x="${W - padR + 8}" y="${yCount(v) + 3}" text-anchor="start" font-size="10" fill="var(--text-muted)">${Math.round(v)}</text>`;
    }
  }

  const labelEvery = Math.max(1, Math.ceil(pts.length / 10));
  let xLabelsSvg = '';
  pts.forEach((r, i) => {
    if (i % labelEvery === 0 || i === pts.length - 1) {
      xLabelsSvg += `<text x="${x(i)}" y="${H - padB + 16}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${esc(monthLabelShort(r.m))}</text>`;
    }
  });

  let goalsSvg = '';
  if (showChurn) {
    const goalLine = (val, color, label) => {
      const yy = yChurn(val);
      return `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${color}" stroke-width="1.5" stroke-dasharray="5 4"/>
        <text x="${W - padR}" y="${yy - 5}" text-anchor="end" font-size="10" fill="${color}">${esc(label)} ${goals[label === 'Short-term' ? 'shortTermGoalPct' : 'longTermGoalPct']}%</text>`;
    };
    goalsSvg = goalLine(goals.shortTermGoalPct, 'var(--warn)', 'Short-term') + goalLine(goals.longTermGoalPct, 'var(--success)', 'Long-term');
  }

  // "New" and "Left" are superimposed rather than grouped side-by-side when
  // both are shown: New draws solid (behind), Left draws as a diagonal-hatch
  // pattern (on top, same position/width) rather than a solid fill, so New's
  // bar stays visible through the gaps instead of the two just sitting apart.
  const overlayCounts = countSeries.length > 1;
  let barsSvg = '', hatchDefsSvg = '';
  if (showCount) {
    const barW = Math.max(4, Math.min(24, (plotW / Math.max(1, pts.length - 1)) * 0.5));
    if (overlayCounts) {
      // Left's outline/hatch color scales red → grey → green with the New-vs-
      // Left net for that month, relative to the biggest discrepancy on screen.
      const maxNetAbs = Math.max(1, ...pts.map(r => Math.abs((r.newClients || 0) - (r.lost || 0))));
      let patternsSvg = '';
      barsSvg = pts.map((r, i) => {
        const newVal = r.newClients || 0, leftVal = r.lost || 0;
        const net = newVal - leftVal;
        const color = netDiscrepancyColor(net, maxNetAbs);
        const patId = `ret-hatch-left-${i}`;
        patternsSvg += `<pattern id="${patId}" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="6" stroke="${color}" stroke-width="2.5"/>
        </pattern>`;
        const xx = x(i) - barW / 2;
        const yNewB = yCount(newVal), yLeftB = yCount(leftVal);
        return `<rect x="${xx}" y="${yNewB}" width="${barW}" height="${(H - padB) - yNewB}" fill="var(--accent)" opacity="0.7" rx="2"><title>${esc(monthLabel(r.m))}: ${newVal} new client${newVal === 1 ? '' : 's'}</title></rect>`
          + `<rect x="${xx}" y="${yLeftB}" width="${barW}" height="${(H - padB) - yLeftB}" fill="url(#${patId})" stroke="${color}" stroke-width="1.5" rx="2"><title>${esc(monthLabel(r.m))}: ${leftVal} client${leftVal === 1 ? '' : 's'} left (net ${net > 0 ? '+' : ''}${net} vs new)</title></rect>`;
      }).join('');
      hatchDefsSvg = `<defs>${patternsSvg}</defs>`;
    } else {
      const s = countSeries[0];
      barsSvg = pts.map((r, i) => {
        const val = r[s.key] || 0;
        const yy = yCount(val);
        return `<rect x="${x(i) - barW / 2}" y="${yy}" width="${barW}" height="${(H - padB) - yy}" fill="${s.color}" opacity="${dual ? 0.5 : 0.8}" rx="2"><title>${esc(monthLabel(r.m))}: ${val} ${s.label.toLowerCase()}</title></rect>`;
      }).join('');
    }
  }

  let lineSvg = '', dotsSvg = '';
  if (showChurn) {
    const linePoints = pts.map((r, i) => `${x(i)},${yChurn(r.churnPct)}`).join(' ');
    lineSvg = `<polyline points="${linePoints}" fill="none" stroke="var(--accent-to)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    dotsSvg = pts.map((r, i) => `<circle class="chart-pt" data-i="${i}" cx="${x(i)}" cy="${yChurn(r.churnPct)}" r="4" fill="var(--accent-to)" stroke="var(--bg-card)" stroke-width="2"><title>${esc(monthLabel(r.m))}: ${r.churnPct.toFixed(1)}% churn</title></circle>`).join('');
  }

  const html = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${hatchDefsSvg}
      ${gridSvg}
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--border-hi)" stroke-width="1"/>
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--border-hi)" stroke-width="1"/>
      ${rightAxisSvg}
      ${goalsSvg}
      ${barsSvg}
      ${lineSvg}
      ${dotsSvg}
      ${xLabelsSvg}
      <line id="ret-crosshair" x1="0" y1="${padT}" x2="0" y2="${H - padB}" stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    </svg>
    <div class="chart-tooltip" id="ret-tooltip"></div>`;

  return { html, points: pts, x, yChurn, yCount, W, H, metrics };
}
// Hover/crosshair wiring for a buildChurnChart() result — shared by the
// Retention detail's full chart and the Overview's churn preview chart
// (mutually exclusive pages, so the chart's internal #ret-tooltip/
// #ret-crosshair ids are never on screen twice at once).
function wireChurnChartHover(chartWrap, chart) {
  // Below 2 points there's no SVG/line rendered to hover (buildChurnChart
  // falls back to a plain text message instead) — only `points` itself is
  // still populated in that case, for the stats above the chart to use.
  if (chart.points.length < 2) return;
  const svgEl = chartWrap.querySelector('svg');
  const tooltip = chartWrap.querySelector('#ret-tooltip');
  const crosshair = chartWrap.querySelector('#ret-crosshair');
  const metrics = chart.metrics;
  const showPoint = i => {
    const r = chart.points[i];
    const rect = svgEl.getBoundingClientRect();
    const px = chart.x(i) / chart.W * rect.width;
    const hasChurn = metrics.includes('churn');
    const py = (hasChurn ? chart.yChurn(r.churnPct) : chart.yCount(Math.max(r.newClients || 0, r.lost || 0))) / chart.H * rect.height;
    crosshair.setAttribute('x1', chart.x(i));
    crosshair.setAttribute('x2', chart.x(i));
    crosshair.setAttribute('opacity', '1');
    const lines = [];
    if (hasChurn) lines.push(`<span class="tv">${r.churnPct.toFixed(1)}%</span> churn`);
    if (metrics.includes('new')) lines.push(`<span class="tv">${r.newClients || 0}</span> new client${(r.newClients || 0) === 1 ? '' : 's'}`);
    if (metrics.includes('left')) lines.push(`<span class="tv">${r.lost || 0}</span> client${(r.lost || 0) === 1 ? '' : 's'} left`);
    if (metrics.includes('new') && metrics.includes('left')) {
      const net = (r.newClients || 0) - (r.lost || 0);
      const color = net > 0 ? 'var(--success)' : net < 0 ? 'var(--danger)' : 'var(--text-dim)';
      lines.push(`Net: <span class="tv" style="color:${color}">${net > 0 ? '+' : ''}${net}</span>`);
    }
    tooltip.innerHTML = `${esc(monthLabel(r.m))}<br>${lines.join('<br>')}`;
    tooltip.style.left = px + 'px';
    tooltip.style.top = py + 'px';
    tooltip.classList.add('visible');
  };
  const hide = () => { crosshair.setAttribute('opacity', '0'); tooltip.classList.remove('visible'); };
  chartWrap.addEventListener('mousemove', e => {
    const rect = svgEl.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width * chart.W;
    let nearest = 0, best = Infinity;
    chart.points.forEach((r, i) => { const d = Math.abs(chart.x(i) - relX); if (d < best) { best = d; nearest = i; } });
    showPoint(nearest);
  });
  chartWrap.addEventListener('mouseleave', hide);
}

// Generalized multi-series SVG line chart (LTV trend, retention-by-dimension
// trend, MRR trend, etc.) for the Insights tab — separate from buildChurnChart()
// above, which stays purpose-built for the Retention tab's churn/new-clients
// combo chart (bars + a goal-lined line, optionally on two y-axes). `seriesList`: an array
// of { name, color, points: [{ m, v }] }; every series must share the same
// month sequence (same length/order) since they're drawn on one shared
// x-axis — the caller aligns them (retentionRows() calls already share the
// same invoiceMonths() timeline, so this holds for every planned use).
// `opts.id` must be unique per chart instance on the page — it
// namespaces the crosshair/tooltip element IDs so multiple charts (and the
// unrelated Retention chart) can coexist without colliding.
function buildLineChart(seriesList, opts = {}) {
  const { refLines = [], yUnit = '', id = 'lc', labelFn = monthLabelShort, tooltipLabelFn = monthLabel, projectedFrom = null } = opts;
  const usable = seriesList.filter(s => s.points && s.points.length);
  if (!usable.length || usable[0].points.length < 2) {
    return { html: '<div class="empty">Need at least two months of data to plot a trend.</div>', months: [] };
  }
  const months = usable[0].points.map(p => p.m);
  const n = months.length;
  const W = 900, H = 280, padL = 46, padR = 18, padT = 16, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const allVals = usable.flatMap(s => s.points.map(p => p.v).filter(v => v != null));
  const domainMax = Math.max(0, allVals.length ? Math.max(...allVals) : 0, ...refLines.map(r => r.value));
  const step = niceStep(domainMax);
  const maxV = Math.max(step, Math.ceil((domainMax * 1.12) / step) * step);
  const x = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const y = v => padT + (1 - v / (maxV || 1)) * plotH;
  const fmtV = v => yUnit === '%' ? `${v.toFixed(1)}%` : yUnit === '£' ? fmtMoney(v) : Math.round(v).toLocaleString();

  let gridSvg = '';
  for (let v = 0; v <= maxV + 0.001; v += step) {
    const yy = y(v);
    const label = yUnit === '£' ? fmtMoney(v) : `${Math.round(v)}${yUnit}`;
    gridSvg += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL - 8}" y="${yy + 3}" text-anchor="end" font-size="10" fill="var(--text-muted)">${esc(label)}</text>`;
  }

  const labelEvery = Math.max(1, Math.ceil(n / 10));
  let xLabelsSvg = '';
  months.forEach((m, i) => {
    if (i % labelEvery === 0 || i === n - 1) {
      xLabelsSvg += `<text x="${x(i)}" y="${H - padB + 16}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${esc(labelFn(m))}</text>`;
    }
  });

  const refSvg = refLines.map(r => {
    const yy = y(r.value);
    return `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${r.color}" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W - padR}" y="${yy - 5}" text-anchor="end" font-size="10" fill="${r.color}">${esc(r.label)}</text>`;
  }).join('');

  // Shaded "projected" zone — everything from the first projected month on.
  let projSvg = '';
  const projIdx = projectedFrom ? months.indexOf(projectedFrom) : -1;
  if (projIdx > 0) {
    const px0 = (x(projIdx - 1) + x(projIdx)) / 2;
    projSvg = `<rect x="${px0}" y="${padT}" width="${W - padR - px0}" height="${H - padT - padB}" fill="var(--accent)" opacity="0.07"/>
      <line x1="${px0}" y1="${padT}" x2="${px0}" y2="${H - padB}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <text x="${px0 + 6}" y="${padT + 11}" font-size="10" fill="var(--accent)">Projected →</text>`;
  }

  let seriesSvg = '';
  usable.forEach(s => {
    const linePoints = s.points.map((p, i) => p.v == null ? null : `${x(i)},${y(p.v)}`).filter(Boolean).join(' ');
    seriesSvg += `<polyline points="${linePoints}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.points.forEach((p, i) => {
      if (p.v == null) return;
      seriesSvg += `<circle class="chart-pt" cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="${p.color || s.color}" stroke="var(--bg-card)" stroke-width="2"><title>${esc(p.tooltipLabel || s.name)} — ${esc(tooltipLabelFn(p.m))}: ${esc(fmtV(p.v))}</title></circle>`;
    });
  });

  const html = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${gridSvg}
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--border-hi)" stroke-width="1"/>
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--border-hi)" stroke-width="1"/>
      ${projSvg}
      ${refSvg}
      ${seriesSvg}
      ${xLabelsSvg}
      <line id="${id}-crosshair" x1="0" y1="${padT}" x2="0" y2="${H - padB}" stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    </svg>
    <div class="chart-tooltip" id="${id}-tooltip"></div>`;

  const halfW = n > 1 ? plotW / (n - 1) / 2 : 20;
  const idxAt = relX => {
    if (relX < padL - halfW || relX > W - padR + halfW) return -1;
    let best = 0, bd = Infinity;
    months.forEach((m, i) => { const d = Math.abs(x(i) - relX); if (d < bd) { bd = d; best = i; } });
    return best;
  };
  return { html, months, series: usable, x, y, W, H, id, fmtV, tooltipLabelFn, xc: x, halfW, padT, padB, idxAt };
}
// Generic hover/crosshair wiring for a buildLineChart() result — one tooltip
// listing every series' value for whichever month is nearest the cursor
// (multi-series equivalent of the single-line hover already used in the
// Retention detail page). `container` is the element the chart's HTML was
// inserted into.
function wireLineChartHover(container, chart) {
  if (!chart.months || !chart.months.length) return;
  const svgEl = container.querySelector('svg');
  const tooltip = container.querySelector(`#${chart.id}-tooltip`);
  const crosshair = container.querySelector(`#${chart.id}-crosshair`);
  if (!svgEl || !tooltip || !crosshair) return;
  const showMonth = i => {
    const rect = svgEl.getBoundingClientRect();
    const px = chart.x(i) / chart.W * rect.width;
    crosshair.setAttribute('x1', chart.x(i));
    crosshair.setAttribute('x2', chart.x(i));
    crosshair.setAttribute('opacity', '1');
    const lines = chart.series.map(s => {
      const p = s.points[i];
      if (!p || p.v == null) return null;
      return `<span style="color:${s.color}">●</span> ${esc(s.name)}: <span class="tv">${esc(chart.fmtV(p.v))}</span>`;
    }).filter(Boolean).join('<br>');
    if (!lines) return;
    tooltip.innerHTML = `${esc(chart.tooltipLabelFn(chart.months[i]))}<br>${lines}`;
    tooltip.style.left = px + 'px';
    const firstVal = chart.series.find(s => s.points[i] && s.points[i].v != null)?.points[i].v;
    tooltip.style.top = (firstVal != null ? chart.y(firstVal) / chart.H * rect.height : rect.height / 2) + 'px';
    tooltip.classList.add('visible');
  };
  const hide = () => { crosshair.setAttribute('opacity', '0'); tooltip.classList.remove('visible'); };
  container.addEventListener('mousemove', e => {
    const rect = svgEl.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width * chart.W;
    let nearest = 0, best = Infinity;
    chart.months.forEach((m, i) => { const d = Math.abs(chart.x(i) - relX); if (d < best) { best = d; nearest = i; } });
    showMonth(nearest);
  });
  container.addEventListener('mouseleave', hide);
}

// Vertical grouped-bar counterpart to buildLineChart() — same seriesList
// shape ({ name, color, points: [{ m, v }] }, every series sharing one
// x-axis sequence), rendered as side-by-side bars per period instead of
// lines. Built for Target-vs-Landed (monthly and yearly), so period labels
// are pluggable via opts.labelFn — monthLabelShort() by default, but the
// yearly chart passes the raw year string through unchanged. Uses plain SVG
// <title> tooltips rather than the crosshair/hover system those line charts
// use, since bars are already discrete, individually-hoverable targets.
function buildGroupedBarChart(seriesList, opts = {}) {
  const { yUnit = '', id = 'gb', labelFn = monthLabelShort, tooltipLabelFn = monthLabel, lineSeries = [], projectedFrom = null } = opts;
  const usable = seriesList.filter(s => s.points && s.points.length);
  if (!usable.length) return { html: '<div class="empty">No data to plot yet.</div>', months: [] };
  // A series named in `lineSeries` (e.g. Target) draws as a short threshold
  // tick at its value instead of a bar — two same-shaped bars side by side
  // are hard to tell apart at a glance, where a line reads instantly as
  // "the goal line for this bar".
  const barSeries = usable.filter(s => !lineSeries.includes(s.name));
  const markerSeries = usable.filter(s => lineSeries.includes(s.name));
  const months = usable[0].points.map(p => p.m);
  const n = months.length;
  const W = 900, H = 280, padL = 46, padR = 18, padT = 16, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const allVals = usable.flatMap(s => s.points.map(p => p.v).filter(v => v != null));
  const domainMax = Math.max(0, allVals.length ? Math.max(...allVals) : 0);
  const step = niceStep(domainMax);
  const maxV = Math.max(step, Math.ceil((domainMax * 1.12) / step) * step);
  const groupW = n === 1 ? plotW : plotW / n;
  const x = i => padL + i * groupW;
  const y = v => padT + (1 - v / (maxV || 1)) * plotH;
  const fmtV = v => yUnit === '£' ? fmtMoney(v) : Math.round(v).toLocaleString();

  let gridSvg = '';
  for (let v = 0; v <= maxV + 0.001; v += step) {
    const yy = y(v);
    const label = yUnit === '£' ? fmtMoney(v) : `${Math.round(v)}${yUnit}`;
    gridSvg += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL - 8}" y="${yy + 3}" text-anchor="end" font-size="10" fill="var(--text-muted)">${esc(label)}</text>`;
  }

  const labelEvery = Math.max(1, Math.ceil(n / 10));
  let xLabelsSvg = '';
  months.forEach((m, i) => {
    if (i % labelEvery === 0 || i === n - 1) {
      xLabelsSvg += `<text x="${x(i) + groupW / 2}" y="${H - padB + 16}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${esc(labelFn(m))}</text>`;
    }
  });

  const barGap = 3;
  const barCount = Math.max(1, barSeries.length);
  const barW = Math.max(3, (groupW - barGap * (barCount + 1)) / barCount);
  let barsSvg = '';
  months.forEach((m, i) => {
    barSeries.forEach((s, si) => {
      const p = s.points[i];
      const v = p?.v;
      if (v == null) return;
      const bx = x(i) + barGap + si * (barW + barGap);
      const yy = y(v);
      const fill = p.color || s.color;
      const label = p.tooltipLabel || s.name;
      barsSvg += `<rect x="${bx}" y="${yy}" width="${barW}" height="${(H - padB) - yy}" fill="${fill}" rx="2"><title>${esc(label)} — ${esc(tooltipLabelFn(m))}: ${esc(fmtV(v))}</title></rect>`;
    });
  });
  // Marker lines span the same horizontal space the bar(s) occupy in that
  // group, sitting at the series' value — "a line on or above each bar".
  let markersSvg = '';
  months.forEach((m, i) => {
    markerSeries.forEach(s => {
      const v = s.points[i]?.v;
      if (v == null) return;
      const yy = y(v);
      const mx1 = x(i) + barGap, mx2 = x(i) + groupW - barGap;
      markersSvg += `<line x1="${mx1}" y1="${yy}" x2="${mx2}" y2="${yy}" stroke="${s.color}" stroke-width="3" stroke-linecap="round"><title>${esc(s.name)} — ${esc(tooltipLabelFn(m))}: ${esc(fmtV(v))}</title></line>`;
    });
  });

  // Shaded "projected" zone — everything from the first projected month on.
  let projSvg = '';
  const projIdx = projectedFrom ? months.indexOf(projectedFrom) : -1;
  if (projIdx >= 0) {
    const px0 = x(projIdx);
    projSvg = `<rect x="${px0}" y="${padT}" width="${W - padR - px0}" height="${H - padT - padB}" fill="var(--accent)" opacity="0.07"/>
      <line x1="${px0}" y1="${padT}" x2="${px0}" y2="${H - padB}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <text x="${px0 + 6}" y="${padT + 11}" font-size="10" fill="var(--accent)">Projected →</text>`;
  }

  const html = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${gridSvg}
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--border-hi)" stroke-width="1"/>
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--border-hi)" stroke-width="1"/>
      ${projSvg}
      ${barsSvg}
      ${markersSvg}
      ${xLabelsSvg}
    </svg>`;
  const idxAt = relX => { const i = Math.floor((relX - padL) / groupW); return (relX < padL || i < 0 || i >= n) ? -1 : i; };
  return { html, months, W, H, padT, padB, xc: i => x(i) + groupW / 2, halfW: groupW / 2, idxAt };
}

// A neutral-grey fade for ranked bar lists — row 0 (the top/longest bar)
// gets a near-white grey, darkening down to a muted grey by the last
// (shortest) row, so the longer a bar is, the more it stands out — without
// borrowing green/blue (already meaningful colors elsewhere — good/bad,
// target lines) for something that's just a ranking.
function greyFade(i, n) {
  const from = [229, 229, 234]; // near-white — longest bar
  const to = [96, 96, 105]; // darker grey — shortest bar
  const t = n > 1 ? i / (n - 1) : 0;
  const rgb = from.map((v, k) => Math.round(v + (to[k] - v) * t));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}
// A simple horizontal bar comparison — not a time series. Rows are already
// sorted by the caller; each is { name, value, count }. Used to compare
// groups (e.g. industries) against each other at a glance, side by side,
// rather than plotting anything over time.
function buildBarChart(rows, opts = {}) {
  // `colorFn(i, total)` overrides the flat `color` per row — used to fade
  // each bar lighter down the ranking (rows arrive pre-sorted by the
  // caller, best first) instead of one flat fill for every bar.
  const { fmt = v => v, color = 'var(--accent-to)', colorFn, metric, dim } = opts;
  if (!rows.length) return '<div class="empty">Not enough classified clients yet to compare.</div>';
  const maxVal = Math.max(1, ...rows.map(r => r.value || 0));
  const detailAttrs = r => metric ? `data-bucket-detail="${esc(r.name)}" data-metric="${metric}" data-dim="${esc(dim)}"` : '';
  return `<div class="ins-bars">${rows.map((r, i) => {
    const pct = r.value != null ? Math.max(3, r.value / maxVal * 100) : 0;
    const fill = colorFn ? colorFn(i, rows.length) : color;
    return `<div class="ins-bar-row">
      <div class="ins-bar-label" title="${esc(r.name)}">${esc(r.name)}</div>
      <div class="ins-bar-track"><div class="ins-bar-fill" style="width:${pct}%; background:${fill}"></div></div>
      <div class="ins-bar-value${metric ? ' clickable-stat' : ''}" ${detailAttrs(r)}>${r.value != null ? fmt(r.value) : '—'} <span class="dim">(${r.count})</span></div>
    </div>`;
  }).join('')}</div>`;
}

// "Stacked" comparison view — LTV and tenure bars for the same group paired
// directly on top of each other, row-aligned, instead of two separate
// leaderboards. `rows`: { name, ltv, ltvCount, tenure, tenureCount }[].
// `sortMode` 'ltv'/'tenure' ranks by that metric; 'list' keeps the caller's
// given order (e.g. Settings' defined company-size band order, where a
// plain alphabetical sort would wrongly put "1001+" before "51-200").
function buildCompareBars(rows, sortMode, dim) {
  if (!rows.length) return '<div class="empty">Not enough classified clients yet to compare.</div>';
  const sorted = sortMode === 'tenure' ? [...rows].sort((a, b) => (b.tenure ?? -1) - (a.tenure ?? -1))
    : sortMode === 'ltv' ? [...rows].sort((a, b) => (b.ltv ?? -1) - (a.ltv ?? -1))
    : rows;
  const maxLtv = Math.max(1, ...rows.map(r => r.ltv || 0));
  const maxTenure = Math.max(1, ...rows.map(r => r.tenure || 0));
  return sorted.map(r => {
    const ltvPct = r.ltv != null ? Math.max(3, r.ltv / maxLtv * 100) : 0;
    const tenurePct = r.tenure != null ? Math.max(3, r.tenure / maxTenure * 100) : 0;
    return `<div class="ins-compare-group">
      <div class="ins-compare-name">${esc(r.name)}</div>
      <div class="ins-bar-row">
        <div class="ins-bar-label" style="width:60px">${insTerm('LTV')}</div>
        <div class="ins-bar-track"><div class="ins-bar-fill" style="width:${ltvPct}%; background:var(--neutral)"></div></div>
        <div class="ins-bar-value clickable-stat" data-bucket-detail="${esc(r.name)}" data-metric="ltv" data-dim="${esc(dim)}">${r.ltv != null ? fmtMoney(r.ltv) : '—'} <span class="dim">(${r.ltvCount})</span></div>
      </div>
      <div class="ins-bar-row">
        <div class="ins-bar-label" style="width:60px">Tenure</div>
        <div class="ins-bar-track"><div class="ins-bar-fill" style="width:${tenurePct}%; background:var(--neutral)"></div></div>
        <div class="ins-bar-value clickable-stat" data-bucket-detail="${esc(r.name)}" data-metric="tenure" data-dim="${esc(dim)}">${r.tenure != null ? r.tenure.toFixed(1) + ' mo' : '—'} <span class="dim">(${r.tenureCount})</span></div>
      </div>
    </div>`;
  }).join('');
}
// Clicking a bar's value (in either the separate or stacked comparison
// layouts) shows exactly which churned clients make up that average, since
// "£22,872 (21)" on its own doesn't say who's in the 21 — matches the same
// Realised (churned-only) set the bar itself was built from.
function showBucketDetailModal(dim, bucketName, metric, basis, allClients = DB.clients) {
  const bucket = clientBuckets(dim, allClients).find(b => b.name === bucketName);
  const clients = bucket ? bucket.clients : [];
  const valueFn = metric === 'ltv' ? clientLifetimeValue : clientMaxMonthNo;
  const churned = clients.filter(c => c.status === 'churned');
  const active = clients.filter(c => c.status !== 'churned');
  let rows;
  if (basis === 'running') {
    rows = active.map(c => ({ name: c.companyName, value: valueFn(c.id), tag: '' }));
  } else if (basis === 'combination') {
    const realisedAvg = avgOf(churned.map(c => valueFn(c.id)));
    const qualifyingActive = realisedAvg != null ? active.filter(c => valueFn(c.id) > realisedAvg) : [];
    rows = [
      ...churned.map(c => ({ name: c.companyName, value: valueFn(c.id), tag: 'Churned' })),
      ...qualifyingActive.map(c => ({ name: c.companyName, value: valueFn(c.id), tag: 'Active (qualifying)' })),
    ];
  } else {
    rows = churned.map(c => ({ name: c.companyName, value: valueFn(c.id), tag: '' }));
  }
  rows.sort((a, b) => b.value - a.value);
  const fmt = metric === 'ltv' ? fmtMoney : v => v.toFixed(1) + ' mo';
  const metricLabel = metric === 'ltv' ? 'LTV' : 'Tenure';
  const basisLabel = BASIS_LABEL[basis] || 'Realised';
  const avg = avgOf(rows.map(r => r.value));
  const noun = basis === 'running' ? 'active client' : basis === 'combination' ? 'client' : 'churned client';
  const showTag = basis === 'combination';
  openModal(`
    <div class="modal-head"><h3>${esc(basisLabel)} ${esc(metricLabel)} — ${esc(bucketName)}</h3><button class="modal-x" data-close>×</button></div>
    <p class="note" style="margin-bottom:14px">${rows.length} ${esc(noun)}${rows.length === 1 ? '' : 's'}, averaging ${avg != null ? fmt(avg) : '—'}.</p>
    <div class="tbl-wrap" style="max-height:400px; overflow-y:auto">
      <table>
        <thead><tr><th>Client</th>${showTag ? '<th>Status</th>' : ''}<th class="num">${esc(metricLabel)}</th></tr></thead>
        <tbody>${rows.length ? rows.map(r => `<tr><td>${esc(r.name)}</td>${showTag ? `<td class="dim small">${esc(r.tag)}</td>` : ''}<td class="num">${fmt(r.value)}</td></tr>`).join('')

}

/* ════════════════ INSIGHTS VIEW ════════════════ */
const INS_DIM_LABEL = { general: 'General', wideIndustry: 'Wider industry', industry: 'Industry', companySize: 'Company size', country: 'Country' };
const INS_DIM_SETTINGS_KEY = { wideIndustry: 'wideIndustries', industry: 'industries', companySize: 'companySizes', country: 'countries' };
// Trims a month-keyed row list to the trailing insTrendScale window — always
// first dropping anything after the real current month, since invoices get
// auto-generated ahead of time as the Invoices tab is browsed, and a trend
// chart shouldn't silently run into the future because of that.
function insTrendWindow(rows) {
  const upToNow = rows.filter(r => r.m <= currentMonthKey());
  if (state.insTrendScale === 'all') return upToNow;
  if (state.insTrendScale === 'ytd') return upToNow.filter(r => r.m >= fiscalYearStart(currentMonthKey()));
  if (state.insTrendScale === 'custom') {
    const a = state.insTrendFrom || '0000-01', b = state.insTrendTo || '9999-12';
    const lo = a <= b ? a : b, hi = a <= b ? b : a;
    return upToNow.filter(r => r.m >= lo && r.m <= hi);
  }
  return upToNow.slice(-Number(state.insTrendScale));
}
// Revenue page "Projections" timeframe: the future months the target line runs
// over — the N months after the real current month (or, for 'all', every month
// up to the last one with a target). Capped at the last month a target is
// actually set for, since there is nothing to draw beyond that.
const insRevenueMonthList = () => [...new Set([...invoiceMonths(), ...Object.keys(DB.settings.revenueTargets)])]
  .filter(m => m <= currentMonthKey()).sort();
// How many months the Past data selection covers (YTD and All depend on the data).
function insPastSpan() {
  if (/^\d+$/.test(state.insTrendScale)) return Number(state.insTrendScale);
  return insTrendWindow(insRevenueMonthList().map(m => ({ m }))).length;
}
// How many months ahead the Projections selection asks for — with Mirror on,
// always the same span as Past data; 0 means projections are off.
function insProjectionSpan() {
  if (state.insProjMirror) return insPastSpan();
  const k = state.insProjScale;
  return !k || k === 'off' ? 0 : Number(k);
}
function insProjectionMonths() {
  const n = insProjectionSpan();
  if (!n) return [];
  const cur = currentMonthKey();
  const targets = DB.settings.revenueTargets || {};
  const lastTarget = Object.keys(targets).filter(m => m > cur && targets[m] != null).sort().pop();
  if (!lastTarget) return [];
  const out = [];
  for (let i = 1; i <= n; i++) {
    const m = addMonths(cur, i);
    if (m > lastTarget) break;
    out.push(m);
  }
  return out;
}
// The "current month" row from a retentionRows()-shaped list — never a
// pre-generated future month (invoices get auto-generated ahead of time as
// the Invoices tab is browsed, so the array's last entry can sit months
// into the future; this always anchors to the real current month instead).
function currentSnapshotRow(rows) {
  const upToNow = rows.filter(r => r.m <= currentMonthKey());
  return upToNow[upToNow.length - 1] || null;
}
// Jargon glossary — wraps an abbreviation in a dotted-underline span whose
// title attribute shows the full name and meaning on hover, so terms like

const INS_GLOSSARY = {

const insTerm = abbr => `<span title="${esc(INS_GLOSSARY[abbr] || '')}" style="border-bottom:1px dotted var(--text-dim); cursor:help">${abbr}</span>`;
const insSectionHead = (title, sub) => `<div class="ins-section-head"><h2>${esc(title)}</h2>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>`;

// The dashboard-wide Industry/Country/Size filter — narrows which clients
// every Overview stat and detail page is computed from. Independent from
// insDim (the LTV detail's own "group by" picker): both can be active at
// once, e.g. narrow to Country = UK here, then still rank those UK clients'
// LTV by Industry inside the LTV detail.
function dashboardFilteredClients() {
  const match = (val, filter) => !filter || (filter === UNCLASSIFIED ? !val : val === filter);
  return DB.clients.filter(c =>
    match(wideIndustryOf(c), state.insFilterWide) &&
    match(c.industry, state.insFilterIndustry) &&
    match(c.country, state.insFilterCountry) &&
    match(c.companySize, state.insFilterSize));

// Router for the unified Insights/Retention hub: one tab, four pages
// (Overview + three detail views), sharing a fade+slide transition between
// pages. The filter bar (industry/country/size/time-frame) only appears on

function renderInsights() {
  const view = document.getElementById('view-insights');
  if (!DB) return;

    </select>`;

  view.innerHTML = `

            ${filterDimSelect('ins-filter-country', 'countries', DB.settings.countries, state.insFilterCountry, 'country')}

          ${page === 'retention' || page === 'revenue' ? '' : `
            <div class="pills" id="ins-trend-pills" title="How many months of history the trend charts below plot — Year-to-date runs 1 Aug to the current month">
              ${[['1', '1M'], ['3', '3M'], ['6', '6M'], ['12', '12M'], ['ytd', 'YTD'], ['24', '24M'], ['all', 'All']].map(([k, l]) => `<button class="pill ${state.insTrendScale === k ? 'active' : ''}" data-scale="${k}">${l}</button>`).join('')}

  const goTo = p => { state.insNavDir = p === 'overview' ? 'back' : 'fwd'; state.insPage = p; state.insBarsAnim = true; renderInsights(); };

  const filterCountryEl = view.querySelector('#ins-filter-country');

// Trailing N months ending at the real current month — e.g. the "Year" bar
// means the last 12 months of activity, not however much of Jan–Dec has
// happened so far.
function trailingMonths(rows, n) {
  const upToNow = rows.filter(r => r.m <= currentMonthKey());
  return upToNow.slice(-n).map(r => r.m);
}
// Landed/Expected/Goal summed across an arbitrary set of months — shared by
// the Year bar and the time-frame-toggle bar, since both are just "sum
// these months" with a different month list.
function sumRevenueOverMonths(rows, months) {
  const landed = months.reduce((s, m) => s + landedForMonth(m), 0);
  const expected = rows.filter(r => months.includes(r.m)).reduce((s, r) => s + (r.expected ?? r.mrr ?? 0), 0);
  let goal = null;
  months.forEach(m => { const t = targetForMonth(m); if (t != null) goal = (goal || 0) + t; });
  return { landed, expected, goal };
}
// Three mutually-stacked segments against a shared scale (the largest of
// goal/expected/landed, so the bar never clips): Landed (bright, real cash),
// Expected-not-yet-landed (orange, the rest of what's due), Goal gap
// (hashed, same "projection not real data" treatment used on the Invoices
// tab's bars). Shared by the Overview's Revenue tile and the Revenue
// detail page's own "This period" snapshot, so the two can never disagree.
// The financial year's monthly sections for the Year-to-date bar: each month with a target gets a
// chunk the size of its target, laid end to end, so the boundaries are the cumulative targets
// (Aug | Aug+Sep | Aug+Sep+Oct | …). Months with no target have no chunk.
function fySections(months) {
  let cum = 0;
  const out = [];
  for (const m of months) {
    const t = targetForMonth(m);
    if (t == null || !(t > 0)) continue;
    out.push({ m, from: cum, to: cum + t, target: t });
    cum += t;
  }
  return out;
}
function revBarStats(landed, expected, goal, goal2 = null) {
  // goal  — the target to compare against right now (for the Year-to-date bar: the cumulative target
  //         for the months gone so far).
  // goal2 — optional second, larger target (the Year-to-date bar: the cumulative target for the whole
  //         financial year). When given, the bar's scale runs out to it.
  const scale = Math.max(goal2 || 0, goal || 0, expected, landed, 1);
  const landedAmt = landed;
  const expectedAmt = Math.max(0, expected - landed);
  const goalGapAmt = goal != null ? Math.max(0, goal - expected) : 0;
  // Gap to the second target: from wherever the bar / first target ends out to the second target.
  const goal2GapAmt = goal2 != null ? Math.max(0, goal2 - Math.max(expected, goal || 0)) : 0;
  return {
    scale,
    landedPct: landedAmt / scale * 100, landedAmt,
    expectedPct: expectedAmt / scale * 100, expectedAmt,
    goalGapPct: goalGapAmt / scale * 100, goalGapAmt,
    goal2GapPct: goal2GapAmt / scale * 100, goal2GapAmt,
    // Where each goal sits on the shared scale — drawn as a line on the bar whether the goal was
    // missed (it marks the end of the hashed gap) or exceeded (the point the bar passed).
    goalPct: goal != null ? goal / scale * 100 : null, goalAmt: goal,
    goal2Pct: goal2 != null ? goal2 / scale * 100 : null, goal2Amt: goal2,
  };
}
// Compact "which months is this actually summing" caption — a single month
// shows as itself, a range as "Aug 26 – Oct 26", so a reader never has to
// guess what a bar labelled just "Year" or "YTD" actually covers.
function monthRangeLabel(months) {
  if (!months.length) return '';
  if (months.length === 1) return monthLabelShort(months[0]);
  return `${monthLabelShort(months[0])} – ${monthLabelShort(months[months.length - 1])}`;
}
function revBarRowHtml(label, bar, subLabel, idx = 0, cls = '', noDetail = false) {

  // Always the same label-column width (whether or not a row has a
  // sub-label) so every bar track starts and ends at the same x position —
  // otherwise a date range on Year/the scale bar but not Month shifts that

  return `<div class="progress-bar-row ${cls}" style="--i:${idx}">
    <div class="progress-bar-label" style="width:120px; white-space:normal; line-height:1.3; text-transform:none; letter-spacing:0; font-size:12px">
      ${esc(label)}
      ${subLabel ? `<div style="font-size:9px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--text-muted); margin-top:2px">${esc(subLabel)}</div>` : ''}
    </div>
    ${bar.sections ? '<div class="progress-bar-wrap">' : ''}
    <div class="progress-bar"${detailId ? ` data-bar="${detailId}"` : ''} title="Landed (green) vs. expected if every due invoice lands (orange) vs. goal (hashed)${subLabel ? ` — ${esc(subLabel)}` : ''}">
      <div class="progress-seg" data-desc="Cash received — invoices already paid" style="width:${bar.landedPct}%; background:var(--success)" title="Landed — ${esc(fmtMoney(bar.landedAmt))}">${bar.landedPct >= 14 ? `<span>${esc(fmtMoney(bar.landedAmt))}</span>` : ''}</div>
      <div class="progress-seg" data-desc="Invoices due in this period that haven't been paid yet (uncertain ones excluded)" style="width:${bar.expectedPct}%; background:var(--warn)" title="Expected, not yet landed — ${esc(fmtMoney(bar.expectedAmt))}">${bar.expectedPct >= 14 ? `<span>${esc(fmtMoney(bar.expectedAmt))}</span>` : ''}</div>
      ${bar.goalGapPct > 0 ? `<div class="progress-gap" data-desc="${bar.goal2Amt != null ? 'Still to land to reach the target for the months gone so far' : 'Still to land to reach the goal'}" style="width:${bar.goalGapPct}%" title="${bar.goal2Amt != null ? 'Gap to target to date' : 'Gap to goal'} — ${esc(fmtMoney(bar.goalGapAmt))}">${bar.goalGapPct >= 14 ? `<span>${esc(fmtMoney(bar.goalGapAmt))}</span>` : ''}</div>` : ''}
      ${(bar.sections || []).slice(0, -1).map(sc => `<div class="progress-split" style="left:${sc.to / bar.scale * 100}%"></div>`).join('')}
      ${bar.goal2GapPct > 0 ? `<div class="progress-gap fy" data-desc="Still needed, beyond the target to date, to reach the full-year target" style="width:${bar.goal2GapPct}%" title="Gap to the full-year target — ${esc(fmtMoney(bar.goal2GapAmt))}">${bar.goal2GapPct >= 14 ? `<span>${esc(fmtMoney(bar.goal2GapAmt))}</span>` : ''}</div>` : ''}
      ${bar.goalPct != null ? `<div class="progress-goal" data-desc="${bar.goal2Amt != null ? 'The cumulative target for the months gone so far' : 'The target for this period'}" style="left:min(calc(${bar.goalPct}% - 1px), calc(100% - 2px))" title="${bar.goal2Amt != null ? 'Target to date' : 'Goal'} — ${esc(fmtMoney(bar.goalAmt))}${bar.goalGapPct > 0 ? '' : ' (exceeded)'}"></div>` : ''}
      ${bar.goal2Pct != null ? `<div class="progress-goal fy" data-desc="The cumulative target for the whole financial year (August to July)" style="left:min(calc(${bar.goal2Pct}% - 1px), calc(100% - 2px))" title="Full-year target — ${esc(fmtMoney(bar.goal2Amt))}"></div>` : ''}
    </div>
    ${bar.sections ? `<div class="progress-months">${bar.sections.map(sc => { const cur = currentMonthKey(); return `<span class="pm ${sc.m < cur ? 'done' : sc.m === cur ? 'cur' : 'future'}" style="left:${(sc.from + sc.to) / 2 / bar.scale * 100}%" title="${esc(monthLabel(sc.m))} — target ${esc(fmtMoney(sc.target))} · cumulative ${esc(fmtMoney(sc.to))}">${MON3[Number(sc.m.slice(5)) - 1]}</span>`; }).join('')}</div></div>` : ''}
  </div>`;
}
// Legend for revBarRowHtml's three segments — a plain dot for each solid
// colour, and a small swatch of the actual hash pattern for the goal gap,
// so "what does each part of the bar mean" never has to be guessed.
function revBarLegendHtml({ fy = false } = {}) {
  return `<div class="chart-legend">
    <span class="key"><span class="dot" style="background:var(--success)"></span>Landed</span>
    <span class="key"><span class="dot" style="background:var(--warn)"></span>Expected, not yet landed</span>
    <span class="key"><span class="swatch" style="width:14px; height:10px; border:none; border-radius:2px; background:repeating-linear-gradient(135deg, transparent 0 5px, rgba(239,68,68,.35) 5px 6px); box-shadow:inset 0 0 0 1px rgba(239,68,68,.45)"></span>Gap to goal</span>
    <span class="key"><span style="display:inline-block; width:2px; height:12px; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.4)"></span>Goal line</span>
    ${fy ? `<span class="key"><span class="swatch" style="width:14px; height:10px; border:none; border-radius:2px; background:repeating-linear-gradient(135deg, transparent 0 5px, rgba(245,158,11,.4) 5px 6px); box-shadow:inset 0 0 0 1px rgba(245,158,11,.55)"></span>Gap to year target</span>
    <span class="key"><span style="display:inline-block; width:2px; height:12px; background:var(--warn)"></span>Year target line</span>
    <span class="key"><span style="display:inline-block; width:1px; height:12px; background:rgba(255,255,255,.55)"></span>Month sections (each month's target)</span>` : ''}
  </div>`;
}

// Overview — three stacked, expanded preview sections (not narrowed by any
// filter — always the whole client base, since a dashboard-wide filter here
// had nothing left to usefully narrow once each tile became a full preview
// in its own right), each still clickable through to its fuller detail page.
function renderInsOverview(bodyEl, goTo) {
  const rows = retentionRows();
  // Capped to the real current month — never a pre-generated future one.
  const withPct = rows.filter(r => r.churnPct != null && r.m <= currentMonthKey());
  const latest = currentSnapshotRow(rows);
  const fyStart = latest ? fiscalYearStart(latest.m) : null;
  const goals = DB.settings.retention;
  const windows = [
    ['Last month churn', withPct.slice(-1)],
    ['Last 3 months churn', withPct.slice(-3)],
    ['Last 12 months churn', withPct.slice(-12)],
    ['Year-to-date churn', fyStart ? withPct.filter(r => r.m >= fyStart) : []],
    ['All time churn', withPct],
  ];
  const retWindowStats = windows.map(([label, subset]) => ({ label, w: weightedChurn(subset) }));
  const retChart = buildChurnChart(rows, '12', goals, null, ['churn']);

  const churned = DB.clients.filter(c => c.status === 'churned');
  const avgMonthsToChurn = avgOf(churned.map(c => clientMaxMonthNo(c.id)));

  const ltvCombined = basisPick(ltvSummary(DB.clients), 'combination');
  const tenureCombined = basisPick(tenureSummary(DB.clients), 'combination');

  // Top-5-by-metric mini comparison bars — Combination basis always, same as
  // the tile's headline LTV/tenure stats above, so the whole tile reads as
  // one consistent basis rather than mixing in whatever state.insBasis
  // happens to be set to on the (separate) LTV detail page.
  const topBuckets = (field, metric, n = 5) => {
    const rows = clientBuckets(field)
      .filter(b => b.name !== 'Unclassified' && b.name !== 'Not grouped')
      .map(b => ({
        name: b.name,
        ltv: basisPick(ltvSummary(b.clients), 'combination'),
        tenure: basisPick(tenureSummary(b.clients), 'combination'),
      }))
      .map(r => ({ name: r.name, value: r[metric].avg, count: r[metric].count }))
      .filter(r => r.value != null);
    rows.sort((a, b) => b.value - a.value);
    return rows.slice(0, n);
  };
  const miniBarBlock = (dimLabel, dimField) => `
    <div style="margin-top:16px">
      <h3 style="font-size:12px; color:var(--text-dim); margin-bottom:8px">${esc(dimLabel)} — top 5</h3>
      <div style="margin-bottom:14px">
        <div class="note" style="margin-bottom:6px">Combination ${insTerm('LTV')}</div>
        ${buildBarChart(topBuckets(dimField, 'ltv'), { fmt: fmtMoney, colorFn: greyFade, metric: 'ltv', dim: dimField })}
      </div>
      <div>
        <div class="note" style="margin-bottom:6px">Tenure</div>
        ${buildBarChart(topBuckets(dimField, 'tenure'), { fmt: v => v.toFixed(1) + ' mo', colorFn: greyFade, metric: 'tenure', dim: dimField })}
      </div>
    </div>`;

  const monthKey = currentMonthKey();
  const monthGoal = targetForMonth(monthKey);
  // "Expected" = every invoice due this period, landed or not (the retentionRows
  // `.mrr` field already sums all of a month's invoices regardless of paid
  // status) — i.e. what lands if every due invoice actually lands. "Landed" is
  // the real cash-in-hand subset of that, by paid date.
  const monthExpected = latest ? (latest.expected ?? latest.mrr) : 0;
  const monthLanded = landedForMonth(monthKey);
  const monthBar = { ...revBarStats(monthLanded, monthExpected, monthGoal), months: [monthKey] };
  // "Year" = the trailing 12 months ending at the current month, not the
  // Jan–Dec calendar year — so it always reads as "the last year", not
  // "however much of this calendar year has happened so far".
  const yearBarMonths = trailingMonths(rows, 12);
  const yearSums = sumRevenueOverMonths(rows, yearBarMonths);
  const yearBar = { ...revBarStats(yearSums.landed, yearSums.expected, yearSums.goal), months: yearBarMonths };
  // Year to date (1 Aug to now) sits between the current month and the 12-month bar —
  // left out when it's just the current month (August), and merged into the 12-month
  // bar's label when it covers exactly the same months (July).
  const ytdMonths = rows.filter(r => r.m <= monthKey && r.m >= fiscalYearStart(monthKey)).map(r => r.m);
  const sameMonthList = (a, b) => a.length === b.length && a.every((m, i) => m === b[i]);
  const ytdIsYear = false;   // Year to date is the whole financial year now, so it never merges into the 12-month bar
  const ytdSums = sumRevenueOverMonths(rows, ytdMonths);
  // Year to date covers the whole financial year: two target lines (to date / full year) — see insPeriodBarsHtml.
  const fyMonthList = Array.from({ length: 12 }, (_, k) => addMonths(fiscalYearStart(monthKey), k));
  const fyGoal = fyMonthList.reduce((g, m) => { const t = targetForMonth(m); return t == null ? g : (g || 0) + t; }, null);
  const ytdBar = { ...revBarStats(ytdSums.landed, ytdSums.expected, ytdSums.goal, fyGoal), sections: fySections(fyMonthList), months: ytdMonths, fyMonths: fyMonthList };
  const showYtdBar = ytdMonths.length > 0;
  const newThisMonth = latest ? (latest.newClients || 0) : 0;
  const newLast3 = withPct.slice(-3).reduce((s, r) => s + (r.newClients || 0), 0);

  bodyEl.innerHTML = `
    <div class="ov-grid">
      <div class="chart-card ov-tile" data-page="revenue" title="Click for billing trends, targets and package mix">
        <div class="chart-head"><h3>Revenue</h3></div>
        <div class="stats">
          <div class="stat"><div class="v">${fmtMoney(monthExpected)}</div><div class="l">Expected — ${monthLabelShort(monthKey)}</div><div class="s">${monthGoal != null ? `of ${fmtMoney(monthGoal)} goal` : 'no goal set'}</div></div>
          <div class="stat ok"><div class="v">${newThisMonth}</div><div class="l">New clients — ${monthLabelShort(monthKey)}</div></div>
          <div class="stat ok"><div class="v">${newLast3}</div><div class="l">New clients — last 3 months</div></div>
        </div>
        <div class="progress-bars spaced ${insBarsReveal ? 'reveal' : ''}" style="margin-top:14px">
          ${revBarRowHtml(monthLabel(monthKey), monthBar, '', 0, 'current')}
          ${showYtdBar ? revBarRowHtml('Year to date', ytdBar, monthRangeLabel(fyMonthList), 1) : ''}
          ${revBarRowHtml(ytdIsYear ? 'Last 12 months / year to date' : 'Last 12 months', yearBar, monthRangeLabel(yearBarMonths), showYtdBar ? 2 : 1)}
        </div>
        ${revBarLegendHtml({ fy: true })}
      </div>

      <div class="chart-card ov-tile" data-page="retention" title="Click for the full retention chart, table and custom date range">
        <div class="chart-head"><h3>Churn and Retention</h3></div>
        <div class="stats">
          ${retWindowStats.map(w => `<div class="stat ${goalClass(w.w?.pct, goals)}">
            <div class="v">${w.w ? w.w.pct.toFixed(1) + '%' : '—'}</div>
            <div class="l">${esc(w.label)}</div>
          </div>`).join('')}
        </div>
        <p class="note" style="margin:10px 0 14px">Avg months to churn: <strong>${avgMonthsToChurn != null ? avgMonthsToChurn.toFixed(1) : '—'}</strong></p>
        <div class="chart-head"><h3 style="font-size:12px; color:var(--text-dim)">Churn — last 12 months</h3></div>
        <div class="chart-wrap" id="ov-ret-chart-wrap">${retChart.html}</div>
      </div>

      <div class="chart-card ov-tile" data-page="ltv" title="Click for the full LTV & tenure breakdown">
        <div class="chart-head"><h3>Lifetime value</h3></div>
        <div class="stats">
          <div class="stat ok"><div class="v">${ltvCombined.avg != null ? fmtMoney(ltvCombined.avg) : '—'}</div><div class="l">Avg combined ${insTerm('LTV')}</div><div class="s">${ltvCombined.count} client${ltvCombined.count === 1 ? '' : 's'}</div></div>
          <div class="stat"><div class="v">${tenureCombined.avg != null ? tenureCombined.avg.toFixed(1) : '—'}</div><div class="l">Avg combined tenure (mo)</div><div class="s">${tenureCombined.count} client${tenureCombined.count === 1 ? '' : 's'}</div></div>
        </div>
        ${miniBarBlock('Wider industry', 'wideIndustry')}
        ${miniBarBlock('Country', 'country')}
      </div>

      <div id="ov-predict-tile"></div>
    </div>`;

  bodyEl.querySelectorAll('.ov-tile[data-page]').forEach(el => el.onclick = e => {
    // Clicking inside the churn-chart preview or a mini comparison bar's
    // value (which opens its own breakdown modal) shouldn't also navigate.
    if (e.target.closest('.chart-wrap') || e.target.closest('.ins-bars')) return;
    goTo(el.dataset.page);
  });

  bodyEl.querySelectorAll('[data-bucket-detail]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    showBucketDetailModal(el.dataset.dim, el.dataset.bucketDetail, el.dataset.metric, 'combination');
  });

  if (retChart.points.length) wireChurnChartHover(bodyEl.querySelector('#ov-ret-chart-wrap'), retChart);
  renderInsPredictTile(bodyEl.querySelector('#ov-predict-tile'));
}

// LTV detail — overall basis-picked LTV/tenure stats, plus (when a
// dimension other than General is selected) the by-dimension comparison
// charts and table. insDim/insBasis/insBarLayout/insBarSort are this page's
// own controls, independent of the dashboard-wide narrowing filter.
function renderInsLtvDetail(bodyEl, filteredClients) {
  const dimField = state.insDim;
  const dimLabel = INS_DIM_LABEL[dimField];
  const basis = state.insBasis;
  const basisLabel = BASIS_LABEL[basis];

  const overall = ltvSummary(filteredClients);
  const overallTenure = tenureSummary(filteredClients);
  const overallLtvPick = basisPick(overall, basis);
  const overallTenurePick = basisPick(overallTenure, basis);
  const classifiedCount = dimField === 'general' ? null : filteredClients.filter(c => fieldValue(c, dimField)).length;

  // "General" has no dimension to group by — the comparison/breakdown
  // section below is skipped entirely for it, leaving just the overall KPIs.
  const buckets = dimField === 'general' ? [] : clientBuckets(dimField, filteredClients);
  const ltvBucketRows = buckets.map(b => ({ name: b.name, count: b.clients.length, ...ltvSummary(b.clients) }));
  const tenureBucketRows = buckets.map(b => ({ name: b.name, count: b.clients.length, ...tenureSummary(b.clients) }));
  // One combined row per bucket — LTV and tenure for the same basis, side by
  // side, since both are far more useful read together than as two tables.
  const combinedRows = buckets.map((b, i) => {
    const ltvPick = basisPick(ltvBucketRows[i], basis);
    const tenurePick = basisPick(tenureBucketRows[i], basis);
    return { name: b.name, count: b.clients.length, basisCount: ltvPick.count, ltvAvg: ltvPick.avg, tenureAvg: tenurePick.avg };
  });

  // Cross-sectional comparison (not a trend) — each classified group's
  // LTV/tenure (in the selected basis) ranked against the others.
  // Unclassified is excluded here (it isn't a real segment to compare), same
  // as the churn trend chart below. Used both for the two separate
  // leaderboards and, in the stacked layout, zipped into one paired comparison.
  const classifiedCombinedRows = combinedRows.filter(r => r.name !== 'Unclassified' && r.name !== 'Not grouped' && r.ltvAvg != null);
  const ltvBarRows = [...classifiedCombinedRows].sort((a, b) => b.ltvAvg - a.ltvAvg)
    .map(r => ({ name: r.name, value: r.ltvAvg, count: r.basisCount }));
  const ltvBarHtml = buildBarChart(ltvBarRows, { fmt: fmtMoney, color: 'var(--neutral)', metric: 'ltv', dim: dimField });
  const tenureBarRows = [...classifiedCombinedRows].sort((a, b) => b.tenureAvg - a.tenureAvg)
    .map(r => ({ name: r.name, value: r.tenureAvg, count: r.basisCount }));
  const tenureBarHtml = buildBarChart(tenureBarRows, { fmt: v => v.toFixed(1) + ' mo', color: 'var(--neutral)', metric: 'tenure', dim: dimField });

  const listOrder = DB.settings[INS_DIM_SETTINGS_KEY[dimField]] || [];
  const compareRowsBase = state.insBarSort === 'list'
    ? [...classifiedCombinedRows].sort((a, b) => listOrder.indexOf(a.name) - listOrder.indexOf(b.name))
    : classifiedCombinedRows;
  const compareRows = compareRowsBase.map(r => ({ name: r.name, ltv: r.ltvAvg, ltvCount: r.basisCount, tenure: r.tenureAvg, tenureCount: r.basisCount }));
  const compareHtml = buildCompareBars(compareRows, state.insBarSort, dimField);

  bodyEl.innerHTML = `
    <div class="chart-card">
      <div class="chart-head">
        <h3>Lifetime value & tenure</h3>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
          <select id="ins-dim-select" title="General shows overall KPIs only; the other three group the comparison chart and table below by that dimension">
            ${Object.entries(INS_DIM_LABEL).map(([k, l]) => `<option value="${k}" ${dimField === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}
          </select>
          <select id="ins-basis-select" title="Realised = churned clients only, final figures. Running = active clients only, still growing. Combination = churned clients plus any active client already past the Realised average, blended into one number.">
            ${Object.entries(BASIS_LABEL).map(([k, l]) => `<option value="${k}" ${basis === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="stats">
        <div class="stat ok"><div class="v">${overallLtvPick.avg != null ? fmtMoney(overallLtvPick.avg) : '—'}</div><div class="l" title="${basis === 'realised' ? 'Average total paid by churned clients over their whole time as a customer — a final, complete figure.' : basis === 'running' ? 'Average total paid so far by clients who are still active, over however long they’ve each been a customer to date — still growing, not a final figure.' : 'Every churned client’s final total, plus any active client already past the Realised average, blended into one figure.'}">Avg ${basisLabel.toLowerCase()} ${insTerm('LTV')}</div><div class="s">${overallLtvPick.count} client${overallLtvPick.count === 1 ? '' : 's'}</div></div>
        <div class="stat"><div class="v">${overallTenurePick.avg != null ? overallTenurePick.avg.toFixed(1) : '—'}</div><div class="l" title="${basis === 'realised' ? 'Average months churned clients stayed before leaving — a final figure.' : basis === 'running' ? 'Average months active clients have been a customer so far — still counting up, not final.' : 'Every churned client’s final tenure, plus any active client already past the Realised average, blended into one figure.'}">Avg ${basisLabel.toLowerCase()} tenure</div><div class="s">${overallTenurePick.count} client${overallTenurePick.count === 1 ? '' : 's'}</div></div>
        ${dimField !== 'general' ? `<div class="stat"><div class="v">${classifiedCount}/${filteredClients.length}</div><div class="l" title="How many clients have this dimension set — unclassified clients still count in every KPI above, just not in the by-dimension breakdowns below">Classified by ${esc(dimLabel)}</div></div>` : ''}
      </div>
    </div>

    ${dimField === 'general' ? '' : `
    ${insSectionHead('Comparison', `${basisLabel} figures, by ${dimLabel.toLowerCase()}.`)}
    <div class="chart-card">
      <div class="chart-head">
        <h3 title="Compare ${esc(basisLabel)} LTV and tenure across groups — excludes Unclassified and any group with nothing to show yet">${esc(dimLabel)} comparison</h3>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
          <div class="pills" id="ins-barlayout-pills" title="Show LTV and tenure as two separate rankings, or paired together per group">
            <button class="pill ${state.insBarLayout === 'separate' ? 'active' : ''}" data-layout="separate">Separate</button>
            <button class="pill ${state.insBarLayout === 'stacked' ? 'active' : ''}" data-layout="stacked">Compare stacked</button>
          </div>
          ${state.insBarLayout === 'stacked' ? `<div class="pills" id="ins-barsort-pills" title="Order the groups below by">
            <button class="pill ${state.insBarSort === 'ltv' ? 'active' : ''}" data-sort="ltv">${insTerm('LTV')} rank</button>
            <button class="pill ${state.insBarSort === 'tenure' ? 'active' : ''}" data-sort="tenure">Tenure rank</button>
            <button class="pill ${state.insBarSort === 'list' ? 'active' : ''}" data-sort="list">List order</button>
          </div>` : ''}
        </div>
      </div>
      ${state.insBarLayout === 'stacked' ? compareHtml : `
        <div style="margin-bottom:18px"><h3 style="font-size:12px; color:var(--text-dim); margin-bottom:10px" title="Ranked highest to lowest">${esc(basisLabel)} ${insTerm('LTV')} by ${esc(dimLabel.toLowerCase())}</h3>${ltvBarHtml}</div>
        <div><h3 style="font-size:12px; color:var(--text-dim); margin-bottom:10px" title="Ranked highest to lowest">Tenure by ${esc(dimLabel.toLowerCase())}</h3>${tenureBarHtml}</div>
      `}
    </div>

    <div class="tbl-wrap">
      <table>
        <thead><tr><th>${esc(dimLabel)}</th><th class="num">Clients</th><th class="num">${esc(basisLabel)} count</th><th class="num">${esc(basisLabel)} ${insTerm('LTV')} avg</th><th class="num">Tenure avg (mo)</th></tr></thead>
        <tbody>
          ${combinedRows.map(r => `<tr>
            <td>${esc(r.name)}</td>
            <td class="num">${r.count}</td>
            <td class="num dim">${r.basisCount}</td>
            <td class="num money">${r.ltvAvg != null ? fmtMoney(r.ltvAvg) : '—'}</td>
            <td class="num">${r.tenureAvg != null ? r.tenureAvg.toFixed(1) : '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    `}
    <p class="note">${insTerm('LTV')} uses <strong>amount landed</strong> once paid (falling back to the invoiced amount as an estimate while unpaid) — the same basis used for commission. Realised ${insTerm('LTV')} and Realised tenure are final figures for churned clients only — clients still active aren't counted in either, since their totals aren't finished yet. Industry/size/country breakdowns reflect each client's <strong>current</strong> tag, since there's no historical change-log for these fields. "Unclassified" clients are excluded from the by-dimension bar charts to keep them legible, but count fully in every table and the overall KPIs above.</p>`;

  bodyEl.querySelector('#ins-dim-select').onchange = e => { state.insDim = e.target.value; renderInsights(); };
  bodyEl.querySelector('#ins-basis-select').onchange = e => { state.insBasis = e.target.value; renderInsights(); };
  bodyEl.querySelectorAll('#ins-barlayout-pills [data-layout]').forEach(p => p.onclick = () => { state.insBarLayout = p.dataset.layout; renderInsights(); });
  bodyEl.querySelectorAll('#ins-barsort-pills [data-sort]').forEach(p => p.onclick = () => { state.insBarSort = p.dataset.sort; renderInsights(); });
  bodyEl.querySelectorAll('[data-bucket-detail]').forEach(el => el.onclick = () => {
    showBucketDetailModal(el.dataset.dim, el.dataset.bucketDetail, el.dataset.metric, state.insBasis, filteredClients);
  });
}

// Revenue detail — monthly/yearly Target vs Landed charts, MRR trend,
// concentration, package mix, and sales attribution. Unlike LTV detail,
// this one isn't gated by insDim — it's always the full breakdown.
function renderInsRevenueDetail(bodyEl, filteredClients) {
  // "This period" bars are whole-company figures (unfiltered) built by
  // insPeriodBarsHtml(); the chart below needs just the current month's expected.
  const snapRows = retentionRows();
  const snapLatest = currentSnapshotRow(snapRows);
  const monthKey = currentMonthKey();
  const monthExpected = snapLatest ? (snapLatest.expected ?? snapLatest.mrr) : 0;

  // Months come from the union of invoiced months and months someone's
  // actually set a target for, capped at the real current month — invoices
  // get auto-generated ahead of time as the Invoices tab is browsed, and
  // this chart shouldn't run into the future because of that. Landed is
  // bucketed by paid date (see landedForMonth), so it's a real cash-flow
  // figure, not a rebadged billing one.
  const revenueMonths = insRevenueMonthList();
  const pastRows = insTrendWindow(revenueMonths.map(m => ({ m })));
  // Projections: the chosen number of future months, target line only — there
  // is no MRR to show for a month that hasn't happened yet.
  const projMonths = insProjectionMonths();
  const revMonthRows = [...pastRows, ...projMonths.map(m => ({ m, projected: true }))];
  const revMonthlySeries = [
    { name: 'Target', color: 'var(--accent)', points: revMonthRows.map(r => ({ m: r.m, v: targetForMonth(r.m) })) },
    // MRR here is cash landed for a completed month; for the current
    // (still-elapsing) month it's what's expected to land — every invoice
    // due this month, landed or not — rather than cash-so-far, which would
    // just understate a month that isn't over. The orange shade + tooltip
    // signal that one bar is a projection, not a closed figure.
    { name: 'MRR', color: 'var(--success)', points: revMonthRows.map(r => r.projected
      ? { m: r.m, v: null }
      : r.m === monthKey
        ? { m: r.m, v: monthExpected, color: 'var(--warn)', tooltipLabel: 'MRR — expected to land' }
        : { m: r.m, v: landedForMonth(r.m) }) },
  ];
  const projectedFrom = projMonths[0] || null;
  const revMonthlyChart = state.insRevMonthlyChart === 'bar'

  const projAsked = insProjectionSpan();

    : !projMonths.length ? 'No future targets are set — add some in Operational Settings to project them.'
    : (projMonths.length < projAsked

    </div>

    ${insSectionHead('Revenue targets', 'Target vs. MRR — cash landed for completed months, expected-to-land for the current one. Past data sets how far back to look; Projections extends the target line ahead and compares it with the past. Set targets on Settings or directly on a month\'s Invoices tab.')}
    <div class="chart-card">
      <div class="chart-head">
        <h3>Monthly</h3>
        <div class="pills" id="ins-rev-m-pills" title="Chart type for the monthly Target vs MRR chart">
          <button class="pill ${state.insRevMonthlyChart === 'line' ? 'active' : ''}" data-revchart="m:line">Line</button>
          <button class="pill ${state.insRevMonthlyChart === 'bar' ? 'active' : ''}" data-revchart="m:bar">Bar</button>
        </div>
      </div>
      ${insRevTimeframesHtml()}
      <div class="chart-legend">
        ${state.insRevMonthlyChart === 'bar'
          ? `<span class="key"><span class="swatch" style="border-top-color:var(--accent)"></span>Target</span>`
          : `<span class="key"><span class="dot" style="background:var(--accent)"></span>Target</span>`}
        <span class="key"><span class="dot" style="background:var(--success)"></span>${insTerm('MRR')}</span>
        <span class="key"><span class="dot" style="background:var(--warn)"></span>${insTerm('MRR')} — expected to land (current month)</span>
        ${projMonths.length ? `<span class="key"><span style="display:inline-block; width:14px; height:10px; border-radius:2px; background:var(--accent); opacity:.18"></span>Projected — target only</span>` : ''}
      </div>

      ${comparisonHtml}
    </div>

    ${insSectionHead('Billing', 'Package mix and concentration across active clients.')}
    <div class="stats">
      <div class="stat"><div class="v">${conc.pct.toFixed(1)}%</div><div class="l" title="Share of total active MRR made up by the ${conc.topN} highest-fee active clients — a concentration-risk indicator">Top ${conc.topN} clients' share of ${insTerm('MRR')}</div></div>
