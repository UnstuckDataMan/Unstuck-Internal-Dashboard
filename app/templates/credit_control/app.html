// Retention detail — the full churn/new/left trend chart, custom date
// range, and month-by-month table. These windows (1/3/6/12 month) and the
// custom range are this page's own controls, distinct from the Overview
// tile's fixed 1/3/12/YTD/all-time summary.
function renderInsRetentionDetail(bodyEl, filteredClients) {
  const view = bodyEl;
  const rows = retentionRows(filteredClients);
  // Capped to the real current month — invoices get auto-generated ahead of
  // time, so the raw array can run into the future, and these window/latest
  // stats shouldn't silently pick up a not-really-happened-yet month.
  const withPct = rows.filter(r => r.churnPct != null && r.m <= currentMonthKey());
  const goals = DB.settings.retention;
  const latest = currentSnapshotRow(rows);

  // "This month" is the in-progress current month; every other window is
  // anchored to the last fully-elapsed month so the incomplete current
  // month doesn't skew them — "Last 3 months" means the 3 months before
  // this one, not this one plus the 2 before it.
  const curKey = currentMonthKey();
  const thisMonthRow = withPct.find(r => r.m === curKey);
  const pastMonths = withPct.filter(r => r.m < curKey);
  const windows = [
    ['This month', thisMonthRow ? [thisMonthRow] : []],
    ['Last month', pastMonths.slice(-1)],
    ['Last 3 months', pastMonths.slice(-3)],
    ['Last 6 months', pastMonths.slice(-6)],
    ['Last 12 months', pastMonths.slice(-12)],
  ];
  const windowStats = windows.map(([label, subset]) => ({ label, w: weightedChurn(subset) }));

  const monthOptions = invoiceMonths();
  // Defaults to the last 12 months (current month back to a year ago) —
  // only kicks in when unset, so a manually-picked range is never overridden.
  if (!state.retRangeEnd) {
    state.retRangeEnd = currentMonthKey();
  }
  if (!state.retRangeStart || state.retRangeStart > state.retRangeEnd) {
    state.retRangeStart = addMonthsToDate(`${state.retRangeEnd}-01`, -11).slice(0, 7);
  }
  const chart = buildChurnChart(rows, state.retScale, goals, { start: state.retRangeStart, end: state.retRangeEnd }, state.retMetrics);
  const RET_METRIC_LABEL = { churn: 'Churn', new: 'New clients', left: 'Clients left' };
  const chartTitle = state.retMetrics.map(m => RET_METRIC_LABEL[m]).join(' & ') + ' over time';

  // These stats follow whatever the chart is actually plotting (6M/12M/24M/
  // All/Custom), not always the From/To range — the two only coincide when
  // "Custom" is the selected window.
  const chartPts = chart.points || [];
  const chartChurnW = weightedChurn(chartPts);
  const avgNew = chartPts.length ? avgOf(chartPts.map(r => r.newClients || 0)) : null;
  const avgLeft = chartPts.length ? avgOf(chartPts.map(r => r.lost || 0)) : null;
  const chartRangeLabel = chartPts.length ? `${monthLabelShort(chartPts[0].m)} → ${monthLabelShort(chartPts[chartPts.length - 1].m)}` : 'No data shown';

  view.innerHTML = `
    <div class="stats">
      <div class="stat ok"><div class="v">${latest ? latest.count : 0}</div><div class="l">Clients — ${latest ? monthLabelShort(latest.m) : 'latest'}</div></div>
      <div class="stat"><div class="v">${latest ? fmtMoney(latest.mrr) : '—'}</div><div class="l">Billed — ${latest ? monthLabelShort(latest.m) : 'latest'}</div></div>
      ${windowStats.map(w => `<div class="stat ${goalClass(w.w?.pct, goals)}">
        <div class="v">${w.w ? w.w.pct.toFixed(1) + '%' : '—'}</div>
        <div class="l">${esc(w.label)} churn</div>
        <div class="s">${w.w ? `${w.w.lostSum} lost of ${w.w.baseSum}` : 'not enough data'}</div>
      </div>`).join('')}
    </div>

    <div class="range-card">
      <div class="fld"><label>From</label><button type="button" class="month-field" id="ret-range-start-btn">${esc(monthLabel(state.retRangeStart))}</button></div>
      <div class="fld"><label>To</label><button type="button" class="month-field" id="ret-range-end-btn">${esc(monthLabel(state.retRangeEnd))}</button></div>
      <div class="range-results">
        <div class="range-result" title="Weighted average churn over the months the chart below is currently showing">
          <div class="v" style="color:${chartChurnW ? goalColor(chartChurnW.pct, goals) : 'var(--text)'}">${chartChurnW ? chartChurnW.pct.toFixed(1) + '%' : '—'}</div>
          <div class="l">Avg churn</div>
          <div class="s">${esc(chartRangeLabel)}</div>
        </div>
        <div class="range-result" title="Average new clients per month over the months the chart below is currently showing">
          <div class="v" style="color:var(--accent)">${avgNew != null ? avgNew.toFixed(1) : '—'}</div>
          <div class="l">Avg new clients</div>
          <div class="s">per month</div>
        </div>
        <div class="range-result" title="Average clients left per month over the months the chart below is currently showing">
          <div class="v" style="color:var(--danger)">${avgLeft != null ? avgLeft.toFixed(1) : '—'}</div>
          <div class="l">Avg clients left</div>
          <div class="s">per month</div>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <h3>${chartTitle}</h3>
        <div class="pills">
          ${[['custom', 'Custom'], ['1', '1M'], ['3', '3M'], ['6', '6M'], ['12', '12M'], ['ytd', 'YTD'], ['24', '24M'], ['all', 'All']].map(([k, l]) => `<button class="pill ${state.retScale === k ? 'active' : ''}" data-scale="${k}"${k === 'custom' ? ' title="Match the From/To range set above"' : k === 'ytd' ? ' title="Since the last 1 August"' : ''}>${l}</button>`).join('')}
        </div>
      </div>
      <div class="pills" style="margin-bottom:12px" title="Toggle any combination of metrics to plot together">
        ${[['churn', 'Churn %'], ['new', 'New clients'], ['left', 'Clients left']].map(([k, l]) => `<button class="pill ${state.retMetrics.includes(k) ? 'active' : ''}" data-metric="${k}">${l}</button>`).join('')}
      </div>
      <div class="chart-wrap" id="ret-chart-wrap">${chart.html}</div>
      <div class="chart-legend">
        ${state.retMetrics.includes('churn') ? `<span class="key"><span class="swatch" style="border-color:var(--accent-to)"></span>Monthly churn</span>` : ''}
        ${state.retMetrics.includes('new') ? `<span class="key"><span class="swatch" style="background:var(--accent); opacity:.7; border:none; width:12px; height:10px; display:inline-block; border-radius:2px"></span>New clients</span>` : ''}
        ${state.retMetrics.includes('left') ? (state.retMetrics.includes('new')
          ? `<span class="key" title="The Clients left bar's outline shades from red (more left than won) through grey (even) to green (more won than left)"><span class="swatch" style="background:repeating-linear-gradient(45deg, var(--text-dim) 0 2px, transparent 2px 6px); border:1px solid; border-image:linear-gradient(90deg, var(--danger), var(--text-dim), var(--success)) 1; width:12px; height:10px; display:inline-block; border-radius:2px"></span>Clients left (red↔green = vs new)</span>`
          : `<span class="key"><span class="swatch" style="background:var(--danger); opacity:.7; border:none; width:12px; height:10px; display:inline-block; border-radius:2px"></span>Clients left</span>`) : ''}
        ${state.retMetrics.includes('churn') ? `<span class="key"><span class="swatch dashed" style="border-color:var(--warn)"></span>Short-term goal (${goals.shortTermGoalPct}%)</span>` : ''}
        ${state.retMetrics.includes('churn') ? `<span class="key"><span class="swatch dashed" style="border-color:var(--success)"></span>Long-term goal (${goals.longTermGoalPct}%)</span>` : ''}
      </div>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Month</th><th class="num">Clients invoiced</th><th class="num">New</th>
          <th class="num">Retained</th><th class="num">Lost</th>
          <th class="num" title="New clients minus clients lost this month">Net</th>
          <th class="num">Churn %</th><th class="num">Retention %</th><th class="num">Billed £</th>
        </tr></thead>
        <tbody>
          ${chart.points.length ? [...chart.points].reverse().map(r => {
            const net = (r.newClients || 0) - (r.lost || 0);
            const netCell = net > 0 ? `<span style="color:var(--success)">+${net}</span>` : net < 0 ? `<span style="color:var(--danger)">${net}</span>` : `<span class="dim">0</span>`;
            return `<tr>
            <td><strong>${monthLabel(r.m)}</strong></td>
            <td class="num clickable-stat" data-ret-month="${r.m}" data-ret-metric="invoiced" title="Click to see who">${r.count}</td>
            <td class="num clickable-stat" data-ret-month="${r.m}" data-ret-metric="new" title="Click to see who">${r.newClients ? '+' + r.newClients : '—'}</td>
            <td class="num clickable-stat" data-ret-month="${r.m}" data-ret-metric="retained" title="Click to see who">${r.retained ?? '—'}</td>
            <td class="num clickable-stat" data-ret-month="${r.m}" data-ret-metric="lost" title="Click to see who">${r.lost ? `<span style="color:var(--danger)">−${r.lost}</span>` : r.lost === 0 ? '0' : '—'}</td>
            <td class="num">${netCell}</td>
            <td class="num clickable-stat" data-ret-month="${r.m}" data-ret-metric="lost" title="Click to see who churned">${r.churnPct != null ? `<span style="color:${goalColor(r.churnPct, goals)}">${r.churnPct.toFixed(1)}%</span>` : '—'}</td>
            <td class="num clickable-stat" data-ret-month="${r.m}" data-ret-metric="retained" title="Click to see who">${r.retPct != null ? `<span style="color:var(--success)">${r.retPct.toFixed(1)}%</span>` : '—'}</td>
            <td class="num money">${fmtMoney(r.mrr)}</td>
          </tr>`;
          }).join('') : `<tr><td colspan="9"><div class="empty">${rows.length ? 'No months in the selected window.' : 'No invoice history yet — retention is calculated from monthly invoices.'}</div></td></tr>`}
        </tbody>
      </table>
    </div>
    <p class="note">Client-count based: a single month's <strong>Churn %</strong> = clients present last month who aren't present this month ÷ last month's clients. <strong>Retention %</strong> = 100 − churn. <strong>New</strong> = present this month, not present last month. Months on the <strong>Account maintenance fee</strong> package don't count as present, but are a temporary pause rather than an ending: if the client later returns to a normal package, that whole gap is ignored — no churn when they paused, no "new" when they came back. Only if they never return does it count as churn, dated to the month they first paused. Clients deliberately <strong>skipped</strong> for a month still count as present (not billed, not lost). <strong>Clients invoiced</strong> in the table is the raw billing figure and isn't adjusted by any of this. The window cards, custom range, and chart above are <strong>weighted averages</strong> — total clients lost ÷ total clients at the start of each included month — not a mean of the monthly percentages. Goals are editable in Settings.</p>`;

  view.querySelectorAll('[data-ret-month]').forEach(el => el.onclick = () => {
    showRetentionMonthModal(el.dataset.retMonth, el.dataset.retMetric);
  });
  view.querySelectorAll('[data-scale]').forEach(p => p.onclick = () => { state.retScale = p.dataset.scale; renderInsights(); });
  view.querySelectorAll('[data-metric]').forEach(p => p.onclick = () => {
    const k = p.dataset.metric;
    const arr = state.retMetrics;
    const i = arr.indexOf(k);
    if (i === -1) arr.push(k);
    else if (arr.length > 1) arr.splice(i, 1); // always keep at least one metric selected
    renderInsights();
  });
  const startBtn = view.querySelector('#ret-range-start-btn');
  const endBtn = view.querySelector('#ret-range-end-btn');
  startBtn.onclick = () => openMonthPicker(startBtn, {
    value: state.retRangeStart, min: monthOptions[0], max: state.retRangeEnd,
    onSelect: key => { state.retRangeStart = key; renderInsights(); }
  });
  endBtn.onclick = () => openMonthPicker(endBtn, {
    value: state.retRangeEnd, min: state.retRangeStart, max: monthOptions[monthOptions.length - 1],
    onSelect: key => { state.retRangeEnd = key; renderInsights(); }
  });

  wireChurnChartHover(view.querySelector('#ret-chart-wrap'), chart);
}

/* ════════════════ COMMISSIONS VIEW ════════════════ */
const commissionExcluded = p => (DB.settings.commissionExcluded || []).includes(p);
// The date range behind the Commission tab's "earned over a period" totals.
// Commission is counted in the period its payment LANDED (the paid date) — the
// same rule as the Earned by month table below it.
const COMM_PERIODS = [['month', 'This month'], ['lastmonth', 'Last month'], ['year', 'This year'], ['fy', 'Financial year'], ['all', 'All time'], ['custom', 'Custom']];
function commPeriodRange(key) {
  const cur = currentMonthKey();
  const endOf = mk => `${mk}-${String(daysInMonth(mk)).padStart(2, '0')}`;
  if (key === 'month') return { from: `${cur}-01`, to: endOf(cur), label: monthLabel(cur) };
  if (key === 'lastmonth') { const pm = addMonths(cur, -1); return { from: `${pm}-01`, to: endOf(pm), label: monthLabel(pm) }; }
  if (key === 'year') { const y = cur.slice(0, 4); return { from: `${y}-01-01`, to: `${y}-12-31`, label: `${y} (1 Jan – 31 Dec)` }; }
  if (key === 'fy') { const s = fiscalYearStart(cur), e = addMonths(s, 11); return { from: `${s}-01`, to: endOf(e), label: `financial year ${monthLabelShort(s)} – ${monthLabelShort(e)}` }; }
  if (key === 'all') return { from: '0000-01-01', to: '9999-12-31', label: 'all time' };
  const a = state.commFrom || `${cur.slice(0, 4)}-01-01`, b = state.commTo || todayISO();
  const from = a <= b ? a : b, to = a <= b ? b : a;
  return { from, to, label: `${fmtDate(from)} – ${fmtDate(to)}` };
}
function commissionEntries() {
  const cfg = DB.settings.commission;
  const out = [];
  for (const inv of DB.invoices) {
    if (!inv.monthNumber || inv.monthNumber > (cfg.invoiceCount || 3)) continue;
    const c = clientById(inv.clientId);
    if (!c) continue;
    if (isUncertainUnpaid(inv)) continue; // not owed until an uncertain invoice is actually paid
    // Once paid, commission is based on what actually landed (£) — US/EUR
    // clients often land a slightly different figure after conversion. Still
    // unpaid invoices use the invoiced amount as the best available estimate.
    const amt = inv.paid ? (Number(inv.amountLanded ?? inv.amountGBP) || 0) : (Number(inv.amountGBP) || 0);
    if (c.leadGenBy && !commissionExcluded(c.leadGenBy))   out.push({ person: c.leadGenBy,   role: 'Lead gen',  pct: cfg.leadGenPct,   inv, client: c, amount: amt * cfg.leadGenPct / 100 });
    if (c.convertedBy && !commissionExcluded(c.convertedBy)) out.push({ person: c.convertedBy, role: 'Converter', pct: cfg.converterPct, inv, client: c, amount: amt * cfg.converterPct / 100 });
  }
  return out;
}

function renderCommissions() {
  const view = document.getElementById('view-commissions');
  const cfg = DB.settings.commission;
  const entries = commissionEntries();
  // Everyone on the sales team who takes commission — shown whether or not they
  // have earned anything — plus anyone with commission lines who has since been
  // removed from the team list (so their earnings don't vanish).
  const people = [...new Set([...DB.settings.salesTeam, ...entries.map(e => e.person)])]
    .filter(p => p && !commissionExcluded(p)).sort();

  if (!people.length) {
    view.innerHTML = `<div class="tbl-wrap"><div class="empty">
      No sales team set up yet.<br><br>
      1. Add your sales team members in <strong>Settings</strong>.<br>
      2. On each client, set <strong>Lead generated by</strong> (${cfg.leadGenPct}%) and <strong>Converted by</strong> (${cfg.converterPct}%).<br><br>
      Commission applies to a client's first ${cfg.invoiceCount} invoices and becomes payable once the payment lands.
    </div></div>`;
    return;
  }

  // month selector: months with any invoices + current month
  const months = [...new Set([...invoiceMonths(), currentMonthKey()])].sort();
  if (!state.commMonth || !months.includes(state.commMonth)) {
    state.commMonth = months.includes(currentMonthKey()) ? currentMonthKey() : months[months.length - 1];
  }
  const sel = state.commMonth;

  // ── This month: potential vs payable (by invoice month) ──
  const monthEntries = entries.filter(e => e.inv.month === sel);
  const cards = people.map(p => {
    const mine = monthEntries.filter(e => e.person === p);
    const potential = mine.reduce((s, e) => s + e.amount, 0);
    const landed = mine.filter(e => e.inv.paid);
    const payable = landed.reduce((s, e) => s + e.amount, 0);
    if (!mine.length) return `<div class="comm-card">
      <div class="name">${esc(p)}</div>
      <div class="comm-nums">
        <div><div class="v" style="color:var(--success)">${fmtMoney(0)}</div><div class="l">Payable now</div></div>
        <div><div class="v">${fmtMoney(0)}</div><div class="l">If all payments land</div></div>
      </div>
      <div class="bar"></div>
      <div class="muted" style="font-size:11px; margin-top:8px">No commission lines for ${esc(monthLabel(sel))}</div>
    </div>`;
    const barSegs = [...mine]
      .sort((a, b) => (a.inv.paid ? 0 : 1) - (b.inv.paid ? 0 : 1)) // paid segments first (green, on the left)
      .map(e => {
        const w = potential ? (e.amount / potential * 100) : 0;
        const color = e.inv.paid ? 'var(--success)' : 'transparent';
        const status = e.inv.paid ? `Landed ${fmtDate(e.inv.paidDate)}` : isOverdue(e.inv) ? 'Overdue' : 'Awaiting';
        const tip = `${e.client.companyName} (${e.role}) — ${fmtMoney(e.amount)} · ${status}`;
        return `<div class="bar-seg" style="width:${w}%; background:${color}" title="${esc(tip)}"></div>`;
      }).join('');
    return `<div class="comm-card">
      <div class="name">${esc(p)}</div>
      <div class="comm-nums">
        <div><div class="v" style="color:var(--success)">${fmtMoney(payable)}</div><div class="l">Payable now</div></div>
        <div><div class="v">${fmtMoney(potential)}</div><div class="l">If all payments land</div></div>
      </div>
      <div class="bar">${barSegs}</div>
      <details class="brk">
        <summary>${mine.length} commission line${mine.length === 1 ? '' : 's'} — show breakdown</summary>
        <div class="brk-wrap">
        <table>
          <thead><tr><th>Client</th><th title="Which sales function this commission line is for">Role <span class="muted" style="text-transform:none">(?)</span></th><th class="num">Mo#</th><th class="num">Invoice</th><th class="num">%</th><th class="num">Commission</th><th>Status</th></tr></thead>
          <tbody>${mine.map(e => `<tr>
            <td>${esc(e.client.companyName)}</td>
            <td class="dim" title="${e.role === 'Lead gen' ? 'Sourced the lead that became this client' : 'Closed the deal, turning the lead into a paying client'}">${e.role}</td>
            <td class="num">${e.inv.monthNumber}</td>
            <td class="num dim">${fmtMoney(e.inv.amountGBP)}${e.inv.paid && e.inv.amountLanded != null && e.inv.amountLanded !== e.inv.amountGBP ? `<div class="sub" style="color:var(--warn)">landed ${fmtMoney(e.inv.amountLanded)}</div>` : ''}</td>
            <td class="num dim">${e.pct}%</td>
            <td class="num money">${fmtMoney(e.amount)}</td>
            <td>${e.inv.paid ? `<span class="badge green">Landed ${fmtDate(e.inv.paidDate)}</span>` : isOverdue(e.inv) ? '<span class="badge red">Overdue</span>' : '<span class="badge amber">Awaiting</span>'}</td>
          </tr>`).join('')}</tbody>
        </table>
        </div>
      </details>
    </div>`;
  }).join('');

  // ── Earned by month (payment landed month) ──
  const paidEntries = entries.filter(e => e.inv.paid && e.inv.paidDate);
  const earnedMonths = [...new Set(paidEntries.map(e => e.inv.paidDate.slice(0, 7)))].sort().reverse();
  const earnedRows = earnedMonths.map(m => {
    const cells = people.map(p => {
      const v = paidEntries.filter(e => e.person === p && e.inv.paidDate.slice(0, 7) === m)
        .reduce((s, e) => s + e.amount, 0);
      return `<td class="num">${v ? `<span class="money">${fmtMoney(v)}</span>` : '<span class="muted">—</span>'}</td>`;
    }).join('');
    const total = paidEntries.filter(e => e.inv.paidDate.slice(0, 7) === m).reduce((s, e) => s + e.amount, 0);
    return `<tr><td><strong>${monthLabel(m)}</strong></td>${cells}<td class="num money" style="color:var(--accent)">${fmtMoney(total)}</td></tr>`;
  }).join('');

  // ── Earned over a chosen period: landed commission per person, with the lines behind it ──
  const per = commPeriodRange(state.commPeriod);
  const periodEntries = entries.filter(e => e.inv.paid && e.inv.paidDate && e.inv.paidDate >= per.from && e.inv.paidDate <= per.to);
  const periodTotal = periodEntries.reduce((s, e) => s + e.amount, 0);
  const periodCards = people.map(p => {
    const mine = periodEntries.filter(e => e.person === p).sort((a, b) => b.inv.paidDate.localeCompare(a.inv.paidDate));
    const total = mine.reduce((s, e) => s + e.amount, 0);
    return `<div class="comm-card">
      <div class="name">${esc(p)}</div>
      <div class="comm-nums">
        <div><div class="v" style="color:var(--success)">${fmtMoney(total)}</div><div class="l">Earned</div></div>
        <div><div class="v">${mine.length}</div><div class="l">Commission line${mine.length === 1 ? '' : 's'}</div></div>
      </div>
      ${mine.length ? `<details class="brk">
        <summary>show breakdown</summary>
        <div class="brk-wrap">
        <table>
          <thead><tr><th>Landed</th><th>Client</th><th>Role</th><th class="num">Mo#</th><th class="num">Invoice</th><th class="num">%</th><th class="num">Commission</th></tr></thead>
          <tbody>${mine.map(e => `<tr>
            <td class="dim">${fmtDate(e.inv.paidDate)}</td>
            <td>${esc(e.client.companyName)}</td>
            <td class="dim" title="${e.role === 'Lead gen' ? 'Sourced the lead that became this client' : 'Closed the deal, turning the lead into a paying client'}">${e.role}</td>
            <td class="num">${e.inv.monthNumber}</td>
            <td class="num dim">${fmtMoney(e.inv.amountLanded ?? e.inv.amountGBP)}</td>
            <td class="num dim">${e.pct}%</td>
            <td class="num money">${fmtMoney(e.amount)}</td>
          </tr>`).join('')}</tbody>
        </table>
        </div>
      </details>` : `<div class="muted" style="font-size:11px; margin-top:8px">No commission landed in this period</div>`}
    </div>`;
  }).join('');
  const periodHtml = `
    <h2 class="section" style="margin-top:4px">Commission earned — ${esc(per.label)}</h2>
    <div class="toolbar" style="margin-bottom:12px">
      <div class="pills">${COMM_PERIODS.map(([k, l]) => `<button class="pill ${state.commPeriod === k ? 'active' : ''}" data-comm-period="${k}">${l}</button>`).join('')}</div>
      ${state.commPeriod === 'custom' ? `<span class="dim" style="font-size:12px">From</span><button type="button" class="date-field" id="cm-from">${fmtDate(per.from)}</button><span class="dim" style="font-size:12px">to</span><button type="button" class="date-field" id="cm-to">${fmtDate(per.to)}</button>` : ''}
      <span class="dim" style="font-size:12px">Counted in the period each payment landed.</span>
    </div>
    <div class="comm-cards">
      <div class="comm-card" style="border-color:var(--accent)">
        <div class="name">Total — whole team</div>
        <div class="comm-nums">
          <div><div class="v" style="color:var(--accent)">${fmtMoney(periodTotal)}</div><div class="l">Earned</div></div>
          <div><div class="v">${periodEntries.length}</div><div class="l">Commission line${periodEntries.length === 1 ? '' : 's'}</div></div>
        </div>
      </div>
      ${periodCards}
    </div>
`;

  view.innerHTML = `
    ${periodHtml}

    <div class="toolbar" style="margin-top:30px">
      <div class="month-nav">
        <button id="cm-prev">‹</button>
        <select id="cm-month">${months.map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${monthLabel(k)}</option>`).join('')}</select>
        <button id="cm-next">›</button>
      </div>
      <span class="dim" style="font-size:12px">Commission: ${cfg.leadGenPct}% for <strong>lead gen</strong> (sourced the lead) + ${cfg.converterPct}% for <strong>converter</strong> (closed the deal), on each client's first ${cfg.invoiceCount} invoices, payable once payment lands.</span>
    </div>

    <h2 class="section" style="margin-top:4px">${monthLabel(sel)} — owed if all payments land vs payable now</h2>
    ${monthEntries.length ? '' : `<p class="note" style="margin:0 0 10px">No commission-eligible invoices in ${monthLabel(sel)} (clients past their first ${cfg.invoiceCount} invoices, or no sales attribution set on this month's clients).</p>`}
    <div class="comm-cards">${cards}</div>

    <h2 class="section">Earned by month <span class="muted" style="font-weight:400; text-transform:none; letter-spacing:0">(month the payment landed)</span></h2>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Month</th>${people.map(p => `<th class="num">${esc(p)}</th>`).join('')}<th class="num">Total</th></tr></thead>
        <tbody>${earnedRows || `<tr><td colspan="${people.length + 2}"><div class="empty">No landed payments with commission yet.</div></td></tr>`}</tbody>
      </table>
    </div>`;

  view.querySelector('#cm-month').onchange = e => { state.commMonth = e.target.value; renderCommissions(); };
  view.querySelector('#cm-prev').onclick = () => { const i = months.indexOf(sel); if (i > 0) { state.commMonth = months[i-1]; renderCommissions(); } };
  view.querySelector('#cm-next').onclick = () => { const i = months.indexOf(sel); if (i < months.length - 1) { state.commMonth = months[i+1]; renderCommissions(); } };
  view.querySelectorAll('[data-comm-period]').forEach(b => b.onclick = () => {
    if (b.dataset.commPeriod === 'custom' && !state.commFrom) { state.commFrom = per.from; state.commTo = per.to; }
    state.commPeriod = b.dataset.commPeriod; renderCommissions();
  });
  const fromBtn = view.querySelector('#cm-from'), toBtn = view.querySelector('#cm-to');
  if (fromBtn) fromBtn.onclick = () => openDatePicker(fromBtn, {
    value: per.from, allowClear: false,
    onSelect: key => { state.commFrom = key; if ((state.commTo || '') < key) state.commTo = key; renderCommissions(); }
  });
  if (toBtn) toBtn.onclick = () => openDatePicker(toBtn, {
    value: per.to, allowClear: false,
    onSelect: key => { state.commTo = key; if ((state.commFrom || '') > key) state.commFrom = key; renderCommissions(); }
  });
}

/* ════════════════ SETTINGS VIEW ════════════════ */
function renderSettings() {
  const view = document.getElementById('view-settings');
  const s = DB.settings;

  const chipList = (key, title, desc) => `
    <div class="card">
      <h3>${title}</h3>
      <div class="desc">${desc}</div>
      <div class="chips">${s[key].map((v, i) => `<span class="chip">${esc(v)}<button data-rm="${key}:${i}" title="Remove">×</button></span>`).join('') || '<span class="muted" style="font-size:12px">None yet.</span>'}</div>
      <div class="chip-add"><input id="add-${key}" placeholder="Add name…"><button class="btn btn-sm" data-add="${key}">Add</button></div>
    </div>`;

  // Who on the sales team actually takes commission. Unticked people stay
  // selectable on clients and in Insights, but never appear on the Commission tab.
  const commissionCard = () => `
    <div class="card">
      <h3>Commission eligibility</h3>
      <div class="desc">Everyone ticked here appears on the Commission tab — even when they've earned £0 that month. Untick a sales team member who doesn't take commission (e.g. the CEO): they stay selectable as Lead generated by / Converted by and still count in Insights' sales attribution, but earn nothing and don't appear on the Commission tab.</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px 24px; margin-top:6px">
        ${s.salesTeam.map(p => `<label class="chk"><input type="checkbox" data-comm-elig="${esc(p)}" ${s.commissionExcluded.includes(p) ? '' : 'checked'}> ${esc(p)}</label>`).join('') || '<span class="muted" style="font-size:12px">Add sales team members above first.</span>'}
      </div>
    </div>`;

  // Wider industries: the clusters themselves, plus where each specific
  // industry tag rolls up to. Industries are listed ungrouped-first so gaps are
  // impossible to miss; includes any tag a client uses that isn't in the list.
  const wideCard = () => {
    const wides = s.wideIndustries, groups = s.industryGroups;
    const counts = new Map();
    DB.clients.forEach(c => { if (c.industry) counts.set(c.industry, (counts.get(c.industry) || 0) + 1); });
    const all = [...new Set([...s.industries, ...counts.keys()])];
    const grouped = i => wides.includes(groups[i]);
    all.sort((a, b) => (grouped(a) - grouped(b)) || (grouped(a) ? wides.indexOf(groups[a]) - wides.indexOf(groups[b]) : 0) || a.localeCompare(b));
    const ungrouped = all.filter(i => !grouped(i)).length;
    return `
    <div class="card">
      <h3>Wider industries</h3>
      <div class="desc">Clusters the specific industry tags into broader groups — e.g. every “SaaS - …” tag under SaaS — for the wider picture in Insights, the filters and the Client performance indicator. Each client keeps its specific industry; its wider industry follows from the mapping below, so regrouping an industry regroups all its clients at once.</div>
      <div class="chips">${wides.map((v, i) => `<span class="chip">${esc(v)}<button data-wide-rename="${i}" title="Rename">✎</button><button data-wide-rm="${i}" title="Remove">×</button></span>`).join('') || '<span class="muted" style="font-size:12px">None yet.</span>'}</div>
      <div class="chip-add"><input id="add-wide" placeholder="Add wider industry…"><button class="btn btn-sm" data-wide-add>Add</button></div>
      ${ungrouped ? `<p class="note" style="color:var(--warn); margin-top:12px">${ungrouped} industr${ungrouped === 1 ? 'y isn’t' : 'ies aren’t'} in a wider industry yet — those clients show as “Not grouped” in the wider-industry charts.</p>` : ''}
      <div class="tbl-wrap" id="wide-map-wrap" style="max-height:380px; overflow-y:auto; margin-top:12px">
        <table>
          <thead><tr><th>Industry</th><th class="num">Clients</th><th>Wider industry</th></tr></thead>
          <tbody>${all.map(i => `<tr>
            <td>${esc(i)}</td>
            <td class="num">${counts.get(i) || 0}</td>
            <td><select data-ind-group="${esc(i)}"><option value="">— Not grouped —</option>${wides.map(w => `<option value="${esc(w)}" ${groups[i] === w ? 'selected' : ''}>${esc(w)}</option>`).join('')}</select></td>
          </tr>`).join('') || '<tr><td colspan="3"><div class="empty">No industries yet.</div></td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
  };

  // Revenue targets table rows: every month that already has a target, plus an
  // always-present slot for the current month and the 12 after it — so the
  // coming year can be filled in without first adding each month. A slot with no
  // target is just an empty input (nothing is stored until a value is typed).
  const targetSlotStart = currentMonthKey(), targetSlotEnd = addMonths(targetSlotStart, 12);
  const targetMonths = [...new Set([...Object.keys(s.revenueTargets), ...Array.from({ length: 13 }, (_, i) => addMonths(targetSlotStart, i))])].sort();

  view.innerHTML = `
    ${chipList('salesTeam', 'Sales team', 'People who can earn commission — selectable as Lead generated by / Converted by on each client.')}
    ${commissionCard()}
    ${chipList('accountManagers', 'Account managers', 'Selectable as the AM on each client.')}
    ${chipList('packages', 'Packages', 'Service packages selectable on each client.')}
    ${chipList('industries', 'Industries', 'Selectable on each client — powers the Insights tab\'s industry breakdown.')}
    ${wideCard()}
    ${chipList('countries', 'Countries', 'Selectable on each client — powers the Insights tab\'s country breakdown.')}
    ${chipList('companySizes', 'Company sizes', 'Headcount bands selectable on each client — powers the Insights tab\'s size breakdown.')}

    <div class="card">
      <h3>Revenue targets</h3>
      <div class="desc">A £ target for a specific month — each month is independent (e.g. September 2026 and September 2027 don't share a target). The current month and the next 12 always have a slot below — just type a figure; use "Add month" only to set a target further ahead (or further back). Also editable directly from that month's Invoices tab; both places write the same value. Yearly targets shown in Insights are just the sum of whichever months in that year have one set.</div>
      <div class="tbl-wrap" id="rt-targets-wrap" style="max-height:280px; overflow-y:auto; margin-bottom:12px">
        <table>
          <thead><tr><th>Month</th><th class="num">Target £</th><th></th></tr></thead>
          <tbody>
            ${targetMonths.map(m => { const has = s.revenueTargets[m] != null; return `<tr>
              <td>${esc(monthLabel(m))}${m === targetSlotStart ? ' <span class="muted" style="font-size:11px">· this month</span>' : ''}</td>
              <td class="num"><input type="number" step="0.01" class="no-spin" style="width:120px; text-align:right" data-target-input="${m}" value="${has ? s.revenueTargets[m] : ''}" placeholder="Not set"></td>
              <td>${has ? `<button class="btn btn-sm btn-danger" data-target-rm="${m}" title="${m >= targetSlotStart && m <= targetSlotEnd ? 'Clear target' : 'Remove target'}">×</button>` : ''}</td>
            </tr>`; }).join('')}
          </tbody>
        </table>
      </div>
      <button type="button" class="btn btn-sm" id="target-add-btn">＋ Add month</button>
    </div>

    <div class="card">
      <h3>Commission rules</h3>
      <div class="desc">Percentages of the monthly £ fee. Commission applies to each client's first N invoices and is payable once the payment lands.</div>
      <div class="fgrid" style="max-width:560px">
        <div class="fld"><label>Lead gen %</label><input type="number" step="0.5" id="set-lead" value="${s.commission.leadGenPct}"></div>
        <div class="fld"><label>Converter %</label><input type="number" step="0.5" id="set-conv" value="${s.commission.converterPct}"></div>
        <div class="fld"><label>First N invoices</label><input type="number" min="1" id="set-n" value="${s.commission.invoiceCount}"></div>
      </div>
      <div style="margin-top:12px"><button class="btn btn-primary btn-sm" id="set-comm-save">Save commission rules</button></div>
    </div>

    <div class="card">
      <h3>Retention goals</h3>
      <div class="desc">Reference lines shown on the Retention chart and used to colour the churn stats — churn should sit underneath these thresholds.</div>
      <div class="fgrid" style="max-width:400px">
        <div class="fld"><label>Short-term goal (%)</label><input type="number" step="0.5" id="set-short-goal" value="${s.retention.shortTermGoalPct}"></div>
        <div class="fld"><label>Long-term goal (%)</label><input type="number" step="0.5" id="set-long-goal" value="${s.retention.longTermGoalPct}"></div>
      </div>
      <div style="margin-top:12px"><button class="btn btn-primary btn-sm" id="set-retention-save">Save retention goals</button></div>
    </div>

    <div class="card">
      <h3>Data</h3>
      <div class="desc">Data lives in <code>data.json</code> next to the app; every save keeps a timestamped copy in <code>backups/</code> (last 30).</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn" id="set-export">⬇ Export backup (JSON)</button>
        <button class="btn" id="set-import">⬆ Import backup (JSON)</button>
        <input type="file" id="set-import-file" accept=".json" style="display:none">
      </div>
    </div>`;

  view.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const key = b.dataset.add;
    const input = document.getElementById('add-' + key);
    const v = input.value.trim();
    if (!v || s[key].includes(v)) return;
    s[key].push(v); touch(); renderSettings();
  });
  view.querySelectorAll('#add-salesTeam, #add-accountManagers, #add-packages').forEach(inp => {
    inp.onkeydown = e => { if (e.key === 'Enter') inp.nextElementSibling.click(); };
  });
  view.querySelectorAll('#add-industries, #add-countries, #add-companySizes').forEach(inp => {
    inp.onkeydown = e => { if (e.key === 'Enter') inp.nextElementSibling.click(); };
  });
  view.querySelectorAll('[data-comm-elig]').forEach(cb => cb.onchange = () => {
    const name = cb.dataset.commElig;
    const list = s.commissionExcluded.filter(x => x !== name);
    if (!cb.checked) list.push(name);
    s.commissionExcluded = list;
    touch(); renderAll();
  });
  const keepMapScroll = fn => {
    const before = view.querySelector('#wide-map-wrap');
    const top = before ? before.scrollTop : 0;
    fn();
    const after = document.getElementById('wide-map-wrap');
    if (after) after.scrollTop = top;
  };
  const addWide = () => {
    const v = view.querySelector('#add-wide').value.trim();
    if (!v || s.wideIndustries.includes(v)) return;
    s.wideIndustries.push(v); touch(); renderSettings();
  };
  view.querySelector('[data-wide-add]').onclick = addWide;
  view.querySelector('#add-wide').onkeydown = e => { if (e.key === 'Enter') addWide(); };
  view.querySelectorAll('[data-wide-rename]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.wideRename), old = s.wideIndustries[i];
    const name = (prompt(`Rename wider industry "${old}" to:`, old) || '').trim();
    if (!name || name === old) return;
    if (s.wideIndustries.includes(name)) { confirmModal(`There is already a wider industry called <strong>${esc(name)}</strong>.`, () => {}, 'OK'); return; }
    s.wideIndustries[i] = name;
    for (const k of Object.keys(s.industryGroups)) if (s.industryGroups[k] === old) s.industryGroups[k] = name;
    touch(); renderAll();
  });
  view.querySelectorAll('[data-wide-rm]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.wideRm), name = s.wideIndustries[i];
    const n = Object.values(s.industryGroups).filter(v => v === name).length;
    const remove = () => {
      s.wideIndustries.splice(i, 1);
      for (const k of Object.keys(s.industryGroups)) if (s.industryGroups[k] === name) delete s.industryGroups[k];
      touch(); renderAll();
    };
    if (n) confirmModal(`Remove <strong>${esc(name)}</strong>? ${n} industr${n === 1 ? 'y' : 'ies'} will become “Not grouped”.`, remove, 'Remove');
    else remove();
  });
  view.querySelectorAll('[data-ind-group]').forEach(sel => sel.onchange = () => keepMapScroll(() => {
    if (sel.value) s.industryGroups[sel.dataset.indGroup] = sel.value; else delete s.industryGroups[sel.dataset.indGroup];
    touch(); renderAll();
  }));
  view.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const [key, i] = b.dataset.rm.split(':');
    s[key].splice(Number(i), 1); touch(); renderSettings();
  });

  // Re-rendering the whole Settings view rebuilds the targets table from
  // scratch, which would otherwise reset its scroll position to the top —
  // annoying when editing several months in a row. Captures and restores
  // the scrollable wrap's scrollTop across whatever re-render fn() triggers.
  const keepTargetsScroll = fn => {
    const wrapBefore = view.querySelector('#rt-targets-wrap');
    const top = wrapBefore ? wrapBefore.scrollTop : 0;
    fn();
    const wrapAfter = document.getElementById('rt-targets-wrap');
    if (wrapAfter) wrapAfter.scrollTop = top;
  };
  view.querySelectorAll('[data-target-input]').forEach(inp => {
    inp.onchange = () => keepTargetsScroll(() => { setTargetForMonth(inp.dataset.targetInput, inp.value); renderSettings(); });
  });
  view.querySelectorAll('[data-target-rm]').forEach(b => b.onclick = () => keepTargetsScroll(() => {
    delete s.revenueTargets[b.dataset.targetRm]; touch(); renderSettings();
  }));
  view.querySelector('#target-add-btn').onclick = () => {
    const btn = view.querySelector('#target-add-btn');
    openMonthPicker(btn, {
      value: currentMonthKey(),
      onSelect: key => keepTargetsScroll(() => {
        // A month inside the always-visible window already has its slot — just
        // go to it. Anything further out gets a row (starting at £0).
        if (key < targetSlotStart || key > targetSlotEnd) { if (s.revenueTargets[key] == null) s.revenueTargets[key] = 0; }
        renderSettings();
        view.querySelector(`[data-target-input="${key}"]`)?.focus();
      })
    });
  };

  view.querySelector('#set-comm-save').onclick = () => {
    s.commission.leadGenPct  = Number(document.getElementById('set-lead').value) || 0;
    s.commission.converterPct= Number(document.getElementById('set-conv').value) || 0;
    s.commission.invoiceCount= Number(document.getElementById('set-n').value) || 3;
    touch(); renderAll();
  };

  view.querySelector('#set-retention-save').onclick = () => {
    s.retention.shortTermGoalPct = Number(document.getElementById('set-short-goal').value) || 0;
    s.retention.longTermGoalPct  = Number(document.getElementById('set-long-goal').value) || 0;
    touch(); renderAll();
  };

  view.querySelector('#set-export').onclick = () => {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `credit-control-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const fileInput = view.querySelector('#set-import-file');
  view.querySelector('#set-import').onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const f = fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.clients || !data.invoices || !data.settings) throw new Error('Missing keys');
        confirmModal(`Replace <strong>all current data</strong> with the contents of <strong>${esc(f.name)}</strong> (${data.clients.length} clients, ${data.invoices.length} invoices)? Current data is backed up automatically on save.`, () => {
          DB = data; normalise(); touch(); renderAll();
        }, 'Replace data');
      } catch (e) {
        confirmModal('That file is not a valid Credit Control backup.', () => {}, 'OK');
      }
      fileInput.value = '';
    };
    reader.readAsText(f);
  };
}

/* ════════════════ Init ════════════════ */
// This same file is shared by four dashboard entry points (Credit Control,
// Commission, Operational Settings, Insights) plus its original standalone
// use via serve.ps1. Which tabs are shown, which one opens by default, and
// where data loads/saves from are resolved purely from the URL path — no
// server-side templating, so the exact same static file works everywhere.
// Falls back to the original serve.ps1 behaviour (all tabs, /data, /save)
// when the path doesn't match a known dashboard route.
const CC_ROUTE_CONFIG = {
  '/credit-control':       { title: 'Credit Control', allowedTabs: ['invoices', 'clients'], defaultTab: 'invoices' },
  '/commission':           { title: 'Commission', allowedTabs: ['commissions'], defaultTab: 'commissions' },
  '/operational-settings': { title: 'Operational Settings', allowedTabs: ['settings'], defaultTab: 'settings', tabLabels: { settings: 'Operational Settings' } },
  '/insights':             { title: 'Insights', allowedTabs: ['insights'], defaultTab: 'insights' },
  '/am-performance':       { title: 'AM Performance', allowedTabs: ['amperf'], defaultTab: 'amperf' },
};
const _ccRouteCfg = CC_ROUTE_CONFIG[location.pathname];
window.CC_CONFIG = Object.assign({
  dataUrl: _ccRouteCfg ? '/api/credit-control/data' : '/data',
  saveUrl: _ccRouteCfg ? '/api/credit-control/save' : '/save',
  allowedTabs: null,      // null = show every tab (standalone/back-compat)
  defaultTab: 'invoices',
  tabLabels: {},
}, _ccRouteCfg || {});

(function applyAppConfig() {
  const cfg = window.CC_CONFIG;
  if (cfg.allowedTabs) {
    document.querySelectorAll('.tab').forEach(btn => {
      if (!cfg.allowedTabs.includes(btn.dataset.tab)) btn.style.display = 'none';
    });
  }
  Object.entries(cfg.tabLabels).forEach(([key, label]) => {
    const btn = document.querySelector(`.tab[data-tab="${key}"]`);
    if (btn) btn.textContent = label;
  });
  if (cfg.defaultTab && cfg.defaultTab !== state.tab) {
    state.tab = cfg.defaultTab;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === cfg.defaultTab));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + cfg.defaultTab));
  }
  if (_ccRouteCfg) applyDashboardChrome(cfg);
  document.documentElement.classList.remove('cc-pending');   // configured — safe to show the page
})();

// When served inside the Unstuck dashboard, swap the standalone app's own
// header for the same topbar every other dashboard tool has (back chevron,
// Dashboard home link, centred page title). The save indicator is moved, not
// recreated, so indicator() keeps working. Not applied standalone (serve.ps1),
// where there's no dashboard to go back to.
function applyDashboardChrome(cfg) {
  document.title = cfg.title + ' — Unstuck Agency';

  const fonts = document.createElement('link');
  fonts.rel = 'stylesheet';
  fonts.href = 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=DM+Sans:wght@500&display=swap';
  document.head.appendChild(fonts);

  const css = document.createElement('style');
  css.textContent = `
    body > header.dash-topbar {
      background: rgba(8,8,18,.72);
      backdrop-filter: saturate(160%) blur(22px); -webkit-backdrop-filter: saturate(160%) blur(22px);
      border-bottom: 1px solid rgba(255,255,255,.13);
      padding: 0 28px;
    }
    .dash-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-width: 140px; }
    .dash-back {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      background: none; border: none; color: rgba(210,205,255,.5); cursor: pointer;
      border-radius: 6px; flex-shrink: 0; transition: background .14s, color .14s;
    }
    .dash-back:hover { background: rgba(255,255,255,.07); color: #f0eeff; }
    .dash-home { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .dash-mark {
      width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, #180835 0%, #7c3aed 32%, #5b5ea6 62%, #e879f9 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(124,58,237,.35);
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s;
    }
    .dash-home:hover .dash-mark { transform: scale(1.1) rotate(-4deg); box-shadow: 0 4px 18px rgba(124,58,237,.5); }
    .dash-label { font: 500 13px 'DM Sans', sans-serif; letter-spacing: .01em; color: rgba(230,225,255,.68); transition: color .18s; }
    .dash-home:hover .dash-label { color: #f0eeff; }
    body > header.dash-topbar .dash-title {
      flex: 1; text-align: center; font: 600 17px 'Bricolage Grotesque', sans-serif;
      letter-spacing: -.02em; color: #f0eeff;
    }
    .dash-right { min-width: 140px; display: flex; align-items: center; justify-content: flex-end; }
    @media (max-width: 640px) {
      body > header.dash-topbar { padding: 0 16px; }
      .dash-left, .dash-right { min-width: 0; }
      .dash-label { display: none; }
    }`;
  document.head.appendChild(css);

  const hdr = document.querySelector('body > header');
  const save = document.getElementById('save-ind');
  hdr.classList.add('dash-topbar');
  hdr.innerHTML = `
    <div class="dash-left">
      <button class="dash-back" onclick="history.back()" title="Go back" aria-label="Go back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <a href="/" class="dash-home">
        <div class="dash-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="dash-label">Dashboard</span>
      </a>
    </div>
    <h1 class="dash-title">${cfg.title}</h1>
    <div class="dash-right"></div>`;
  hdr.querySelector('.dash-right').appendChild(save);

  // A tab bar with a single tab is just noise on the one-purpose pages.
  if (cfg.allowedTabs && cfg.allowedTabs.length < 2) document.querySelector('.tab-bar').style.display = 'none';
}

load();
</script>
