  const render = () => {
    const mKey = `${vy}-${String(vm).padStart(2, '0')}`;
    const first = new Date(vy, vm - 1, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const daysThisMonth = daysInMonth(mKey);
    const prevMonthKey = addMonthsToDate(`${mKey}-01`, -1).slice(0, 7);
    const nextMonthKey = addMonthsToDate(`${mKey}-01`, 1).slice(0, 7);
    const prevMonthDays = daysInMonth(prevMonthKey);
    const totalCells = Math.ceil((startOffset + daysThisMonth) / 7) * 7;
    let cells = '';
    for (let i = 0; i < totalCells; i++) {
      const dayNum = i - startOffset + 1;
      let key, label, otherMonth = false;
      if (dayNum < 1) { label = prevMonthDays + dayNum; key = `${prevMonthKey}-${String(label).padStart(2, '0')}`; otherMonth = true; }
      else if (dayNum > daysThisMonth) { label = dayNum - daysThisMonth; key = `${nextMonthKey}-${String(label).padStart(2, '0')}`; otherMonth = true; }
      else { label = dayNum; key = `${mKey}-${String(dayNum).padStart(2, '0')}`; }
      const disabled = (min && key < min) || (max && key > max);
      const selected = key === value;
      const isToday = key === today;
      cells += `<button type="button" class="date-cell${otherMonth ? ' other-month' : ''}${selected ? ' selected' : ''}${isToday ? ' today' : ''}" data-key="${key}" ${disabled ? 'disabled' : ''}>${label}</button>`;
    }
    datePopEl.innerHTML = `
      <div class="date-pop-head">
        <button type="button" data-nav="-1">‹</button>
        <span class="ym">${MONTHS[vm - 1]} ${vy}</span>
        <button type="button" data-nav="1">›</button>
      </div>
      <div class="date-weekdays">${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="date-grid">${cells}</div>
      <div class="date-pop-foot">
        ${allowClear ? `<button type="button" data-clear>Clear</button>` : '<span></span>'}
        <button type="button" data-today>Today</button>
      </div>`;
    datePopEl.querySelector('[data-nav="-1"]').onclick = () => { vm--; if (vm < 1) { vm = 12; vy--; } render(); };
    datePopEl.querySelector('[data-nav="1"]').onclick = () => { vm++; if (vm > 12) { vm = 1; vy++; } render(); };
    datePopEl.querySelectorAll('.date-cell:not(:disabled)').forEach(btn => btn.onclick = () => {
      closeDatePicker();
      onSelect(btn.dataset.key);
    });
    const clearBtn = datePopEl.querySelector('[data-clear]');
    if (clearBtn) clearBtn.onclick = () => { closeDatePicker(); onSelect(''); };
    datePopEl.querySelector('[data-today]').onclick = () => { [vy, vm] = today.split('-').map(Number); render(); };
  };
  render();
  setTimeout(() => {
    document.addEventListener('mousedown', onDatePickerOutside, true);
    document.addEventListener('keydown', onDatePickerKey, true);
  }, 0);
}

/* ════════════════ Progress-bar polish ════════════════ */
// Gives every progress bar rounded ends on its first/last section (so a section can pop out of the
// bar instead of being clipped by it), and turns each section's title into an instant tooltip
// showing what it represents, its value, and a one-line explanation.
function decorateBars(root = document) {
  root.querySelectorAll('.progress-bar:not([data-deco])').forEach(bar => {
    bar.dataset.deco = '1';
    bar.removeAttribute('title');   // the bar-level title would otherwise show over every section
    const vis = [...bar.children].filter(el => el.matches('.progress-seg, .progress-gap') && parseFloat(el.style.width) > 0);
    if (vis.length) { vis[0].classList.add('seg-first'); vis[vis.length - 1].classList.add('seg-last'); }
    bar.querySelectorAll('[title]').forEach(el => { el.dataset.tip = el.getAttribute('title'); el.removeAttribute('title'); });
  });
}
const barTip = document.createElement('div');
barTip.id = 'bar-tip';
document.body.appendChild(barTip);
document.addEventListener('mousemove', e => {
  const el = e.target.closest ? e.target.closest('.progress-bar > [data-tip]') : null;
  if (!el) { barTip.classList.remove('on'); return; }
  const [what, ...rest] = el.dataset.tip.split(' — ');
  const val = rest.join(' — ');
  barTip.innerHTML = `<div class="bt-what">${esc(what)}</div>${val ? `<div class="bt-val">${esc(val)}</div>` : ''}${el.dataset.desc ? `<div class="bt-desc">${esc(el.dataset.desc)}</div>` : ''}${el.closest('.progress-bar').dataset.bar ? '<div class="bt-hint">Click the bar for the full breakdown</div>' : ''}`;
  barTip.classList.add('on');
  const w = barTip.offsetWidth, h = barTip.offsetHeight;
  barTip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, e.clientX - w / 2)) + 'px';
  barTip.style.top = (e.clientY - h - 16 < 8 ? e.clientY + 22 : e.clientY - h - 16) + 'px';
});
document.addEventListener('mouseleave', () => barTip.classList.remove('on'));
new MutationObserver(() => decorateBars()).observe(document.body, { childList: true, subtree: true });
decorateBars();

// ── Revenue bar detail: click a bar for a pop-up with every section explained, how it adds up
// against the targets, and the month-by-month figures behind it ──
const BAR_DETAILS = new Map();
let barDetailSeq = 0;
function showBarDetail(id) {
  const d = BAR_DETAILS.get(id);
  if (!d) return;
  barTip.classList.remove('on');
  const { label, subLabel, bar } = d;
  const cur = currentMonthKey();
  const toDate = bar.goal2Amt != null;                       // the Year-to-date bar: "target to date" + "full-year target"
  const pct = v => bar.scale ? (v / bar.scale * 100).toFixed(1) + '%' : '—';
  const sections = [
    { key: '<span class="bd-key" style="background:var(--success)"></span>', name: 'Landed', amt: bar.landedAmt, desc: 'Cash received — invoices already paid.' },
    { key: '<span class="bd-key" style="background:var(--warn)"></span>', name: 'Expected, not yet landed', amt: bar.expectedAmt, desc: 'Invoices due in this period that haven’t been paid yet (any marked Uncertain are left out).' },
  ];
  if (bar.goalGapAmt > 0) sections.push({ key: '<span class="bd-key hash-red"></span>', name: toDate ? 'Gap to target to date' : 'Gap to goal', amt: bar.goalGapAmt,
    desc: toDate ? 'Still to land to reach the cumulative target for the months gone so far.' : 'Still to land to reach the goal for this period.' });
  if (bar.goal2GapAmt > 0) sections.push({ key: '<span class="bd-key hash-orange"></span>', name: 'Gap to the full-year target', amt: bar.goal2GapAmt,
    desc: 'Still needed, beyond the target to date, to reach the cumulative target for the whole financial year.' });
  const lines = [];
  if (bar.goalAmt != null) lines.push({ key: '<span class="bd-key line" style="background:#fff"></span>', name: toDate ? 'Target to date' : 'Goal', amt: bar.goalAmt,
    desc: toDate ? 'The cumulative target for the months gone so far (the white line).' : 'The target for this period (the white line).' });
  if (bar.goal2Amt != null) lines.push({ key: '<span class="bd-key line" style="background:var(--warn)"></span>', name: 'Full-year target', amt: bar.goal2Amt,
    desc: 'The cumulative target for the whole financial year, August to July (the orange line).' });

  // month-by-month: target, what landed (paid in the month) and what was expected (due in the month)
  const byM = new Map(retentionRows().map(r => [r.m, r]));
  const months = bar.fyMonths || bar.months || [];
  const mrows = months.map(m => {
    const past = m <= cur, row = byM.get(m);
    return { m, target: targetForMonth(m), landed: past ? landedForMonth(m) : null, expected: past ? (row ? (row.expected ?? row.mrr ?? 0) : 0) : null };
  });
  const sum = k => mrows.reduce((s, r) => s + (r[k] || 0), 0);
  const hasTarget = mrows.some(r => r.target != null);
  const diff = r => r.target != null && r.expected != null ? r.expected - r.target : null;
  const diffHtml = v => v == null ? '<span class="muted">—</span>' : `<span class="${v >= 0 ? 'cmp-up' : 'cmp-down'}">${v >= 0 ? '+' : '−'}${fmtMoney(Math.abs(v))}</span>`;

  const total = bar.landedAmt + bar.expectedAmt;
  openModal(`
    <div class="modal-head"><h3>${esc(label)}${subLabel ? ` <span class="dim" style="font-weight:500; font-size:13px">· ${esc(subLabel)}</span>` : ''}</h3><button class="modal-x" data-close>×</button></div>
    <div class="progress-bars" style="margin-bottom:8px">${revBarRowHtml(label, bar, subLabel, 0, '', true)}</div>

    <div class="stats" style="margin-top:6px">
      <div class="stat ok"><div class="v">${fmtMoney(bar.landedAmt)}</div><div class="l">Landed</div></div>
      <div class="stat"><div class="v">${fmtMoney(total)}</div><div class="l">Landed + expected</div><div class="s">if every invoice due lands</div></div>
      ${bar.goalAmt != null ? `<div class="stat ${total >= bar.goalAmt ? 'ok' : 'warn'}"><div class="v">${bar.goalAmt ? Math.round(total / bar.goalAmt * 100) : '—'}%</div><div class="l">Of ${toDate ? 'target to date' : 'the goal'}</div><div class="s">${total >= bar.goalAmt ? `${fmtMoney(total - bar.goalAmt)} ahead of ${fmtMoney(bar.goalAmt)}` : `${fmtMoney(bar.goalAmt - total)} behind ${fmtMoney(bar.goalAmt)}`}</div></div>` : ''}
      ${bar.goal2Amt != null && bar.goal2Amt ? `<div class="stat"><div class="v">${Math.round(total / bar.goal2Amt * 100)}%</div><div class="l">Of the full-year target</div><div class="s">${fmtMoney(Math.max(0, bar.goal2Amt - total))} still to find of ${fmtMoney(bar.goal2Amt)}</div></div>` : ''}
    </div>

    <div class="bd-sub">What each part of the bar means</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th style="width:26px"></th><th>Section</th><th>What it represents</th><th class="num">Amount</th><th class="num">Share of the bar</th></tr></thead>
        <tbody>
          ${sections.map(x => `<tr><td>${x.key}</td><td><strong>${esc(x.name)}</strong></td><td class="dim" style="white-space:normal; min-width:230px">${esc(x.desc)}</td><td class="num money">${fmtMoney(x.amt)}</td><td class="num dim">${pct(x.amt)}</td></tr>`).join('')}
          ${lines.map(x => `<tr><td>${x.key}</td><td><strong>${esc(x.name)}</strong></td><td class="dim" style="white-space:normal; min-width:230px">${esc(x.desc)}</td><td class="num money">${fmtMoney(x.amt)}</td><td class="num dim">at ${pct(x.amt)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    ${mrows.length ? `<div class="bd-sub">Month by month</div>
    <div class="tbl-wrap" style="max-height:320px; overflow-y:auto">
      <table>
        <thead><tr><th>Month</th>${hasTarget ? '<th class="num">Target</th>' : ''}<th class="num" title="Cash that landed in the month, by the date it was paid">Landed</th><th class="num" title="Everything due in the month, paid or not">Expected</th>${hasTarget ? '<th class="num" title="Expected minus target">vs target</th>' : ''}</tr></thead>
        <tbody>
          ${mrows.map(r => `<tr${r.m === cur ? ' style="font-weight:700"' : ''}><td>${esc(monthLabel(r.m))}${r.m === cur ? ' <span class="muted" style="font-weight:400">· this month</span>' : ''}${r.m > cur ? ' <span class="muted" style="font-weight:400">· to come</span>' : ''}</td>${hasTarget ? `<td class="num">${r.target != null ? fmtMoney(r.target) : '—'}</td>` : ''}<td class="num">${r.landed != null ? fmtMoney(r.landed) : '—'}</td><td class="num">${r.expected != null ? fmtMoney(r.expected) : '—'}</td>${hasTarget ? `<td class="num">${diffHtml(diff(r))}</td>` : ''}</tr>`).join('')}
          <tr style="font-weight:700; border-top:1px solid var(--border-hi)"><td>Total</td>${hasTarget ? `<td class="num">${fmtMoney(sum('target'))}</td>` : ''}<td class="num">${fmtMoney(sum('landed'))}</td><td class="num">${fmtMoney(sum('expected'))}</td>${hasTarget ? `<td class="num">${diffHtml(sum('expected') - mrows.filter(r => r.expected != null).reduce((s, r) => s + (r.target || 0), 0))}</td>` : ''}</tr>
        </tbody>
      </table>
    </div>
    <p class="note">Landed is counted in the month the money was paid; expected in the month the invoice falls due — the same way the bar adds them up.${bar.fyMonths ? ' The bar covers the whole financial year; months still to come show only their target.' : ''}</p>` : ''}
    <div class="modal-foot"><button class="btn btn-primary" data-close>Close</button></div>`, true);
}

/* ════════════════ Chart reveal ════════════════ */
// Plays the left-to-right wipe on every chart in a view — progress bars, ranked
// bars, line/bar SVG charts, pies and commission bars — staggered top to bottom.
// Called when a tab is clicked, when the app first loads, and when you move
// between pages inside a tab (Insights pages, AM Performance pages); ordinary
// re-renders (changing a toggle or filter) don't replay it.
const REVEAL_SEL = '.progress-bars:not(.reveal) .progress-bar, .ins-bar-track, .chart-wrap svg, .am-pie-wrap svg, .comm-card .bar';
function revealCharts(view) {
  if (!view) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  view.querySelectorAll(REVEAL_SEL).forEach((el, i) => el.style.setProperty('--ri', Math.min(i, 14)));
  view.classList.remove('reveal-on');
  void view.offsetWidth;   // restart the animation if it was already running
  view.classList.add('reveal-on');
  clearTimeout(view._revealTimer);
  view._revealTimer = setTimeout(() => view.classList.remove('reveal-on'), 2400);
}

function sortInvoices(list, sortKey) {
  const arr = [...list];
  const auto = i => (clientById(i.clientId)?.autoIssue ? 1 : 0);
  if (sortKey === 'due') {
    arr.sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || auto(a) - auto(b));
  } else if (sortKey === 'joined') {
    arr.sort((a, b) => {
      const ca = clientById(a.clientId), cb = clientById(b.clientId);
      const sa = ca?.startMonth || '9999', sb = cb?.startMonth || '9999';
      if (sa !== sb) return sa.localeCompare(sb);
      return (a.issueDate || '9999').localeCompare(b.issueDate || '9999');
    });
  } else { // 'issued' — issue date order
    arr.sort((a, b) => (a.issueDate || '9999').localeCompare(b.issueDate || '9999') || auto(a) - auto(b));
  }
  return arr;
}

    // still possible to tell it was sitting issue-overdue right before this —

function renderInvoicesTable() {
  const view = document.getElementById('view-invoices');
  if (!state.invMonth) state.invMonth = currentMonthKey();
  const m = state.invMonth;
  // Generation/frontier logic (the banner, "Generate next month", "Clear
  // month") is always about which invoices were ISSUED for a month — that's
  // the one thing month means everywhere else in the app (chaining, the
  // wizard, retention). It must stay on that basis regardless of which lens
  // you're browsing the table through below, so it's computed separately
  // from the display set rather than reusing `invs`.
  // `i.month` is due-date-based now (see buildNextInvoiceFor()), so "issued
  // this month" has to filter by the actual issue date directly — using
  // i.month here would make this identical to the Due-month view below.
  const issuedThisMonth = DB.invoices.filter(i => i.issueDate && i.issueDate.slice(0, 7) === m);
  const nextGenMonth = addMonths(DB.settings.invoicingGeneratedThrough, 1);
  // Only shown in Issued-month view — in Due-month view this month can
  // legitimately have invoices to display (issued earlier, due now) even
  // though nothing's been generated to be issued for it yet, so the "empty,
  // go generate it" banner would be actively wrong there.
  const showGenBanner = state.invDateBasis === 'issued' && m === nextGenMonth && issuedThisMonth.length === 0;
  const canClearMonth = m === DB.settings.invoicingGeneratedThrough;

  // The date-basis toggle only changes which invoices count as "in" this
  // month for display/stats purposes — issued (billed out that month) or
  // due (cash expected to land that month, which is also what i.month/
  // retention/MRR/etc. use everywhere else in the app). Nothing about how
  // invoices are generated or numbered reads this; it's a pure view filter
  // on top of the same underlying data.
  const basis = state.invDateBasis;
  const invs = sortInvoices(
    basis === 'due' ? DB.invoices.filter(i => i.dueDate && i.dueDate.slice(0, 7) === m) : issuedThisMonth,
    state.invSort
  );

  const awaiting = invs.filter(i => i.issued && !i.paid && !isOverdue(i));
  const overdue  = invs.filter(i => isOverdue(i));
  const paid     = invs.filter(i => i.paid);
  const billed   = invs.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  const collected= paid.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  // Targets are set per due-month (that's when the money's actually expected
  // to land), so they're only meaningful in the Due month view — Issued month
  // shows plain payment-landed figures with no target comparison.
  const target = basis === 'due' ? targetForMonth(m) : null;
  // Landed here is scoped to whichever invoices are currently in view (same
  // set the table and the Paid? bar use), not a separate paid-date lookup —
  // this is deliberately the same number as the bar's Landed segment, not
  // "true" cash-flow-by-payment-date (that figure still exists, just as
  // Insights' Monthly/Yearly Target vs Landed charts, which aren't scoped to
  // a single month's view the way this tab is).
  const landed = paid.reduce((s, i) => s + invoiceValueForLTV(i), 0);
  const landedCount = paid.length;
  const issuedInvs = invs.filter(i => i.issued);
  const notIssuedInvs = invs.filter(i => !i.issued);
  const issuedAmt = issuedInvs.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  const notIssuedAmt = notIssuedInvs.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  const overdueAmt = overdue.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  const uncertainInvs = invs.filter(isUncertainUnpaid);
  const uncertainAmt = uncertainInvs.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  // The bar below shares the same "stretch to target" treatment: normally
  // its segments fill the full width (summing to 100% of the bar's own
  // total), but when a target's set (Due month view only) and it's bigger
  // than that total, the bar's scale stretches to the target instead and the
  // shortfall shows as a dashed gap segment.
  const gapOf = (total) => {
    const scale = (target != null && target > total) ? target : total;
    const amt = Math.max(0, scale - total);
    return { scale, amt, pct: scale ? (amt / scale * 100) : 0 };
  };

  // Master bar: every invoice this month in exactly one of four states,
  // assigned by priority so the groups are always mutually exclusive and
  // always add up to the whole month — paid wins regardless of anything else
  // (Landed), then not-yet-issued (To issue), then overdue, then whatever's
  // left (issued, awaiting payment, not yet due). This is deliberately its
  // own partition rather than reusing bar 2's `overdue` set directly:
  // isOverdue() alone doesn't check issued status, so an unissued-but-
  // past-due invoice would otherwise get counted in both "To issue" and
  // "Overdue" at once.
  const masterLandedInvs = invs.filter(i => i.paid);
  // Uncertain invoices (flagged, still unpaid) are left out of this projected
  // total — they stay in the table, stat cards and filters, and still get issued.
  const masterToIssueInvs = invs.filter(i => !i.paid && !i.issued && !i.uncertain);
  const masterOverdueInvs = invs.filter(i => !i.paid && i.issued && isOverdue(i) && !i.uncertain);
  const masterAwaitingInvs = invs.filter(i => !i.paid && i.issued && !isOverdue(i) && !i.uncertain);
  const masterLandedAmt = masterLandedInvs.reduce((s, i) => s + invoiceValueForLTV(i), 0);
  const masterToIssueAmt = masterToIssueInvs.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  const masterOverdueAmt = masterOverdueInvs.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  const masterAwaitingAmt = masterAwaitingInvs.reduce((s, i) => s + (Number(i.amountGBP) || 0), 0);
  const masterTotal = masterLandedAmt + masterToIssueAmt + masterOverdueAmt + masterAwaitingAmt;
  const masterGap = gapOf(masterTotal);
  const masterLandedPct = masterGap.scale ? (masterLandedAmt / masterGap.scale * 100) : 0;
  const masterToIssuePct = masterGap.scale ? (masterToIssueAmt / masterGap.scale * 100) : 0;
  const masterAwaitingPct = masterGap.scale ? (masterAwaitingAmt / masterGap.scale * 100) : 0;
  const masterOverduePct = masterGap.scale ? (masterOverdueAmt / masterGap.scale * 100) : 0;

  // One filter set shared by everything that can drill into the table below —
  // the toolbar pills, the stat cards, and the two progress bars. Each maps
  // to exactly the same invoice set its stat/segment displays, so clicking
  // any of them shows precisely what you just looked at, never an
  // almost-but-not-quite-matching list.
  let shown = invs;
  if (state.invFilter === 'issued')   shown = issuedInvs;
  if (state.invFilter === 'toissue')  shown = notIssuedInvs;
  if (state.invFilter === 'awaiting') shown = awaiting;
  if (state.invFilter === 'overdue')  shown = overdue;
  if (state.invFilter === 'paid')     shown = paid;
  if (state.invFilter === 'uncertain') shown = uncertainInvs;

  view.innerHTML = `
    <div class="toolbar">
      ${viewTogglePills()}
      <div class="month-nav">
        <button id="inv-prev" title="Previous month">‹</button>
        <button type="button" class="month-field" id="inv-month-btn">${esc(monthLabel(m))}</button>
        <button id="inv-next" title="Next month">›</button>
      </div>
      <div class="pills">
        ${[['all','All'],['issued','Issued'],['toissue','To issue'],['awaiting','Awaiting payment'],['overdue','Chase — overdue'],['paid','Paid'],['uncertain','Uncertain']]
          .map(([k,l]) => `<button class="pill ${state.invFilter===k?'active':''}" data-f="${k}">${l}</button>`).join('')}
      </div>
      <div class="pills" title="Group invoices by the month they're issued, or the month they're due">
        ${[['due','Due month'],['issued','Issued month']]
          .map(([k,l]) => `<button class="pill ${state.invDateBasis===k?'active':''}" data-basis="${k}">${l}</button>`).join('')}
      </div>
      <div class="month-nav">
        <label class="dim" style="font-size:11px">Sort</label>
        <select id="inv-sort">
          <option value="due" ${state.invSort==='due'?'selected':''}>Due date</option>
          <option value="issued" ${state.invSort==='issued'?'selected':''}>Issue date</option>
          <option value="joined" ${state.invSort==='joined'?'selected':''}>Client joined</option>
        </select>
      </div>
      <div class="spacer"></div>
      ${canClearMonth ? `<button class="btn btn-danger" id="inv-clear" title="Undo the last generation for ${esc(monthLabel(m))}">🗑 Clear month</button>` : ''}
      <button class="btn" id="inv-generate" title="Generate ${esc(monthLabel(nextGenMonth))}">🧾 Generate next month</button>
      <button class="btn" id="inv-add">＋ Add invoice</button>
    </div>

    ${showGenBanner ? `<div class="chart-card" style="display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap">
      <div><strong>${esc(monthLabel(nextGenMonth))}</strong> hasn't been generated yet — nothing will appear here until you run it.</div>
      <button class="btn btn-primary" id="inv-gen-banner">Generate ${esc(monthLabelShort(nextGenMonth))}</button>
    </div>` : ''}

    <div class="stats" id="inv-stats">
      <div class="stat clickable-stat ${state.invFilter === 'all' ? 'filter-active' : ''}" data-stat="invoices" data-filter="all"><div class="v">${invs.length}</div><div class="l">Invoices</div><div class="s">${fmtMoney(billed)}</div></div>
      <div class="stat clickable-stat ${state.invFilter === 'issued' ? 'filter-active' : ''}" data-stat="issued" data-filter="issued"><div class="v">${issuedInvs.length}</div><div class="l">Issued</div><div class="s">${fmtMoney(issuedAmt)}</div></div>
      <div class="stat clickable-stat ${notIssuedInvs.length ? 'warn' : ''} ${state.invFilter === 'toissue' ? 'filter-active' : ''}" data-stat="toissue" data-filter="toissue"><div class="v">${notIssuedInvs.length}</div><div class="l">To be issued</div><div class="s">${fmtMoney(notIssuedAmt)}</div></div>
      <div class="stat clickable-stat ok ${state.invFilter === 'paid' ? 'filter-active' : ''}" data-stat="landed" data-filter="paid">
        <div class="v">${fmtMoney(landed)}</div>
        <div class="l">Landed</div>
        ${basis === 'due'
          ? `<button type="button" class="stat-sub-btn" id="inv-target-edit" title="Click to set this month's revenue target">${target != null ? (landed >= target ? `On target of ${fmtMoney(target)}` : `${fmtMoney(target - landed)} short of ${fmtMoney(target)}`) : `Set target · ${landedCount} payment${landedCount === 1 ? '' : 's'} in`}</button>`
          : `<div class="s" title="Targets are set per due-month, so they only show up in the Due month view">${landedCount} payment${landedCount === 1 ? '' : 's'} in</div>`}
      </div>
      <div class="stat clickable-stat ${overdue.length ? 'bad' : ''} ${state.invFilter === 'overdue' ? 'filter-active' : ''}" data-stat="overdue" data-filter="overdue"><div class="v">${overdue.length}</div><div class="l">Overdue</div><div class="s">${fmtMoney(overdueAmt)}</div></div>
      ${uncertainInvs.length || state.invFilter === 'uncertain' ? `<div class="stat clickable-stat ${state.invFilter === 'uncertain' ? 'filter-active' : ''}" data-stat="uncertain" data-filter="uncertain" title="Issued as normal, but we're not sure the client will pay — left out of forecasts until paid"><div class="v">${uncertainInvs.length}</div><div class="l">Uncertain <span class="unc-badge">?</span></div><div class="s">${fmtMoney(uncertainAmt)} · not in forecasts</div></div>` : ''}
    </div>

    <div class="progress-bars">
      <div class="progress-bar-row">
        <div class="progress-bar-label">Total</div>
        <div class="progress-bar" title="${target != null ? 'Full month vs. target' : 'Full month'}, by £ — click a segment to filter the table below">
          <div class="progress-seg" data-highlight="landed" data-filter="paid" data-desc="Invoices already paid this month" style="width:${masterLandedPct}%; background:var(--success)" title="Landed — ${esc(fmtMoney(masterLandedAmt))}">${masterLandedPct >= 14 ? `<span>Landed ${esc(fmtMoney(masterLandedAmt))}</span>` : ''}</div>
          <div class="progress-seg" data-highlight="awaiting" data-filter="awaiting" data-desc="Issued and awaiting payment — not yet due" style="width:${masterAwaitingPct}%; background:var(--accent)" title="Issued — ${esc(fmtMoney(masterAwaitingAmt))}">${masterAwaitingPct >= 14 ? `<span>Issued ${esc(fmtMoney(masterAwaitingAmt))}</span>` : ''}</div>
          <div class="progress-seg" data-highlight="toissue" data-filter="toissue" data-desc="Not yet issued to the client" style="width:${masterToIssuePct}%; background:var(--warn)" title="To issue — ${esc(fmtMoney(masterToIssueAmt))}">${masterToIssuePct >= 14 ? `<span>To issue ${esc(fmtMoney(masterToIssueAmt))}</span>` : ''}</div>
          <div class="progress-seg" data-highlight="overdue" data-filter="overdue" data-desc="Issued and past their due date" style="width:${masterOverduePct}%; background:var(--danger)" title="Overdue — ${esc(fmtMoney(masterOverdueAmt))}">${masterOverduePct >= 14 ? `<span>Overdue ${esc(fmtMoney(masterOverdueAmt))}</span>` : ''}</div>
          ${masterGap.pct > 0 ? `<div class="progress-gap" data-desc="Still short of this month's target" style="width:${masterGap.pct}%" title="Gap to target — ${esc(fmtMoney(masterGap.amt))}">${masterGap.pct >= 14 ? `<span>${esc(fmtMoney(masterGap.amt))} to target</span>` : ''}</div>` : ''}
          ${target != null && masterGap.scale ? `<div class="progress-goal" data-desc="This month's revenue target" style="left:min(calc(${target / masterGap.scale * 100}% - 1px), calc(100% - 2px))" title="Target — ${esc(fmtMoney(target))}${masterGap.pct > 0 ? '' : ' (exceeded)'}"></div>` : ''}
        </div>
      </div>
      ${uncertainInvs.length ? `<div class="note" style="margin-top:6px"><span class="unc-badge" style="margin-left:0">?</span> ${uncertainInvs.length} uncertain invoice${uncertainInvs.length === 1 ? '' : 's'} (${fmtMoney(uncertainAmt)}) still to be paid ${uncertainInvs.length === 1 ? 'isn’t' : 'aren’t'} counted in this bar. <button type="button" class="stat-sub-btn" style="display:inline; margin-left:4px" data-show-uncertain>Show</button></div>` : ''}
    </div>

    <div class="tbl-wrap tbl-flow">
      <table>
        <thead><tr>
          <th></th><th>Company</th><th>Email</th><th>Issue</th><th>Due</th>
          <th class="num">Amount</th><th class="num">Mo#</th>
          <th style="text-align:center">Issued</th><th style="text-align:center">Paid</th>
          <th style="text-align:center" title="Not sure this will be paid — still issued as normal, but left out of forecasts until it's paid">Uncertain</th>
          <th>Paid on</th><th>AM</th><th>Notes</th>
        </tr></thead>
        <tbody>
          ${shown.length ? shown.map(invoiceRow).join('') : `<tr><td colspan="13"><div class="empty">No invoices${state.invFilter !== 'all' ? ' matching this filter' : ' in ' + monthLabel(m)}.</div></td></tr>`}
        </tbody>
      </table>
    </div>`;

  wireViewToggle(view);
  const monthBtn = view.querySelector('#inv-month-btn');
  monthBtn.onclick = () => openMonthPicker(monthBtn, {
    value: m,
    onSelect: key => { state.invMonth = key; renderInvoices(); }
  });
  view.querySelector('#inv-prev').onclick = () => { state.invMonth = addMonths(state.invMonth, -1); renderInvoices(); };
  view.querySelector('#inv-next').onclick = () => { state.invMonth = addMonths(state.invMonth, 1); renderInvoices(); };
  view.querySelectorAll('.pill[data-f]').forEach(p => p.onclick = () => { state.invFilter = p.dataset.f; renderInvoices(); });
  view.querySelectorAll('.pill[data-basis]').forEach(p => p.onclick = () => { state.invDateBasis = p.dataset.basis; renderInvoices(); });
  view.querySelector('#inv-sort').onchange = e => { state.invSort = e.target.value; renderInvoices(); };
  view.querySelector('#inv-add').onclick = () => invoiceForm(null);
  view.querySelector('#inv-target-edit')?.addEventListener('click', () => editTargetModal(m));
  view.querySelector('[data-show-uncertain]')?.addEventListener('click', () => { state.invFilter = 'uncertain'; renderInvoices(); });
  const invStatsEl = view.querySelector('#inv-stats');
  view.querySelectorAll('.progress-seg[data-highlight]').forEach(seg => {
    seg.addEventListener('mouseenter', () => {
      // "Awaiting" has no matching stat card (it only exists on the bar), so
      // there's nothing to dim-and-highlight for it — leave the stats row alone.
      const match = invStatsEl.querySelector(`[data-stat="${seg.dataset.highlight}"]`);
      if (!match) return;
      invStatsEl.classList.add('dim-others');
      match.classList.add('stat-highlighted');
    });
    seg.addEventListener('mouseleave', () => {
      invStatsEl.classList.remove('dim-others');
      invStatsEl.querySelectorAll('.stat-highlighted').forEach(el => el.classList.remove('stat-highlighted'));
    });
  });
  // Clicking a stat card or a bar segment filters the table below to exactly
  // the set it represents — both read the same data-filter value, which maps
  // 1:1 onto the `shown` logic above, so a card/segment and its filtered
  // result always agree.
  view.querySelectorAll('#inv-stats [data-filter], .progress-seg[data-filter]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.stat-sub-btn')) return; // the Landed card's target-edit link, not a filter click
      state.invFilter = el.dataset.filter;
      renderInvoices();
    });
  });
  view.querySelector('#inv-generate').onclick = () => openGenerateMonthWizard();
  view.querySelector('#inv-gen-banner')?.addEventListener('click', () => openGenerateMonthWizard());
  view.querySelector('#inv-clear')?.addEventListener('click', () => {
    const monthInvoices = DB.invoices.filter(i => i.month === m);
    const isLegacyMonth = monthInvoices.length > 0 && !monthInvoices.some(i => i.generatedByWizard);
    const genCount = isLegacyMonth ? monthInvoices.length : monthInvoices.filter(i => i.generatedByWizard).length;
    const leavingCount = isLegacyMonth ? 0 : DB.clients.filter(c => c.status === 'churned' && c.churnMonth === m).length;
    const skipCount = isLegacyMonth ? 0 : DB.clients.filter(c => c.skipMonths?.includes(m)).length;
    const parts = [];
    if (genCount) parts.push(`delete ${genCount} invoice${genCount === 1 ? '' : 's'}`);
    if (leavingCount) parts.push(`reactivate ${leavingCount} client${leavingCount === 1 ? '' : 's'} marked as leaving`);
    if (skipCount) parts.push(`un-skip ${skipCount} client${skipCount === 1 ? '' : 's'}`);
    const summary = !parts.length
      ? `Nothing was generated for this month yet, so there's nothing to undo. `
      : isLegacyMonth
        ? `This will ${parts.join(', ')}. This month predates the "generated vs. manually added" tracking, so there's no way to tell them apart — every invoice for this month is removed. `
        : `This will ${parts.join(', ')}. Manually-added invoices for this month are kept. `;
    confirmModal(`Clear <strong>${esc(monthLabel(m))}</strong>? ${summary}You'll be able to run "Generate next month" for ${esc(monthLabel(m))} again afterwards.`, () => {
      clearMonth(m);
      renderAll();
    }, 'Clear month');
  });

  wireInvoiceRowActions(view);
}

function invoiceRow(inv) {
  const c = clientById(inv.clientId);
  const od = isOverdue(inv);
  const issueOd = isIssueOverdue(inv);
  const rowStateClass = od && issueOd ? 'row-both-overdue' : od ? 'row-due-overdue' : issueOd ? 'row-issue-overdue' : '';
  const done = inv.issued && inv.paid;
  const canCopy = !inv.issued;
  const nativeAmt = inv.amountUSD ? fmtMoney(inv.amountUSD, '$') : inv.amountEUR ? fmtMoney(inv.amountEUR, '€') : null;
  const gbpTxt = fmtMoney(inv.amountGBP);
  const landedDiffers = inv.paid && inv.amountLanded != null && inv.amountLanded !== inv.amountGBP;
  const landedLine = landedDiffers ? `<div class="sub" style="color:var(--warn)">landed ${fmtMoney(inv.amountLanded)}</div>` : '';
  const amountCell = (nativeAmt
    ? `<span class="money${canCopy ? ' copyable' : ''}"${canCopy ? ` data-copy="${esc(nativeAmt)}"` : ''}>${nativeAmt}</span>` +
      `<div class="sub${canCopy ? ' copyable' : ''}"${canCopy ? ` data-copy="${esc(gbpTxt)}"` : ''}>${gbpTxt}</div>`
    : `<span class="money${canCopy ? ' copyable' : ''}"${canCopy ? ` data-copy="${esc(gbpTxt)}"` : ''}>${gbpTxt}</span>`) + landedLine;
  const emailTxt = c?.email || '';
  const emailCell = emailTxt
    ? `<span class="email-trunc" data-email-view="${esc(emailTxt)}">${esc(emailTxt)}</span>`
    : '—';
  return `<tr class="${rowStateClass}${done ? ' done' : ''}${inv.issuedLate ? ' issued-late' : ''}${isUncertainUnpaid(inv) ? ' row-uncertain' : ''}">
    <td style="white-space:nowrap">
      <button class="btn btn-sm" data-inv-edit="${inv.id}" title="Edit invoice">✎</button>
      <button class="btn btn-sm btn-danger" data-inv-delete="${inv.id}" title="Delete invoice">🗑</button>
    </td>
    <td><strong>${esc(c?.companyName || '?')}</strong>${c?.autoIssue ? ' <span class="badge purple">Auto</span>' : ''}${isUncertainUnpaid(inv) ? '<span class="unc-badge" title="Uncertain — we’re not sure this will be paid. Issued as normal, but not counted in forecasts until it’s paid.">?</span>' : ''}
        <div class="sub">${esc(c?.qbName || '')}</div></td>
    <td class="dim small">${emailCell}</td>
    <td>${issueOd ? `<span style="color:var(--danger);font-weight:600">${fmtDate(inv.issueDate)}</span>` : fmtDate(inv.issueDate)}</td>
    <td>${od ? `<span style="color:var(--danger);font-weight:600">${fmtDate(inv.dueDate)}</span>` : fmtDate(inv.dueDate)}</td>
    <td class="num">${amountCell}</td>
    <td class="num">${inv.monthNumber ?? '—'}</td>
    <td style="text-align:center"><input type="checkbox" data-inv-issued="${inv.id}" ${inv.issued ? 'checked' : ''}></td>
    <td style="text-align:center"><input type="checkbox" data-inv-paid="${inv.id}" ${inv.paid ? 'checked' : ''}></td>
    <td style="text-align:center"><input type="checkbox" data-inv-uncertain="${inv.id}" ${inv.uncertain ? 'checked' : ''} title="Uncertain — not sure this will be paid. Still issued as normal; left out of forecasts until it's paid."></td>
    <td class="dim">${inv.paid ? `<button type="button" class="date-field${inv.paidDate ? '' : ' empty'}" data-inv-paiddate="${inv.id}" data-value="${esc(inv.paidDate || '')}">${inv.paidDate ? fmtDate(inv.paidDate) : 'Set date'}</button>` : '—'}</td>
    <td class="dim"><select class="inv-am" data-inv-am="${inv.id}" title="Change this invoice's account manager">${selectOptions(DB.settings.accountManagers, invoiceAM(inv), !invoiceAM(inv))}</select></td>
    <td class="dim small" style="max-width:180px; overflow:hidden; text-overflow:ellipsis" title="${esc(inv.notes || '')}">${esc(inv.notes || '')}</td>
  </tr>`;
}

/* ════════════════ CALENDAR VIEW ════════════════ */
function calendarIndex() {
  const idx = {};
  const add = (date, type, inv) => { if (!date) return; (idx[date] ||= { issued: [], due: [] })[type].push(inv); };
  for (const inv of DB.invoices) { add(inv.issueDate, 'issued', inv); add(inv.dueDate, 'due', inv); }
  return idx;
}
function calStep(dir) {
  if (state.calScale === 'month') state.calDate = addMonths(state.calDate.slice(0, 7), dir) + '-01';
  else if (state.calScale === 'week') state.calDate = addDaysISO(state.calDate, dir * 7);
  else state.calDate = addDaysISO(state.calDate, dir);
  renderInvoices();
}
function calHeading() {
  if (state.calScale === 'month') return monthLabel(state.calDate.slice(0, 7));
  if (state.calScale === 'week') {
    const start = startOfWeekMon(state.calDate);
    return `${fmtDate(start)} – ${fmtDate(addDaysISO(start, 6))}`;
  }
  return `${WEEKDAYS[weekdayOf(state.calDate)]}, ${fmtDate(state.calDate)}`;
}
function calChip(inv, kind) {
  const c = clientById(inv.clientId);
  const overdue = kind === 'due' && isOverdue(inv);
  return `<button type="button" class="cal-chip" data-inv="${inv.id}">
    <span class="cal-chip-dot ${kind}${overdue ? ' overdue' : ''}"></span>
    <span class="cal-chip-name">${esc(c?.companyName || '?')}</span>
    ${isUncertainUnpaid(inv) ? '<span class="unc-badge" style="margin:0 4px 0 0" title="Uncertain — not counted in forecasts until paid">?</span>' : ''}<span class="cal-chip-amt">${fmtMoney(inv.amountGBP)}</span>
  </button>`;
}
function calLegend() {
  return `<div class="chart-legend" style="margin-top:14px">
    <span class="key"><span class="cal-dot issue"></span>Issued that day</span>
    <span class="key"><span class="cal-dot due"></span>Due that day</span>
    <span class="key"><span class="cal-dot due overdue"></span>Overdue &amp; unpaid</span>
    <span class="key"><span class="unc-badge" style="margin:0">?</span>Uncertain — not counted in forecasts</span>
  </div>`;
}

function renderCalMonth(idx) {
  const mk = state.calDate.slice(0, 7);
  const first = `${mk}-01`;
  const last = `${mk}-${String(daysInMonth(mk)).padStart(2, '0')}`;
  const gridStart = startOfWeekMon(first);
  const gridEnd = addDaysISO(startOfWeekMon(last), 6);
  const today = todayISO();

  let weeksHtml = '';
  let cur = gridStart;
  while (cur <= gridEnd) {
    const weekStart = cur;
    let row = `<button type="button" class="cal-weeklabel" data-week="${weekStart}" title="Zoom to this week">${MON3[Number(weekStart.slice(5, 7)) - 1]} ${Number(weekStart.slice(8, 10))}</button>`;
    for (let i = 0; i < 7; i++) {
      const d = cur;
      const inMonth = d.slice(0, 7) === mk;
      const day = idx[d] || { issued: [], due: [] };
      const hasEvents = day.issued.length || day.due.length;
      const overdueDue = day.due.some(inv => isOverdue(inv));
      row += `<button type="button" class="cal-day ${hasEvents ? 'has-events' : ''} ${inMonth ? '' : 'other-month'} ${d === today ? 'today' : ''}" data-date="${d}">
        <span class="cal-daynum">${Number(d.slice(8, 10))}</span>
        ${hasEvents ? `<span class="cal-marks">
          ${day.issued.length ? `<span class="cal-mark issue" title="${day.issued.length} invoice${day.issued.length===1?'':'s'} issue today">${day.issued.length}</span>` : ''}
          ${day.due.length ? `<span class="cal-mark due ${overdueDue ? 'overdue' : ''}" title="${day.due.length} invoice${day.due.length===1?'':'s'} due today">${day.due.length}</span>` : ''}
        </span>` : ''}
      </button>`;
      cur = addDaysISO(cur, 1);
    }
    weeksHtml += `<div class="cal-week-row">${row}</div>`;
  }

  return `<div class="cal-grid-wrap">
      <div class="cal-week-row cal-week-head">
        <span></span>
        ${WD3.map(d => `<span class="cal-headcell">${d}</span>`).join('')}
      </div>
      ${weeksHtml}
    </div>${calLegend()}`;
}

function renderCalWeek(idx) {
  const start = startOfWeekMon(state.calDate);
  const today = todayISO();
  let cols = '';
  for (let i = 0; i < 7; i++) {
    const d = addDaysISO(start, i);
    const day = idx[d] || { issued: [], due: [] };
    const items = [...day.issued.map(inv => ({ inv, kind: 'issue' })), ...day.due.map(inv => ({ inv, kind: 'due' }))];
    cols += `<div class="cal-weekcol ${d === today ? 'today' : ''}">
      <button type="button" class="cal-weekcol-head" data-date="${d}" title="View this day">
        <span class="wd">${WD3[i]}</span><span class="dn">${Number(d.slice(8, 10))}</span>
      </button>
      <div class="cal-weekcol-body">
        ${items.length ? items.map(({ inv, kind }) => calChip(inv, kind)).join('') : '<div class="cal-empty">—</div>'}
      </div>
    </div>`;
  }
  return `<div class="cal-week-wrap">${cols}</div>${calLegend()}`;
}

function renderCalDay(idx) {
  const d = state.calDate;
  const day = idx[d] || { issued: [], due: [] };
  const map = new Map();
  day.issued.forEach(inv => map.set(inv.id, inv));
  day.due.forEach(inv => map.set(inv.id, inv));
  const invs = [...map.values()];
  return `<div class="tbl-wrap tbl-flow">
      <table>
        <thead><tr>
          <th></th><th>Company</th><th>Email</th><th>Issue</th><th>Due</th>
          <th class="num">Amount</th><th class="num">Mo#</th>
          <th style="text-align:center">Issued</th><th style="text-align:center">Paid</th>
          <th style="text-align:center" title="Not sure this will be paid — still issued as normal, but left out of forecasts until it's paid">Uncertain</th>
          <th>Paid on</th><th>AM</th><th>Notes</th>
        </tr></thead>
        <tbody>
          ${invs.length ? invs.map(invoiceRow).join('') : `<tr><td colspan="13"><div class="empty">No invoices issue or due on ${fmtDate(d)}.</div></td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function renderInvoicesCalendar() {
  const view = document.getElementById('view-invoices');
  if (!state.calDate) state.calDate = todayISO();
  const idx = calendarIndex();

  const body = state.calScale === 'month' ? renderCalMonth(idx)
    : state.calScale === 'week' ? renderCalWeek(idx)
    : renderCalDay(idx);

  view.innerHTML = `
    <div class="toolbar">
      ${viewTogglePills()}
      <div class="month-nav">
        <button id="cal-prev" title="Previous">‹</button>
        <span style="font-weight:700; font-size:14px; min-width:190px; text-align:center; display:inline-block">${calHeading()}</span>
        <button id="cal-next" title="Next">›</button>
      </div>
      <button class="btn btn-sm" id="cal-today">Today</button>
      <div class="pills">
        ${[['month', 'Month'], ['week', 'Week'], ['day', 'Day']].map(([k, l]) => `<button class="pill ${state.calScale === k ? 'active' : ''}" data-scale="${k}">${l}</button>`).join('')}
      </div>
      <div class="spacer"></div>
    </div>
    ${body}`;

  wireViewToggle(view);
  view.querySelector('#cal-prev').onclick = () => calStep(-1);
  view.querySelector('#cal-next').onclick = () => calStep(1);
  view.querySelector('#cal-today').onclick = () => { state.calDate = todayISO(); renderInvoices(); };
  view.querySelectorAll('[data-scale]').forEach(b => b.onclick = () => { state.calScale = b.dataset.scale; renderInvoices(); });
  view.querySelectorAll('.cal-day[data-date]').forEach(b => b.onclick = () => { state.calScale = 'day'; state.calDate = b.dataset.date; renderInvoices(); });
  view.querySelectorAll('.cal-weeklabel[data-week]').forEach(b => b.onclick = () => { state.calScale = 'week'; state.calDate = b.dataset.week; renderInvoices(); });
  view.querySelectorAll('.cal-weekcol-head[data-date]').forEach(b => b.onclick = () => { state.calScale = 'day'; state.calDate = b.dataset.date; renderInvoices(); });
  view.querySelectorAll('.cal-chip[data-inv]').forEach(b => b.onclick = () => invoiceForm(b.dataset.inv));

  wireInvoiceRowActions(view);
}

/* ── Generate-next-month wizard ── */
// The deliberate, reviewable replacement for the old silent auto-generation:
// always targets exactly one month — the one right after
// DB.settings.invoicingGeneratedThrough — never lets you jump ahead. Shows
// every non-churned client due to appear (i.e. already started) as an
// editable row with Leaving/Skip checkboxes, plus a way to bring a churned
// client back in. Confirming hands everything to generateInvoicesForMonth().
function openGenerateMonthWizard() {
  const targetMonth = addMonths(DB.settings.invoicingGeneratedThrough, 1);
  const baseRoster = DB.clients
    .filter(c => c.status !== 'churned' && (!c.startMonth || c.startMonth <= targetMonth))
    .sort((a, b) => a.companyName.localeCompare(b.companyName));
  const churnedClients = DB.clients.filter(c => c.status === 'churned').sort((a, b) => a.companyName.localeCompare(b.companyName));
  let broughtBackIds = [];

  const rosterRow = c => `<tr data-row="${c.id}">
    <td><strong>${esc(c.companyName)}</strong><div class="sub">${esc(c.package || '')}</div></td>
    <td class="dim">${esc(c.accountManager || '')}</td>
    <td class="num money">${fmtMoney(c.feeGBP)}</td>
    <td style="text-align:center"><input type="checkbox" data-leaving="${c.id}"></td>
    <td style="text-align:center"><input type="checkbox" data-skip="${c.id}"></td>
  </tr>`;

  const render = () => {
    const roster = [...baseRoster, ...broughtBackIds.map(clientById).filter(Boolean)];
    const bringBackOptions = churnedClients.filter(c => !broughtBackIds.includes(c.id));
    openModal(`
      <div class="modal-head"><h3>Generate invoices — ${esc(monthLabel(targetMonth))}</h3><button class="modal-x" data-close>×</button></div>
      <p class="note" style="margin-bottom:14px">Unticked clients get their next invoice generated automatically, same pricing/package/dates as before. Tick <strong>Leaving</strong> to churn a client from this month, or <strong>Skip</strong> to leave them out this month only — they'll be back on the list to decide again next time.</p>
      <div class="tbl-wrap" style="max-height:420px; overflow-y:auto">
        <table>
          <thead><tr><th>Client</th><th>AM</th><th class="num">Fee £</th><th>Leaving</th><th>Skip this month</th></tr></thead>
          <tbody>${roster.length ? roster.map(rosterRow).join('') : '<tr><td colspan="5"><div class="empty">No active clients due to appear this month.</div></td></tr>'}</tbody>
        </table>
      </div>
      <div class="fld" style="margin-top:14px">
        <label>Bring back a churned client</label>
        <div style="display:flex; gap:8px">
          <select id="gm-bringback" style="flex:1">${bringBackOptions.length ? `<option value="" disabled selected>Select a client…</option>` + bringBackOptions.map(c => `<option value="${c.id}">${esc(c.companyName)}</option>`).join('') : '<option value="">No churned clients</option>'}</select>
          <button type="button" class="btn" id="gm-bringback-add" ${bringBackOptions.length ? '' : 'disabled'}>Add</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" id="gm-confirm">Generate ${esc(monthLabelShort(targetMonth))}</button>
      </div>`, true);

    document.getElementById('gm-bringback-add').onclick = () => {
      const id = document.getElementById('gm-bringback').value;
      if (!bringBackOptions.some(c => c.id === id)) return;
      broughtBackIds.push(id); // status flips to active only on final Confirm — Cancel must leave nothing changed
      render();
    };
    document.getElementById('gm-confirm').onclick = () => {
      const leaving = new Set([...document.querySelectorAll('[data-leaving]:checked')].map(el => el.dataset.leaving));
      const skip = new Set([...document.querySelectorAll('[data-skip]:checked')].map(el => el.dataset.skip));
      const rosterIds = roster.map(c => c.id);
      broughtBackIds.forEach(id => { const c = clientById(id); if (c) c.status = 'active'; });
      closeModal();
      const created = generateInvoicesForMonth(targetMonth, rosterIds, { leaving, skip });
      renderAll();
      showReport3Reminder(targetMonth, created);
    };
  };
  render();
}

/* ── Invoice add/edit form ── */
// presetClientId pre-selects a client in the dropdown when reopening this
// form after creating one on the fly (see the "+ New client…" option below)
// — invId is always null in that case, this is only ever used for new invoices.
function invoiceForm(invId, presetClientId) {
  const inv = invId ? DB.invoices.find(i => i.id === invId) : null;
  const clients = [...DB.clients].sort((a, b) => a.companyName.localeCompare(b.companyName));
  const defMonth = inv?.month || state.invMonth || currentMonthKey();

  // Active clients are by far the most likely pick, so they're listed first,
  // with churned clients grouped separately below a visual break — still
  // reachable (e.g. adding a historical invoice) but out of the way.
  const activeClients = clients.filter(c => c.status !== 'churned');
  const churnedClients = clients.filter(c => c.status === 'churned');
  // A new invoice shouldn't default to any particular client — the picker
  // opens on a disabled placeholder so nothing looks pre-chosen, forcing a
  // deliberate pick. (Editing an existing invoice still defaults to its own
  // client as before — that one's never ambiguous.)
  const defaultClientId = inv?.clientId || presetClientId || null;
  const clientOption = c => `<option value="${c.id}" ${c.id === defaultClientId ? 'selected' : ''}>${esc(c.companyName)}</option>`;
  const clientOptionsHtml = (inv ? '' : `<option value="" disabled ${!defaultClientId ? 'selected' : ''}>Select a client…</option><option value="__new__">＋ New client…</option>`)
    + `<optgroup label="Active clients">${activeClients.map(clientOption).join('')}</optgroup>`
    + (churnedClients.length ? `<optgroup label="Churned clients">${churnedClients.map(clientOption).join('')}</optgroup>` : '');

  openModal(`
    <div class="modal-head"><h3>${inv ? 'Edit invoice' : 'Add invoice'}</h3><button class="modal-x" data-close>×</button></div>
    <div class="fgrid">
      <div class="fld full"><label>Client</label>
        <select id="if-client">${clientOptionsHtml}</select>
      </div>
      <div class="fld"><label>Month</label><input type="month" id="if-month" value="${esc(defMonth)}"></div>
      <div class="fld"><label>Month number (1 = first invoice)</label><input type="number" id="if-mono" min="1" value="${inv?.monthNumber ?? ''}"></div>
      <div class="fld"><label>Package</label><select id="if-pkg" data-add-list="packages">${selectOptions(DB.settings.packages, inv?.package, true, 'packages')}</select></div>
      <div class="fld"><label>Account manager</label><select id="if-am" data-add-list="accountManagers">${selectOptions(DB.settings.accountManagers, inv ? invoiceAM(inv) : '', true, 'accountManagers')}</select></div>
      <div class="fld"><label>Issue date</label><input type="date" id="if-issue" value="${esc(inv?.issueDate || '')}"></div>
      <div class="fld"><label>Due date</label><input type="date" id="if-due" value="${esc(inv?.dueDate || '')}"></div>
      <div class="fld"><label>Amount £</label><input type="number" step="0.01" id="if-gbp" value="${inv?.amountGBP ?? ''}"></div>
      <div class="fld"><label>Amount $ (optional)</label><input type="number" step="0.01" id="if-usd" value="${inv?.amountUSD ?? ''}"></div>
      <div class="fld"><label>Amount € (optional)</label><input type="number" step="0.01" id="if-eur" value="${inv?.amountEUR ?? ''}"></div>
      <div class="fld"><label>Paid date</label><input type="date" id="if-paiddate" value="${esc(inv?.paidDate || '')}"></div>
      <div class="fld"><label>Amount landed £ (if paid)</label><input type="number" step="0.01" id="if-landed" value="${inv?.amountLanded ?? ''}"></div>
      <div class="fld"><label class="chk"><input type="checkbox" id="if-issued" ${inv?.issued ? 'checked' : ''}> Issued</label>
          <label class="chk"><input type="checkbox" id="if-paid" ${inv?.paid ? 'checked' : ''}> Paid</label>
          <label class="chk" title="Not sure the client will pay. Still issued as normal; left out of forecasts until it's paid."><input type="checkbox" id="if-uncertain" ${inv?.uncertain ? 'checked' : ''}> Uncertain</label></div>
      <div class="fld full"><label>Notes</label><textarea id="if-notes">${esc(inv?.notes || '')}</textarea></div>
    </div>
    ${!inv ? `<p class="note">A client's <strong>first</strong> invoice has no default dates — enter them manually (e.g. when the contract's actually issued/due). From invoice 2 onward, issue and due dates auto-fill from that client's last invoice, but you can still pick any month or edit either date.</p>` : ''}
    ${inv ? `<p class="note">Editing this invoice only changes this one — it won't affect the client's ongoing fee or any already-generated future invoices (edit the client for that). If you set a <strong>package</strong> here that's different from the client's own, it's locked to this invoice — future client package changes won't overwrite it. Leave it matching the client's package to keep this invoice following along automatically.</p>` : ''}
    <div class="modal-foot">
      ${inv ? '<button class="btn btn-danger left" id="if-del">Delete invoice</button>' : ''}
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn-primary" id="if-save">${inv ? 'Save changes' : 'Add invoice'}</button>
    </div>`);

  const $ = id => document.getElementById(id);

  // "Month" only exists as a manual fallback for a brand-new invoice #1,
  // which has no due date yet to derive it from. The moment a due date is
  // present, Month always mirrors it — locked (not just defaulted) so it
  // can never silently drift from whatever date you actually typed in. This
  // was previously a real bug: prefill() sets Month from a client's *next
  // scheduled* invoice, and if you then hand-edited the date to a different
  // month (e.g. backdating), Month stayed stale and the invoice filed under
  // the wrong month entirely. Due date (not issue date) is the one that
  // decides the month everywhere in the app — see buildNextInvoiceFor().
  const syncMonthField = () => {
    const hasDue = !!$('if-due').value;
    $('if-month').disabled = hasDue;
    if (hasDue) $('if-month').value = $('if-due').value.slice(0, 7);
  };
  $('if-due').addEventListener('change', syncMonthField);

  if (!inv) {
    const prefill = () => {
      const c = clientById($('if-client').value);
      if (!c) return;
      $('if-gbp').value = c.feeGBP ?? '';
      $('if-usd').value = c.feeUSD ?? '';
      $('if-eur').value = c.feeEUR ?? '';
      setSelectValue($('if-pkg'), c.package);
      setSelectValue($('if-am'), (c.accountManager || '').trim());
      const sched = nextInvoiceSchedule(c.id);
      $('if-mono').value = sched.monthNumber;
      $('if-issue').value = sched.issueDate || '';
      $('if-due').value = sched.dueDate || '';
      syncMonthField();
    };
    $('if-client').onchange = () => {
      if ($('if-client').value === '__new__') {
        // Cancelling the new-client form returns to a fresh Add invoice
        // pop-up rather than leaving "New client" stuck selected.
        modalOnCancel = () => invoiceForm(null);
        clientForm(null, newClientId => invoiceForm(null, newClientId));
        return;
      }
      prefill();
    };
    prefill();
  } else {
    syncMonthField();
  }

  $('if-save').onclick = () => {
    if (!$('if-client').value || $('if-client').value === '__new__') { $('if-client').focus(); return; }
    // Captured before any field below gets overwritten — for an edit, rec
    // and inv are the same object, so this must run first to see the
    // pre-edit issued/issueDate rather than whatever's about to be saved.
    const wasIssueOverdue = !!inv && isIssueOverdue(inv);
    const amBefore = inv ? invoiceAM(inv) : '';
    const rec = inv || { id: uid() };
    rec.clientId   = $('if-client').value;
    rec.monthNumber= $('if-mono').value ? Number($('if-mono').value) : null;
    rec.issueDate  = $('if-issue').value || null;
    rec.dueDate    = $('if-due').value || null;
    // Belt-and-suspenders: derive month from the actual due date whenever
    // one exists, rather than trusting the (now-disabled, but just in case)
    // Month field — this is the field that decides which month tab/wizard
    // run the invoice belongs to, so it must never disagree with the date.
    rec.month      = (rec.dueDate ? rec.dueDate.slice(0, 7) : $('if-month').value) || currentMonthKey();
    rec.amountGBP  = $('if-gbp').value ? Number($('if-gbp').value) : 0;
    rec.amountUSD  = $('if-usd').value ? Number($('if-usd').value) : null;
    rec.amountEUR  = $('if-eur').value ? Number($('if-eur').value) : null;
    rec.issued     = $('if-issued').checked;
    if (rec.issued && wasIssueOverdue) rec.issuedLate = true;
    if (!rec.issued) rec.issuedLate = false;
    rec.paid       = $('if-paid').checked;
    rec.uncertain  = $('if-uncertain').checked;
    rec.paidDate   = rec.paid ? ($('if-paiddate').value || $('if-due').value || todayISO()) : null;
    rec.amountLanded = rec.paid ? ($('if-landed').value !== '' ? Number($('if-landed').value) : rec.amountGBP) : null;
    rec.package    = $('if-pkg').value;
    // A package that differs from the client's own current package is a deliberate
    // choice — lock it so a later client-level package change doesn't overwrite it.
    // Matching the client's package (still following it) keeps it unlocked.
    rec.packageOverride = rec.package !== (clientById(rec.clientId)?.package || '');
    rec.notes      = $('if-notes').value.trim();
    // The invoice's account manager: a new invoice is always stamped; an existing one is only
    // stamped if it already was, or if you actually changed it (so just opening and saving an
    // older invoice doesn't freeze it to today's client AM).
    const amVal = ($('if-am').value === ADD_NEW_OPTION ? '' : $('if-am').value).trim();
    if (!inv || (inv.accountManager || '').trim() || amVal !== amBefore) rec.accountManager = amVal;
    if (!inv) DB.invoices.push(rec);
    touch(); closeModal(); state.invMonth = rec.month; renderAll();
  };
  if (inv) $('if-del')?.addEventListener('click', () => {
    confirmModal(`Delete this invoice for <strong>${esc(clientById(inv.clientId)?.companyName || '?')}</strong> (${monthLabel(inv.month)})? This cannot be undone.`, () => {
      DB.invoices = DB.invoices.filter(i => i.id !== inv.id);
      touch(); renderAll();
    }, 'Delete');
  });
}

const UNCLASSIFIED = 'UNCLASSIFIED'; // sentinel for "no value set" in industry/country/size filters

// Filter dropdowns and the Client performance indicator's pills only offer
// values at least one client actually has — the settings lists also hold old
// options nobody uses any more, which would just be dead ends there. Whatever
// is currently selected is always kept so a selection never silently vanishes.
// (Add/edit client forms still read the full settings lists directly.)
function optionsInUse(field, list, keep = [], clients = DB.clients) {
  const used = new Set(clients.map(c => fieldValue(c, field)).filter(Boolean));
  const keepSet = new Set([].concat(keep));
  const out = list.filter(v => used.has(v) || keepSet.has(v));
  for (const v of [...used].sort()) if (!out.includes(v)) out.push(v);
  return out;
}
const hasUnclassified = (field, clients = DB.clients) => clients.some(c => !fieldValue(c, field));

// ── Wider industries ──
// Each specific industry tag rolls up into one wider industry via
// settings.industryGroups (industry -> wider industry). A client keeps only its
// specific industry; its wider industry is always derived from this mapping, so
// regrouping an industry in Operational Settings regroups every client at once.
const DEFAULT_WIDE_INDUSTRIES = ['SaaS', 'Marketing', 'PR & Communications', 'Creative & Media', 'Professional services', 'Technology', 'Non-profit & Funding', 'Other'];
const DEFAULT_INDUSTRY_GROUPS = {

  'SaaS - MarTech': 'SaaS', 'SaaS - Other': 'SaaS', 'SaaS - Productivity': 'SaaS', 'SaaS - PropTech': 'SaaS', 'SaaS - SalesTech': 'SaaS',
  'Digital marketing': 'Marketing', '360 marketing agency': 'Marketing', 'Event marketing': 'Marketing',
  'Influencer marketing': 'Marketing', 'Marketing': 'Marketing', 'Marketing & PR': 'Marketing',
  'PR': 'PR & Communications',
  'Branding': 'Creative & Media', 'Design agency': 'Creative & Media', 'Media production': 'Creative & Media', 'Audio production': 'Creative & Media',
  'Accounting': 'Professional services', 'Consultancy': 'Professional services', 'B2B service': 'Professional services',
  'Recruitment': 'Professional services', 'Research': 'Professional services', 'Training': 'Professional services',
  'Tech': 'Technology', 'Tech development': 'Technology', 'Web development': 'Technology', 'MSP': 'Technology',
  'Non-Profit': 'Non-profit & Funding', 'Funding': 'Non-profit & Funding',
  'Other': 'Other', 'B2C': 'Other',
};
// '' when the client has no industry, or its industry isn't grouped yet.
function wideIndustryOf(c) {
  if (!c.industry) return '';
  const g = (DB.settings.industryGroups || {})[c.industry];
  return g && (DB.settings.wideIndustries || []).includes(g) ? g : '';
}
// c[field], except the derived 'wideIndustry' pseudo-field.
const fieldValue = (c, field) => field === 'wideIndustry' ? wideIndustryOf(c) : c[field];
// Clients inside a chosen wider industry (or UNCLASSIFIED = none) — lets the
// specific-industry dropdown only offer industries within the chosen cluster.
const clientsInWide = w => !w ? DB.clients : DB.clients.filter(c => w === UNCLASSIFIED ? !wideIndustryOf(c) : wideIndustryOf(c) === w);

/* ════════════════ CLIENTS VIEW ════════════════ */
function renderClients() {
  const view = document.getElementById('view-clients');
  const q = state.clientSearch.toLowerCase();
  let list = [...DB.clients].sort((a, b) => a.companyName.localeCompare(b.companyName));
  const activeCount = DB.clients.filter(c => c.status !== 'churned').length;
  const mrr = DB.clients.filter(c => c.status !== 'churned').reduce((s, c) => s + (Number(c.feeGBP) || 0), 0);

  if (state.clientFilter === 'active')  list = list.filter(c => c.status !== 'churned');
  if (state.clientFilter === 'churned') list = list.filter(c => c.status === 'churned');
  if (q) list = list.filter(c => (c.companyName + ' ' + (c.qbName||'') + ' ' + (c.email||'')).toLowerCase().includes(q));

  const applyDimFilter = (field, value) => { if (value) list = list.filter(c => value === UNCLASSIFIED ? !fieldValue(c, field) : fieldValue(c, field) === value); };
  applyDimFilter('wideIndustry', state.clientWideFilter);
  applyDimFilter('industry', state.clientIndustryFilter);
  applyDimFilter('country', state.clientCountryFilter);
  applyDimFilter('companySize', state.clientSizeFilter);

  const dimSelect = (id, label, list, current, field, within = DB.clients) => `<select id="${id}">
      <option value="">All ${esc(label)}</option>
      ${optionsInUse(field, list, current, within).map(v => `<option value="${esc(v)}" ${current===v?'selected':''}>${esc(v)}</option>`).join('')}
      ${hasUnclassified(field, within) || current===UNCLASSIFIED ? `<option value="${UNCLASSIFIED}" ${current===UNCLASSIFIED?'selected':''}>Unclassified</option>` : ''}
    </select>`;

  view.innerHTML = `
    <div class="toolbar">
      <input type="text" id="cl-search" placeholder="Search clients…" value="${esc(state.clientSearch)}" style="width:220px">
      <div class="pills">
        ${[['all','All'],['active','Active'],['churned','Churned']]
          .map(([k,l]) => `<button class="pill ${state.clientFilter===k?'active':''}" data-f="${k}">${l}</button>`).join('')}
      </div>
      ${dimSelect('cl-wide-filter', 'wider industries', DB.settings.wideIndustries, state.clientWideFilter, 'wideIndustry')}
      ${dimSelect('cl-industry-filter', 'industries', DB.settings.industries, state.clientIndustryFilter, 'industry', clientsInWide(state.clientWideFilter))}
      ${dimSelect('cl-country-filter', 'countries', DB.settings.countries, state.clientCountryFilter, 'country')}
      ${dimSelect('cl-size-filter', 'sizes', DB.settings.companySizes, state.clientSizeFilter, 'companySize')}
      <div class="spacer"></div>
      <button class="btn btn-primary" id="cl-add">＋ Add client</button>
    </div>

    <div class="stats">
      <div class="stat ok"><div class="v">${activeCount}</div><div class="l">Active clients</div></div>
      <div class="stat"><div class="v">${fmtMoney(mrr)}</div><div class="l">Monthly recurring (£)</div></div>
      <div class="stat"><div class="v">${DB.clients.length - activeCount}</div><div class="l">Churned (all time)</div></div>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Company</th><th>Status</th><th>AM</th><th>Package</th>
          <th class="num">Fee £</th><th>Start</th><th class="num">Months</th>
          <th>Lead gen</th><th>Converted by</th><th></th>
        </tr></thead>
        <tbody>
          ${list.length ? list.map(c => {
            const mo = clientMaxMonthNo(c.id);
            return `<tr class="clickable" data-cid="${c.id}">
              <td><strong>${esc(c.companyName)}</strong>${c.autoIssue ? ' <span class="badge purple">Auto</span>' : ''}
                  <div class="sub">${esc(c.qbName || '')}</div></td>
              <td>${c.status === 'churned'
                    ? `<span class="badge red">Churned${c.churnMonth ? ' ' + monthLabelShort(c.churnMonth) : ''}</span>`
                    : '<span class="badge green">Active</span>'}</td>
              <td class="dim">${esc(c.accountManager || '')}</td>
              <td class="dim small">${esc(c.package || '')}</td>
              <td class="num money">${fmtMoney(c.feeGBP)}</td>
              <td class="dim">${monthLabelShort(c.startMonth)}</td>
              <td class="num">${mo || '—'}${c.tenureAdjust ? '<span title="Includes a manual tenure adjustment" style="color:var(--accent)">*</span>' : ''}</td>
              <td class="dim">${esc(c.leadGenBy || '—')}</td>
              <td class="dim">${esc(c.convertedBy || '—')}</td>
              <td class="muted">›</td>
            </tr>`;
          }).join('') : `<tr><td colspan="10"><div class="empty">${DB.clients.length ? 'No clients match these filters.' : 'No clients yet — add one, or import your sheet data.'}</div></td></tr>`}
        </tbody>
      </table>
    </div>`;

  const si = view.querySelector('#cl-search');
  si.oninput = () => { state.clientSearch = si.value; renderClients(); view.querySelector('#cl-search').focus(); const el = view.querySelector('#cl-search'); el.setSelectionRange(el.value.length, el.value.length); };
  view.querySelectorAll('.pill').forEach(p => p.onclick = () => { state.clientFilter = p.dataset.f; renderClients(); });
  view.querySelector('#cl-wide-filter').onchange = e => {
    state.clientWideFilter = e.target.value;
    const inWide = clientsInWide(state.clientWideFilter);
    if (state.clientIndustryFilter && state.clientIndustryFilter !== UNCLASSIFIED && !inWide.some(c => c.industry === state.clientIndustryFilter)) state.clientIndustryFilter = '';
    renderClients();
  };
  view.querySelector('#cl-industry-filter').onchange = e => { state.clientIndustryFilter = e.target.value; renderClients(); };
  view.querySelector('#cl-country-filter').onchange = e => { state.clientCountryFilter = e.target.value; renderClients(); };
  view.querySelector('#cl-size-filter').onchange = e => { state.clientSizeFilter = e.target.value; renderClients(); };
  view.querySelector('#cl-add').onclick = () => clientForm(null);
  view.querySelectorAll('tr[data-cid]').forEach(r => r.onclick = () => clientDetail(r.dataset.cid));
}

/* ── Client stats overview ── */
function clientDetail(cid) {
  const c = clientById(cid);

      <div class="stat"><div class="v">${fmtMoney(clientLifetimeValue(cid))}</div><div class="l">Lifetime value</div><div class="s"${c.ltvAdjust ? ' style="color:var(--accent)"' : ''}>${c.ltvAdjust ? `includes ${c.ltvAdjust > 0 ? '+' : '−'}${fmtMoney(Math.abs(c.ltvAdjust))} manual` : 'from invoices'}</div></div>
      <div class="stat"><div class="v">${fmtMoney(c.feeGBP)}</div><div class="l">Current fee</div></div>

      <div class="stat"><div class="v">${withDates.length ? Math.round(onTime.length / withDates.length * 100) + '%' : '—'}</div><div class="l">Paid on time</div></div>

      <div class="dfld"><div class="dl">Package</div><div class="dv">${esc(c.package || '—')}</div></div>
      <div class="dfld"><div class="dl">Contract terms</div><div class="dv">${esc(c.contractTerms || '—')}</div></div>
      <div class="dfld"><div class="dl">Agreed trial months</div><div class="dv">${esc(String(c.agreedTrialMonths ?? '—'))}</div></div>
      <div class="dfld"><div class="dl">Start month</div><div class="dv">${monthLabel(c.startMonth)}</div></div>
      ${c.status === 'churned' ? `<div class="dfld"><div class="dl">Churned</div><div class="dv">${monthLabel(c.churnMonth)}</div></div>` : ''}
      <div class="dfld"><div class="dl">Issue day / due</div><div class="dv">Day ${esc(String(c.issueDay || 1))}, +${esc(String(c.dueDays || 7))} days</div></div>
      <div class="dfld"><div class="dl">Lead generated by (${cfg.leadGenPct}%)</div><div class="dv">${esc(c.leadGenBy || '—')}</div></div>
      <div class="dfld"><div class="dl">Converted by (${cfg.converterPct}%)</div><div class="dv">${esc(c.convertedBy || '—')}</div></div>
      <div class="dfld"><div class="dl">Mail merge</div><div class="dv">${c.mailMerge ? 'Yes' : 'No'}</div></div>
      ${(c.skipMonths && c.skipMonths.length) ? `<div class="dfld"><div class="dl">Skipped months</div><div class="dv">${c.skipMonths.map(monthLabelShort).join(', ')}</div></div>` : ''}
    </div>
    ${c.notes ? `<div class="dfld" style="margin-bottom:16px"><div class="dl">Notes</div><div class="dv" style="white-space:pre-wrap">${esc(c.notes)}</div></div>` : ''}

    <h2 class="section" style="margin-top:8px">Invoice history</h2>
    <div class="tbl-wrap" style="max-height:300px; overflow-y:auto">

        <thead><tr><th>Month</th><th class="num">Mo#</th><th>Issue</th><th>Due</th><th class="num">Amount</th><th>Status</th><th>Paid on</th></tr></thead>

            <td class="dim">${i.paid ? fmtDate(i.paidDate) : '—'}</td>
