<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Control — Unstuck Agency</title>
<script>
// The dashboard apps (Credit Control, Commission, Operational Settings, Insights,
// AM Performance) all share this one page; the script at the bottom decides which tabs
// and header each one shows. Keep the page hidden until that has run, so the full
// tab bar (Invoices / Clients / Insights / …) never flashes up first. Keep this list in
// step with CC_ROUTE_CONFIG below. The timeout is a fail-safe in case the script errors.
(function () {
  if (['/credit-control', '/commission', '/operational-settings', '/insights', '/am-performance'].indexOf(location.pathname) === -1) return;
  document.documentElement.classList.add('cc-pending');
  setTimeout(function () { document.documentElement.classList.remove('cc-pending'); }, 4000);
})();
</script>
<style>html.cc-pending body { visibility: hidden; }</style>
<style>
  :root {
    --bg:           #0b0b18;
    --bg-panel:     #10101e;
    --bg-card:      #14142a;
    --bg-card-hdr:  #0f0f1e;
    --bg-input:     #0d0d20;
    --border:       #1e1e38;
    --border-hi:    #2a2a48;
    --text:         #e0e0f0;
    --text-dim:     #8080a8;
    --text-muted:   #50507a;
    --accent-from:  #7c3aed;
    --accent-to:    #6366f1;
    --accent:       #a78bfa;
    --success:      #22c55e;
    --danger:       #ef4444;
    --warn:         #f59e0b;
    --neutral:      #71717a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse at 20% 60%, #1a0f2e 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, #0f1030 0%, transparent 55%);
    min-height: 100vh;
    color: var(--text);
  }

  /* ── Header ── */
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 0 20px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-from) 0%, var(--accent-to) 100%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: #fff;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
  .save-ind { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted); }
  .save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .save-ind.saving .save-dot { background: var(--warn); }
  .save-ind.saved  .save-dot { background: var(--success); }
  .save-ind.error  .save-dot { background: var(--danger); }
  .save-ind.error  { color: var(--danger); }

  /* ── Tab bar ── */
  .tab-bar {
    display: flex; align-items: center; gap: 4px;
    padding: 0 20px; height: 48px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 56px; z-index: 49;
  }
  .tab {
    padding: 6px 20px; border-radius: 20px; border: none; background: transparent;
    font-size: 13px; font-weight: 500; color: var(--text-dim); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-from) 0%, var(--accent-to) 100%);
    color: #fff; font-weight: 600;
  }
  .tab:hover:not(.active) { background: var(--bg-card); color: var(--text); }

  /* ── Layout ── */
  .content { padding: 20px; max-width: 1500px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  /* ── Toolbar ── */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar .spacer { flex: 1; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav button {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-hi);
    background: var(--bg-card); color: var(--text-dim); cursor: pointer; font-size: 14px;
  }
  .month-nav button:hover { color: var(--text); border-color: var(--accent-from); }

  select, input, textarea {
    padding: 8px 10px; border: 1px solid var(--border-hi); border-radius: 8px;
    font-size: 13px; color: var(--text); background: var(--bg-input);
    outline: none; transition: border-color .15s; font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent-from); }
  select option { background: #1a1a30; }
  /* Invoices tab: the AM column is a quiet dropdown that looks like text until hovered */
  .inv-am { padding: 3px 4px; border: 1px solid transparent; background: transparent; color: inherit; font-size: inherit; border-radius: 6px; cursor: pointer; max-width: 150px; text-overflow: ellipsis; }
  .inv-am:hover, .inv-am:focus { border-color: var(--border-hi); background: var(--bg-input); }
  input[type="checkbox"] { accent-color: var(--accent-from); width: 16px; height: 16px; cursor: pointer; }
  .no-spin::-webkit-outer-spin-button, .no-spin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .no-spin { -moz-appearance: textfield; }

  .btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-hi);
    background: var(--bg-card); color: var(--text-dim); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: border-color .15s, color .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent-from); color: var(--accent); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-from) 0%, var(--accent-to) 100%);
    border: none; color: #fff; font-weight: 600;
  }
  .btn-primary:hover { opacity: .85; color: #fff; }
  .btn-danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .pill {
    padding: 5px 14px; border-radius: 16px; border: none; background: transparent;
    font-size: 12px; font-weight: 500; color: var(--text-dim); cursor: pointer;
  }
  .pill.active { background: var(--bg-card); color: var(--accent); box-shadow: inset 0 0 0 1px var(--border-hi); }
  .pill:hover:not(.active) { color: var(--text); }

  /* Revenue page: two visually separate timeframe groups — look back (Past data)
     and look ahead (Projections). One pick from each applies at the same time. */
  .tf-groups { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .tf-group { display: flex; flex-direction: column; gap: 5px; padding: 6px 10px 7px; border-radius: 12px; border: 1px solid var(--border-hi); background: var(--bg); }
  .tf-group .tf-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); padding-left: 4px; }
  .tf-group.proj { border-style: dashed; border-color: var(--accent); }
  .tf-group.proj .tf-label { color: var(--accent); }
  .tf-custom { display: flex; align-items: center; gap: 4px; padding-left: 4px; font-size: 11px; color: var(--text-dim); }
  .tf-custom .date-field { border-color: var(--border-hi); font-size: 12px; font-weight: 600; color: var(--text); }
  .tf-link {
    align-self: center; display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 5px 10px; border-radius: 12px; border: 1px solid var(--border-hi); background: transparent;
    color: var(--text-dim); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  }
  .tf-link .ic { font-size: 15px; line-height: 1; letter-spacing: 0; }
  .tf-link:hover { color: var(--text); }
  .tf-link.on { color: var(--accent); border-color: var(--accent); background: rgba(167,139,250,.14); }
  .cmp-up { color: var(--success); font-weight: 700; }
  .cmp-down { color: var(--danger); font-weight: 700; }
  /* Past vs. projections — two side-by-side comparison cards inside the Revenue targets section */
  .cmp-wrap { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .cmp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .cmp-head h4 { font-size: 13px; font-weight: 700; }
  .cmp-head .sub { font-size: 11px; color: var(--text-dim); }
  .cmp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .cmp-card { border: 1px solid var(--border-hi); border-radius: 12px; padding: 16px 18px; background: var(--bg); display: flex; flex-direction: column; gap: 12px; }
  .cmp-title { font-size: 14px; font-weight: 700; }
  .cmp-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
  .cmp-row { display: grid; grid-template-columns: 104px 1fr; gap: 4px 12px; align-items: center; }
  .cmp-lab { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .cmp-row.proj .cmp-lab { color: var(--accent); }
  .cmp-lab span { display: block; font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 10px; color: var(--text-dim); margin-top: 1px; }
  .cmp-bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.05); overflow: hidden; }
  .cmp-bar i { display: block; height: 100%; border-radius: 6px; }
  .cmp-val { grid-column: 2; font-size: 22px; font-weight: 800; letter-spacing: -.4px; line-height: 1.1; }
  .cmp-val small { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--text-dim); margin-top: 2px; }
  .cmp-badge { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; font-size: 15px; font-weight: 800; }
  .cmp-badge span { font-size: 11px; font-weight: 500; color: var(--text-dim); }
  .cmp-badge.up { background: rgba(34,197,94,.12); color: var(--success); }
  .cmp-badge.down { background: rgba(239,68,68,.12); color: var(--danger); }
  .cmp-badge.none { background: rgba(255,255,255,.04); color: var(--text-dim); font-size: 12px; font-weight: 500; }
  /* Compare builder — a base selection on the left, comparisons to its right */
  .cmpx-cols { display: flex; gap: 12px; align-items: stretch; overflow-x: auto; padding-bottom: 4px; }
  .cmpx-col { flex: 1 1 210px; min-width: 200px; max-width: 320px; border: 1px solid var(--border-hi); border-top: 3px solid var(--c); border-radius: 12px; background: var(--bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .cmpx-col.base { box-shadow: inset 0 0 0 1px var(--c); }
  .cmpx-tag { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
  .cmpx-x { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .cmpx-x:hover { color: var(--danger); }
  .cmpx-col select { width: 100%; }
  .cmpx-range { font-size: 11px; color: var(--text-dim); min-height: 15px; line-height: 1.35; }
  .cmpx-custom { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); }
  .cmpx-custom .date-field { border-color: var(--border-hi); font-size: 12px; font-weight: 600; color: var(--text); }
  .cmpx-pick { font-size: 11px; padding: 7px 9px; border-radius: 8px; border: 1px dashed var(--c); color: var(--c); line-height: 1.35; }
  .cmpx-pick.on { background: rgba(255,255,255,.05); animation: cmpxPulse 1.4s ease-in-out infinite; }
  @keyframes cmpxPulse { 50% { opacity: .6; } }
  .cmpx-link { background: none; border: none; padding: 0; margin-left: 6px; font: inherit; font-size: 11px; color: var(--c); cursor: pointer; text-decoration: underline; }
  .cmpx-stat .l { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .cmpx-stat .v { font-size: 22px; font-weight: 800; letter-spacing: -.4px; line-height: 1.15; }
  .cmpx-stat .v.sm { font-size: 18px; }
  .cmpx-stat .s { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .cmpx-note { font-size: 11px; color: var(--text-dim); margin-top: auto; padding-top: 4px; }
  .cmpx-add { flex: 0 0 auto; min-width: 96px; border: 1px dashed var(--border-hi); background: transparent; color: var(--text-dim); border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .cmpx-add .plus { font-size: 26px; line-height: 1; }
  .cmpx-add:hover { color: var(--accent); border-color: var(--accent); }
  .cmp-picking { cursor: crosshair; }

  /* ── Stat cards ── */
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 18px; min-width: 128px; flex: 0 1 auto;
  }
  .stat .v { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
  .target-edit-btn {
    background: none; border: none; padding: 0; font: inherit; font-size: 19px; font-weight: 700;
    letter-spacing: -.3px; color: inherit; cursor: pointer; border-bottom: 1px dashed var(--border-hi);
  }
  .target-edit-btn:hover { color: var(--accent); border-color: var(--accent); }
  .stat .l { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
  .stat .s { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .stat.ok .v { color: var(--success); }
  .stat-sub-btn {
    display: block; background: none; border: none; padding: 0; margin-top: 2px; font: inherit;
    font-size: 11px; color: var(--text-dim); cursor: pointer; text-align: left;
    border-bottom: 1px dashed var(--border-hi); width: fit-content;
  }
  .stat-sub-btn:hover { color: var(--accent); border-color: var(--accent); }
  /* Hovering a progress-bar segment fades every other stat card so the one
     the segment corresponds to (matched by data-stat/data-highlight) stands
     out — a lightweight, mouse-only way to tie the bars back to the numbers
     above them without redrawing either. */
  .stats .stat { transition: opacity .15s; }
  .stats.dim-others .stat { opacity: .35; }
  .stats.dim-others .stat.stat-highlighted { opacity: 1; }
  .clickable-stat { cursor: pointer; transition: border-color .15s, box-shadow .15s, opacity .15s; }
  .clickable-stat:hover { border-color: var(--accent); }
  .clickable-stat.filter-active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .progress-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .progress-bar-row { display: flex; align-items: center; gap: 12px; }
  .progress-bar-label {
    width: 56px; flex-shrink: 0; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-muted); text-align: right;
  }
  .progress-bar { display: flex; flex: 1; height: 34px; border-radius: 8px; overflow: visible; background: var(--bg-input); position: relative; }
  /* Goal marker on the revenue "This period" bars — a solid line at the target,
     so it stays visible when the goal has been exceeded (no hashed gap then). */
  .progress-goal { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); z-index: 2; }
  /* Year-to-date bar: the whole financial year on the scale, with a second (full-year) target */
  .progress-gap.fy { border-left-color: rgba(245, 158, 11, .55); background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(245, 158, 11, .30) 5px 6px); }
  .progress-gap.fy span { color: var(--warn); }
  .progress-goal.fy { background: var(--warn); }
  /* Year-to-date bar split into months: each section is that month's target (cumulative), labelled underneath */
  .progress-bar-wrap { flex: 1; min-width: 0; }
  .progress-bar-wrap > .progress-bar { width: 100%; }
  .progress-split { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .42); z-index: 1; pointer-events: none; }
  .progress-months { position: relative; height: 13px; margin-top: 3px; }
  .progress-months .pm { position: absolute; top: 0; transform: translateX(-50%); font-size: 9px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; color: var(--text-muted); cursor: default; }
  .progress-months .pm.done { color: var(--text-dim); }
  .progress-months .pm.cur { color: var(--text); font-weight: 800; }
  /* Revenue "This period" bars: more air between bars, the current month set a
     little apart, and a left-to-right wipe when the page is opened. */
  .progress-bars.spaced { gap: 20px; }
  .progress-bars.spaced .progress-bar-row.current { padding-bottom: 18px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  @keyframes barWipe { from { clip-path: inset(0 100% 0 0 round 8px); } to { clip-path: inset(0 0 0 0 round 8px); } }
  .progress-bars.reveal .progress-bar { animation: barWipe .9s cubic-bezier(.22, 1, .36, 1) backwards; animation-delay: calc(var(--i, 0) * 120ms + 100ms); }
  @media (prefers-reduced-motion: reduce) { .progress-bars.reveal .progress-bar { animation: none; } }
  .pb-custom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); margin: 6px 0 14px 132px; }
  .pb-custom .date-field { border-color: var(--border-hi); font-size: 12px; font-weight: 600; color: var(--text); }
  .progress-seg {
    height: 100%; transition: filter .15s; cursor: pointer;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .progress-seg:hover { filter: brightness(1.2); }
  .progress-seg span {
    font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; padding: 0 10px;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  /* The "gap to target" region on every bar — deliberately not a real data
     segment (no solid fill, not clickable), so it reads as a projection
     rather than another status. Red-tinted (a shortfall is bad news) but
     dialled well back from the solid Overdue segment's full-strength red,
     so the two don't read as the same severity at a glance. */
  .progress-gap {
    height: 100%; flex-shrink: 0; border-left: 2px dashed rgba(239, 68, 68, .45);
    background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(239, 68, 68, .22) 5px 6px);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .progress-gap span { font-size: 11px; font-weight: 700; color: var(--text-dim); white-space: nowrap; padding: 0 10px; }
  .stat.bad .v { color: var(--danger); }
  .stat.warn .v { color: var(--warn); }

  /* ── Tables ── */
  .tbl-wrap {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    overflow-x: auto;
  }
  /* Invoices table: no boxed/scrolling container — the table just sits in the
     page's normal flow. A checkbox toggle re-renders the table (innerHTML
     replace), which reset scrollLeft to 0 on a scrolling div every time —
     dropping the user back to the left edge mid-click. The page's own scroll
     position isn't touched by that same re-render, so this sidesteps it. */
  .tbl-flow { background: none; border: none; border-radius: 0; overflow-x: visible; }
  .email-trunc {
    display: inline-block; max-width: 160px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; vertical-align: bottom; cursor: pointer; border-bottom: 1px dashed var(--border-hi);
  }
  .email-trunc:hover { color: var(--accent); border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    padding: 10px 12px; text-align: left; font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted);
    background: var(--bg-card-hdr); border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .1s; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: rgba(124,58,237,.06); }
  /* Invoice row overdue states — two independent lateness signals:
     issue-overdue (not yet issued, past its issue date) gets the lighter
     shade; due-overdue (issued but unpaid, past its due date) gets the
     darker one since a missed payment is the more urgent problem. A row
     that's somehow both gets a grey hash pattern over the darker red so
     it reads as a distinct "double" state rather than picking one. */
  tr.row-issue-overdue { background: rgba(239,68,68,.05); }
  tr.row-issue-overdue:hover { background: rgba(239,68,68,.09); }
  tr.row-due-overdue { background: rgba(239,68,68,.16); }
  tr.row-due-overdue:hover { background: rgba(239,68,68,.22); }
  tr.row-both-overdue {
    background-color: rgba(239,68,68,.16);
    background-image: repeating-linear-gradient(135deg, rgba(160,160,180,.25) 0px, rgba(160,160,180,.25) 6px, transparent 6px, transparent 12px);
  }
  tr.row-both-overdue:hover { background-color: rgba(239,68,68,.22); }
  /* Permanent marker once an invoice is finally issued after sitting
     issue-overdue — stays bold even later once paid/faded, as a lasting
     record that this one went out late. */
  tr.issued-late td { font-weight: 700; }
  tr.row-uncertain td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
  .unc-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; margin-left: 6px; border-radius: 50%;
    font-size: 11px; font-weight: 800; line-height: 1; vertical-align: middle; cursor: help;
    background: rgba(245,158,11,.14); color: var(--warn); border: 1px dashed rgba(245,158,11,.65);
  }
  td.num, th.num { text-align: right; }
  .dim { color: var(--text-dim); font-size: 12px; }
  .muted { color: var(--text-muted); }
  .small { font-size: 11px; }
  .money { font-weight: 600; font-variant-numeric: tabular-nums; }
  .sub { font-size: 11px; color: var(--text-muted); }

  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 10px;
    font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
  }
  .badge.green { background: rgba(34,197,94,.12);  color: var(--success); }
  .badge.red   { background: rgba(239,68,68,.12);  color: var(--danger); }
  .badge.amber { background: rgba(245,158,11,.12); color: var(--warn); }
  .badge.grey  { background: rgba(128,128,168,.12); color: var(--text-dim); }
  .badge.purple{ background: rgba(124,58,237,.15); color: var(--accent); }

  .empty {
    padding: 48px 20px; text-align: center; color: var(--text-muted); font-size: 13px;
  }

  h2.section { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); margin: 24px 0 10px; }
  .note { font-size: 11px; color: var(--text-muted); margin-top: 8px; }

  /* ── Modal ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(5,5,15,.72); backdrop-filter: blur(3px);
    z-index: 100; display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .overlay.visible { display: flex; }
  .modal {
    background: var(--bg-panel); border: 1px solid var(--border-hi); border-radius: 16px;
    width: 100%; max-width: 600px; padding: 22px;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }
  .modal.wide { max-width: 900px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; }
  .modal-head h3 { font-size: 16px; font-weight: 700; }
  .modal-x {
    width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent;
    color: var(--text-muted); font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .modal-x:hover { background: var(--bg-card); color: var(--text); }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fgrid .full { grid-column: 1 / -1; }
  .fld label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .fld input:not([type="checkbox"]), .fld select, .fld textarea { width: 100%; }
  .fld textarea { min-height: 64px; resize: vertical; }
  .fld .chk { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .modal-foot { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; align-items: center; }
  .modal-foot .left { margin-right: auto; }

  /* ── Client detail ── */
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px 18px; margin-bottom: 16px; }
  .dfld .dl { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-muted); }
  .dfld .dv { font-size: 13px; margin-top: 2px; }

  /* ── Commission cards ── */
  .comm-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; align-items: start; }
  .comm-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .comm-card:has(details[open]) { grid-column: 1 / -1; }
  .comm-card .name { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .comm-nums { display: flex; gap: 24px; margin-bottom: 10px; }
  .comm-nums .v { font-size: 20px; font-weight: 700; }
  .comm-nums .l { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }
  .bar { height: 8px; border-radius: 4px; background: var(--bg-input); overflow: hidden; margin-bottom: 10px; display: flex; }
  .bar-seg { height: 100%; cursor: pointer; transition: opacity .1s; }
  .bar-seg:hover { opacity: .8; }
  .bar-seg + .bar-seg { border-left: 2px solid var(--bg-card); }
  details.brk summary { cursor: pointer; font-size: 12px; color: var(--text-dim); user-select: none; }
  details.brk summary:hover { color: var(--accent); }
  details.brk .brk-wrap { margin-top: 8px; overflow-x: auto; }
  details.brk table { font-size: 12px; width: 100%; }
  details.brk td, details.brk th { padding: 6px 8px; white-space: nowrap; }

  /* ── Settings chips ── */
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .card h3 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .card .desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 8px 5px 12px; border-radius: 16px;
    background: var(--bg-input); border: 1px solid var(--border-hi); font-size: 12px;
  }
  .chip button { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; line-height: 1; }
  .chip button:hover { color: var(--danger); }
  .chip-add { display: flex; gap: 8px; }
  .chip-add input { width: 220px; }

  .banner {
    background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); color: #fca5a5;
    padding: 10px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .banner.visible { display: block; }

  /* ── Retention chart & range ── */
  .range-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 16px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;
  }
  .month-field {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; min-width: 160px; text-align: left; font-family: inherit;
    padding: 8px 10px; border: 1px solid var(--border-hi); border-radius: 8px;
    background: var(--bg-card-hdr); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .month-field:hover, .month-field.open { border-color: var(--accent-from); background: var(--bg-input); }
  .month-field.open { box-shadow: 0 0 0 3px rgba(124,58,237,.15); }
  .month-field::after { content: '▾'; color: var(--accent); font-size: 11px; }
  .range-results { margin-left: auto; display: flex; gap: 22px; flex-wrap: wrap; }
  .range-result { text-align: right; }
  .range-result .v { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .range-result .l { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
  .range-result .s { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .chart-head h3 { font-size: 13px; font-weight: 700; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-wrap .chart-pt { cursor: pointer; }
  .chart-legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 11px; color: var(--text-dim); }
  .chart-legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .swatch { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
  .chart-legend .swatch.dashed { border-top-style: dashed; }
  .chart-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: var(--bg-panel); border: 1px solid var(--border-hi);
    border-radius: 8px; padding: 6px 10px; font-size: 11px; color: var(--text); box-shadow: 0 8px 20px rgba(0,0,0,.4);
    transform: translate(-50%, -120%); white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 5;
  }
  .chart-tooltip.visible { opacity: 1; }
  .chart-tooltip .tv { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ── Insights: section signposting + spacing (scoped to this tab only, so
     other tabs reusing .chart-card/.tbl-wrap/.stats keep their own spacing) ── */
  #view-insights > .chart-card, #view-insights > .tbl-wrap, #view-insights > .card, #view-insights > .stats { margin-bottom: 24px; }
  #view-insights .ins-section-head { margin: 30px 0 14px; }
  #view-insights .ins-section-head h2 { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: .01em; }
  #view-insights .ins-section-head .sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; max-width: 640px; }
  /* Overview tiles — each a clickable entry point into a detail page */
  #view-insights .ov-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
  #view-insights .ov-tile { cursor: pointer; transition: border-color .15s, transform .15s; }
  #view-insights .ov-tile:hover { border-color: var(--accent-from); transform: translateY(-2px); }
  /* Each tile's own title (Retention, Lifetime value, Revenue, Client
     performance indicator) — bigger than the generic .chart-head h3 so it
     reads as the tile's headline, not just another card label. Scoped to a
     direct-child .chart-head of an Overview-stack card so sub-headings
     inside a tile (which set their own inline font-size) are unaffected. */
  #view-insights .ov-grid > .chart-card > .chart-head > h3,
  #view-insights .ov-grid > div > .chart-card > .chart-head > h3 { font-size: 20px; font-weight: 800; letter-spacing: -.2px; }
  /* Overview tile stat captions — bigger than the generic .stat .l/.s so
     "what is this number" reads clearly without squinting, the way a
     headline stat on a dashboard should. */
  #view-insights .ov-grid .stat .l { font-size: 13px; letter-spacing: .02em; }
  #view-insights .ov-grid .stat .s { font-size: 13px; }
  /* Overview⇄Detail page transition — a simple fade+slide, consistent with
     the rest of this app's plain CSS/JS (no animation library anywhere). */
  #view-insights .ins-page.ins-enter-fwd { opacity: 0; transform: translateX(16px); }
  #view-insights .ins-page.ins-enter-back { opacity: 0; transform: translateX(-16px); }
  #view-insights .ins-page.ins-enter-active { opacity: 1; transform: translateX(0); transition: opacity .2s ease-out, transform .2s ease-out; }
  .ins-bars { display: flex; flex-direction: column; gap: 8px; }
  .ins-bar-row { display: flex; align-items: center; gap: 12px; }
  .ins-bar-label { width: 170px; flex-shrink: 0; font-size: 12px; color: var(--text-dim); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ins-bar-track { flex: 1; height: 20px; background: var(--bg-input); border-radius: 6px; overflow: hidden; }
  .ins-bar-fill { height: 100%; border-radius: 6px; min-width: 3px; }
  .ins-bar-value { width: 92px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .ins-bar-value.clickable-stat { cursor: pointer; border-bottom: 1px dashed var(--border-hi); }
  .ins-bar-value.clickable-stat:hover { color: var(--accent); border-color: var(--accent); }
  .ins-compare-group { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ins-compare-group:last-child { border-bottom: none; }
  .ins-compare-name { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .ins-compare-group .ins-bar-row + .ins-bar-row { margin-top: 4px; }

  /* ── Custom month picker (replaces native input[type=month] chrome) ── */
  .month-popover {
    position: absolute; z-index: 60; background: var(--bg-panel); border: 1px solid var(--border-hi);
    border-radius: 12px; padding: 12px; box-shadow: 0 20px 48px rgba(0,0,0,.55); width: 236px;
  }
  .month-pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .month-pop-head .yr { font-size: 13px; font-weight: 700; color: var(--text); }
  .month-pop-head button {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-hi);
    background: var(--bg-card); color: var(--text-dim); cursor: pointer; font-size: 13px;
  }
  .month-pop-head button:hover:not(:disabled) { color: var(--text); border-color: var(--accent-from); }
  .month-pop-head button:disabled { opacity: .3; cursor: not-allowed; }
  .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .month-cell {
    padding: 8px 0; border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; font-family: inherit;
  }
  .month-cell:hover:not(:disabled) { background: var(--bg-card); color: var(--text); border-color: var(--border-hi); }
  .month-cell.selected { background: linear-gradient(135deg, var(--accent-from) 0%, var(--accent-to) 100%); color: #fff; }
  .month-cell:disabled { opacity: .3; cursor: not-allowed; }

  /* ── Custom day picker (replaces native input[type=date] chrome — it can't
     be restyled and, in Chrome, only opens from a tiny icon rather than the
     whole field) ── */
  .date-field {
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
    padding: 3px 7px; border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: inherit; font: inherit; cursor: pointer; text-align: left;
  }
  .date-field:hover, .date-field.open { border-color: var(--border-hi); background: var(--bg-input); color: var(--text); }
  .date-field.open { box-shadow: 0 0 0 3px rgba(124,58,237,.15); }
  .date-field.empty { color: var(--text-muted); }
  .date-popover {
    position: absolute; z-index: 110; background: var(--bg-panel); border: 1px solid var(--border-hi);
    border-radius: 12px; padding: 12px; box-shadow: 0 20px 48px rgba(0,0,0,.55); width: 264px;
  }
  .date-pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .date-pop-head .ym { font-size: 13px; font-weight: 700; color: var(--text); }
  .date-pop-head button {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-hi);
    background: var(--bg-card); color: var(--text-dim); cursor: pointer; font-size: 13px;
  }
  .date-pop-head button:hover { color: var(--text); border-color: var(--accent-from); }
  .date-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
  .date-weekdays span { text-align: center; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
  .date-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .date-cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; border: 1px solid transparent; background: transparent;
    color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .date-cell:hover:not(:disabled) { background: var(--bg-card); border-color: var(--border-hi); }
  .date-cell.other-month { color: var(--text-muted); opacity: .5; }
  .date-cell.today { border-color: var(--accent-from); }
  .date-cell.selected { background: linear-gradient(135deg, var(--accent-from) 0%, var(--accent-to) 100%); color: #fff; }
  .date-cell:disabled { opacity: .25; cursor: not-allowed; }
  .date-pop-foot { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .date-pop-foot button { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; padding: 0; }
  .date-pop-foot button:hover { text-decoration: underline; }

  /* ── Invoices: copyable cells & done rows ── */
  .copyable { cursor: pointer; border-bottom: 1px dashed transparent; }
  .copyable:hover { border-bottom-color: var(--accent); color: var(--accent); }
  .copyable.copied { color: var(--success) !important; border-bottom-color: var(--success) !important; }
  .copyable.copied::after { content: ' ✓'; font-weight: 700; }
  tr.done { background: rgba(10,10,20,.4); }
  tr.done td { color: var(--text-muted); }

  /* ── Invoices: calendar view ── */
  .cal-grid-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow-x: auto; }
  .cal-week-row { display: grid; grid-template-columns: 46px repeat(7, minmax(92px, 1fr)); gap: 6px; align-items: start; margin-bottom: 6px; }
  .cal-week-row:last-child { margin-bottom: 0; }
  .cal-week-head { align-items: center; margin-bottom: 10px; }
  .cal-headcell { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-muted); text-align: center; }
  .cal-weeklabel {
    border: 1px solid var(--border-hi); background: var(--bg-input); border-radius: 8px;
    color: var(--text-muted); font-size: 10px; font-weight: 700; cursor: pointer;
    padding: 4px 2px; align-self: start; font-family: inherit;
  }
  .cal-weeklabel:hover { border-color: var(--accent-from); color: var(--accent); }
  .cal-day {
    border: 1px solid var(--border); background: var(--bg-card-hdr); border-radius: 8px;
    padding: 6px 8px; min-height: 30px; cursor: pointer; text-align: left; font-family: inherit;
    align-self: start; width: 100%; transition: border-color .15s, background .15s;
  }
  .cal-day:hover { border-color: var(--accent-from); background: var(--bg-input); }
  .cal-day.has-events { min-height: 68px; background: var(--bg-input); }
  .cal-day.other-month { opacity: .32; }
  .cal-day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cal-daynum { font-size: 12px; font-weight: 700; color: var(--text); }
  .cal-marks { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .cal-mark {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .cal-mark.issue { background: var(--accent-from); }
  .cal-mark.due { background: var(--warn); color: #1a1200; }
  .cal-mark.due.overdue { background: var(--danger); color: #fff; }
  .cal-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .cal-dot.issue { background: var(--accent-from); }
  .cal-dot.due { background: var(--warn); }
  .cal-dot.due.overdue { background: var(--danger); }

  .cal-week-wrap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-weekcol { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .cal-weekcol.today { border-color: var(--accent); }
  .cal-weekcol-head {
    border: none; background: var(--bg-card-hdr); border-bottom: 1px solid var(--border);
    padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--text-dim); font-family: inherit; width: 100%;
  }
  .cal-weekcol-head:hover { color: var(--accent); background: var(--bg-input); }
  .cal-weekcol-head .wd { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
  .cal-weekcol-head .dn { font-size: 16px; font-weight: 700; color: var(--text); }
  .cal-weekcol-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 90px; max-height: 380px; overflow-y: auto; }
  .cal-empty { font-size: 11px; color: var(--text-muted); text-align: center; padding: 10px 0; }
  .cal-chip {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    border: 1px solid var(--border-hi); background: var(--bg-input); border-radius: 7px;
    padding: 5px 7px; cursor: pointer; font-family: inherit;
  }
  .cal-chip:hover { border-color: var(--accent-from); }
  .cal-chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cal-chip-dot.issue { background: var(--accent-from); }
  .cal-chip-dot.due { background: var(--warn); }
  .cal-chip-dot.due.overdue { background: var(--danger); }
  .cal-chip-name { font-size: 11px; font-weight: 600; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-chip-amt { font-size: 10px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  /* Click a revenue bar for the full breakdown */
  .progress-bar[data-bar] { cursor: pointer; }
  #bar-tip .bt-hint { font-size: 10px; color: var(--accent); margin-top: 5px; letter-spacing: .02em; }
  .modal .progress-bar { height: 46px; }
  .bd-key { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; }
  .bd-key.hash-red { background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(239,68,68,.5) 4px 5px); box-shadow: inset 0 0 0 1px rgba(239,68,68,.6); }
  .bd-key.hash-orange { background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(245,158,11,.55) 4px 5px); box-shadow: inset 0 0 0 1px rgba(245,158,11,.65); }
  .bd-key.line { width: 3px; height: 16px; border-radius: 0; }
  .bd-sub { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 18px 0 8px; }
  /* Progress bars: a hovered section pops out slightly (like the AM pies) and a tooltip says what it is and its value */
  .progress-bar > .progress-seg, .progress-bar > .progress-gap { transition: transform .16s ease, box-shadow .16s ease, filter .15s; }
  .progress-bar > .progress-seg:hover, .progress-bar > .progress-gap:hover { transform: scale(1.03, 1.3); z-index: 3; box-shadow: 0 6px 16px rgba(0, 0, 0, .5); }
  .progress-bar > .seg-first { border-radius: 8px 0 0 8px; }
  .progress-bar > .seg-last { border-radius: 0 8px 8px 0; }
  .progress-bar > .seg-first.seg-last { border-radius: 8px; }

<script>
'use strict';

/* ════════════════ State ════════════════ */
let DB = null;
const state = {
  tab: 'invoices',
  invMonth: null,       // 'YYYY-MM'
  invFilter: 'all',
  invSort: 'due',        // 'due' | 'issued' | 'joined'
  invDateBasis: 'due', // 'issued' | 'due' — which month an invoice is counted under
  invView: 'table',      // 'table' | 'calendar'
  calScale: 'month',     // 'day' | 'week' | 'month'
  calDate: null,         // 'YYYY-MM-DD' anchor date for the calendar view
  clientSearch: '',
  clientFilter: 'all',
  clientWideFilter: '',
  clientIndustryFilter: '',
  clientCountryFilter: '',
  clientSizeFilter: '',
  commMonth: null,
  commPeriod: 'year',   // Commission earned over a period: 'month' | 'lastmonth' | 'year' | 'fy' | 'all' | 'custom'
  commFrom: null,       // custom period start 'YYYY-MM-DD'
  commTo: null,         // custom period end 'YYYY-MM-DD'
  retScale: '12',       // churn chart window: '6' | '12' | '24' | 'all'
  retRangeStart: null,  // custom churn range 'YYYY-MM'
  retRangeEnd: null,
  retMetrics: ['churn'], // churn chart series shown, any combination of: 'churn' | 'new' | 'left'
  insPage: 'overview',   // 'overview' | 'retention' | 'ltv' | 'revenue' — unified dashboard router
  insNavDir: 'fwd',      // 'fwd' | 'back' — which way the page-transition animation runs
  insFilterWide: '',
  insFilterIndustry: '', // dashboard-wide narrowing filter — '' | a value | UNCLASSIFIED
  insFilterCountry: '',
  insFilterSize: '',
  insTrendScale: '12',  // '6' | '12' | '24' | 'all'  (Revenue page also: 'ytd' | 'custom')
  insTrendFrom: null,   // Revenue page, Past data "Custom": first month 'YYYY-MM'
  insTrendTo: null,     // Revenue page, Past data "Custom": last month 'YYYY-MM'
  insProjScale: 'off',  // Revenue page only: how far ahead the target line runs — 'off' | a month count ('3', '6', '12'…)
  insProjMirror: false, // Revenue page only: when on, Past data and Projections always cover the same span
  insCmp: null,         // Revenue page compare builder: { base, others[] } selections (see insCmpMonths)
  insCmpPick: null,     // id of the compare slot waiting for a month to be clicked on the chart
  insBarCustom: null,   // Revenue "This period" custom bar: { from, to } months, or null for none
  insBarsAnim: false,   // set when the Insights tab/page is opened so its bars wipe in left to right
  amTab: 'ams',         // AM Performance sub-tab: 'ams' | 'team'
  amSel: null,          // AM Performance: the account manager whose page is open
  amIndustry: null,     // AM Performance: the industry whose client list is open (within amSel)
  amSearch: '',         // AM Performance: account-manager list search text
  amClientStatus: 'all', // AM Performance: status filter on an account manager's client list: 'all' | 'active' | 'churned'
  amClientsScale: 'month', // AM Performance team charts: 'month' | '3' | '6' | '12' | 'ytd' | 'all'
  amRevScale: 'month',
  amLtvScale: 'all', amTenureScale: 'all', // lifetime value / tenure charts: which clients (those on the books in the period; 'all' = every client)
  amChartClients: 'bar', amChartRev: 'bar', amChartLtv: 'bar', amChartTenure: 'bar', // each Team chart: 'bar' | 'pie'
  amBasis: 'combination', // 'all' | 'realised' | 'running' | 'combination' (see AM_BASIS)
  amFilterWide: '', amFilterIndustry: '', amFilterCountry: '', amFilterSize: '', // Team tab client filters ('' = all, UNCLASSIFIED = none set)
  insBasis: 'combination',  // 'realised' | 'running' | 'combination' — see basisSplit(); Combination is always the default
  insDim: 'general',    // 'general' | 'industry' | 'companySize' | 'country' — LTV detail's "compare by" picker
  insPredBasis: 'combination', // 'realised' | 'running' | 'combination' — see basisSplit(); Combination is always the default
  insPredWide: [],
  insPredIndustries: [],
  insPredSizes: [],
  insPredCountries: [],
  insBarLayout: 'separate', // 'separate' | 'stacked'
  insBarSort: 'ltv',        // 'ltv' | 'tenure' | 'list' — only used in 'stacked' layout
  insRevMonthlyChart: 'line', // 'bar' | 'line' — Target vs Landed, monthly
};

/* ════════════════ Persistence ════════════════ */
// Every touch() call is a discrete, deliberate action (a Save button, a
// checkbox toggle) — never a keystroke — so there's no batching upside to
// debouncing, only risk: a debounce timer that keeps getting reset by the
// next edit can defer the actual write indefinitely, and a reload or closed
// tab before it finally fires silently drops everything since the last write.
// Saving immediately closes that window. saveChain serialises saves so a
// burst of touch() calls still lands as in-order writes, not a race.
//
// A single failed attempt is never treated as final — data.json lives in a
// OneDrive-synced folder, so a save can transiently fail if OneDrive has the
// file locked mid-sync, same as the server itself being momentarily
// unreachable (mid-restart, a dropped connection, etc.). Rather than surface
// "Save failed" and leave it to the user to notice and manually retry
// (easy to miss while heads-down doing data entry), attemptSave() keeps
// retrying every few seconds in the background until it lands, for as long
// as there's still unsaved data (`dirty`) — so a transient blip self-heals
// without ever silently dropping an edit.
let dirty = false, saveChain = Promise.resolve(), retryTimer = null;
const RETRY_MS = 4000;

function indicator(mode, txt) {
  const el = document.getElementById('save-ind');
  el.className = 'save-ind ' + mode;
  document.getElementById('save-txt').textContent = txt;
}
function touch() {
  dirty = true;
  indicator('saving', 'Saving…');
  clearTimeout(retryTimer);
  saveChain = saveChain.then(attemptSave, attemptSave);
}
async function attemptSave() {
  let ok = false;
  try {
    const r = await fetch(window.CC_CONFIG ? window.CC_CONFIG.saveUrl : '/save', { method: 'POST', body: JSON.stringify(DB, null, 2) });
    ok = r.ok;
  } catch (e) { ok = false; }
  if (ok) {
    dirty = false;
    indicator('saved', 'Saved');
  } else {
    indicator('error', 'Save failed — retrying…');
    retryTimer = setTimeout(() => { saveChain = saveChain.then(attemptSave, attemptSave); }, RETRY_MS);
  }
}
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

async function load() {
  try {
    const r = await fetch(window.CC_CONFIG ? window.CC_CONFIG.dataUrl : '/data');
    if (!r.ok) throw new Error();
    DB = await r.json();
  } catch (e) {
    DB = null;
    document.getElementById('banner').textContent =
      'Could not load data — check your connection and that you\'re signed in, then reload.';
    document.getElementById('banner').classList.add('visible');
    indicator('error', 'Offline');
    return;
  }
  const { invoiceMonthsChanged } = normalise();
  // Re-checked on every load so a client who's simply gone quiet gets
  // caught even if nobody happens to notice and tick Leaving for them.
  const autoChurned = applyAutoChurnDetection();
  const migrated = migrateLtvOverrides();
  if (invoiceMonthsChanged || autoChurned.length || migrated) touch(); else indicator('saved', 'Saved');
  renderAll();
  revealCharts(document.querySelector('.view.active'));
}
function normalise() {
  DB.settings ||= {};
  DB.settings.salesTeam ||= [];
  DB.settings.accountManagers ||= [];
  DB.settings.packages ||= [];
  DB.settings.industries ||= [];
  DB.settings.countries ||= [];
  DB.settings.companySizes ||= ['1-10', '11-50', '51-200', '201-1000', '1001+'];
  DB.settings.commission ||= { leadGenPct: 2, converterPct: 8, invoiceCount: 3 };
  DB.settings.retention ||= { shortTermGoalPct: 15, longTermGoalPct: 10 };
  // Revenue targets — one independent target per specific calendar month
  // ('YYYY-MM' -> £), not a repeating Jan-Dec template. Only months someone
  // has actually set a target for exist here; everything else reads as "no
  // target set" rather than 0.
  DB.settings.revenueTargets ||= {};
  DB.clients ||= [];
  DB.invoices ||= [];
  // Wider industries: broader clusters that the specific industry tags roll up
  // into. Seeded ONCE, with a first-pass grouping, when a dataset has never had
  // them (kept in memory and persisted with the next ordinary save — nothing is
  // written just for seeding). After that the Operational Settings screen owns
  // them, and an empty list is respected rather than re-seeded.
  if (!Array.isArray(DB.settings.wideIndustries)) {
    DB.settings.wideIndustries = [...DEFAULT_WIDE_INDUSTRIES];
    DB.settings.industryGroups = {};
    const known = new Set([...DB.settings.industries, ...DB.clients.map(c => c.industry).filter(Boolean)]);
    for (const [ind, wide] of Object.entries(DEFAULT_INDUSTRY_GROUPS)) if (known.has(ind)) DB.settings.industryGroups[ind] = wide;
  }
  DB.settings.industryGroups ||= {};
  // Sales team members who take no commission (they can still be attributed as
  // lead gen / converter, and still count in Insights' sales attribution).
  // Seeded once, in memory: Leo (CEO) is attributed on clients but earns none.
  // After that Operational Settings owns the list, and an empty list is respected.
  if (!Array.isArray(DB.settings.commissionExcluded)) {
    DB.settings.commissionExcluded = [];
    const involved = new Set([...DB.settings.salesTeam, ...DB.clients.flatMap(c => [c.leadGenBy, c.convertedBy])]);
    if (involved.has('Leo')) DB.settings.commissionExcluded.push('Leo');
  }
  // An invoice's `month` is keyed off its due date, not its issue date (see
  // buildNextInvoiceFor()) — re-synced here on every load so it's always
  // self-consistent, including retroactively for invoices created before
  // this was the rule. Returns whether anything actually changed, so the
  // caller knows whether this needs saving.
  let invoiceMonthsChanged = false;
  for (const inv of DB.invoices) {
    if (inv.dueDate && inv.month !== inv.dueDate.slice(0, 7)) {
      inv.month = inv.dueDate.slice(0, 7);
      invoiceMonthsChanged = true;
    }
  }
  // The "frontier" the monthly Generate-next-month wizard advances from —
  // seeded once from whatever's already in the data, so existing history
  // isn't treated as "nothing generated yet" the first time this runs.
  DB.settings.invoicingGeneratedThrough ||= invoiceMonths().slice(-1)[0] || currentMonthKey();
  return { invoiceMonthsChanged };
}

/* ════════════════ Helpers ════════════════ */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WD3 = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function fmtMoney(n, sym) {
  if (n == null || n === '' || isNaN(n)) return '—';
  return (sym || '£') + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return iso;
  return `${d} ${MON3[m-1]} ${String(y).slice(2)}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function currentMonthKey() { return todayISO().slice(0, 7); }
function monthLabel(key) {
  if (!key) return '—';
  const [y, m] = key.split('-').map(Number);
  return `${MONTHS[m-1]} ${y}`;
}
function monthLabelShort(key) {
  if (!key) return '—';
  const [y, m] = key.split('-').map(Number);
  return `${MON3[m-1]} ${String(y).slice(2)}`;
}
function addMonths(key, n) {
  let [y, m] = key.split('-').map(Number);
  m += n;
  y += Math.floor((m - 1) / 12);
  m = ((m - 1) % 12 + 12) % 12 + 1;
  return `${y}-${String(m).padStart(2,'0')}`;
}
// Whole calendar months between two 'YYYY-MM' keys (b - a).
function monthDiff(a, b) {
  const [ay, am] = a.split('-').map(Number);
  const [by, bm] = b.split('-').map(Number);
  return (by - ay) * 12 + (bm - am);
}
function daysInMonth(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function addDaysISO(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function daysBetween(a, b) { // b - a in days
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
// Adds N calendar months to a full ISO date, clamping the day to the target
// month's length (e.g. 31 Jan + 1 month -> 28/29 Feb).
function addMonthsToDate(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  let ny = y, nm = m + n;
  ny += Math.floor((nm - 1) / 12);
  nm = ((nm - 1) % 12 + 12) % 12 + 1;
  const maxDay = daysInMonth(`${ny}-${String(nm).padStart(2, '0')}`);
  return `${ny}-${String(nm).padStart(2, '0')}-${String(Math.min(d, maxDay)).padStart(2, '0')}`;
}
function lastInvoiceForClient(id) {
  const invs = DB.invoices.filter(i => i.clientId === id);
  if (!invs.length) return null;
  return invs.reduce((best, i) => (Number(i.monthNumber) || 0) > (Number(best.monthNumber) || 0) ? i : best);
}
// Anchors a fresh issue/due date at the given calendar month using the
// client's own issue-day/due-days template — used both to bootstrap a
// brand-new client's very first auto-generated invoice, and (in the monthly
// generation wizard) to resync a client's date after a gap — a skipped
// month, or a churned client being brought back — where simply chaining off
// their last real invoice would land in the past instead of the target month.
function bootstrapInvoiceDate(client, anchorMonth) {
  const day = Math.min(Number(client.issueDay) || 1, daysInMonth(anchorMonth));
  const issueDate = `${anchorMonth}-${String(day).padStart(2, '0')}`;
  const dueDate = addDaysISO(issueDate, Number(client.dueDays) || 7);
  return { issueDate, dueDate };
}
// The recurring invoice schedule, chained forward from whichever invoice has
// the highest monthNumber so far (ignoring any gap at #1):
//  - No invoices yet: bootstraps invoice #2 straight away from the client's
//    issue-day/due-days template (anchored the month after their start
//    month), so invoices start populating immediately without waiting on
//    invoice #1 — which never has a formula and is entered manually
//    whenever the user gets to it, with its own real one-off dates that
//    don't retroactively affect #2 (it's already been generated by then).
//  - Invoice 2 (chained off an actual invoice 1): issued 1 month + 2 weeks
//    after invoice 1's due date; due the client's normal due-days after that.
//  - Invoice 3+: issued 1 month after the previous invoice's own issue date;
//    due 1 month after the previous invoice's own due date — which preserves
//    whatever issue-to-due gap the previous invoice used, even if manually customised.
function chainInvoiceSchedule(clientId) {
  const c = clientById(clientId);
  const last = lastInvoiceForClient(clientId);
  if (!last) {
    if (!c) return { monthNumber: 1, issueDate: null, dueDate: null };
    const anchorMonth = addMonthsToDate(`${c.startMonth || currentMonthKey()}-01`, 1).slice(0, 7);
    return { monthNumber: 2, ...bootstrapInvoiceDate(c, anchorMonth) };
  }
  const nextNo = (Number(last.monthNumber) || 0) + 1;
  if (nextNo === 2) {
    const issueDate = last.dueDate ? addDaysISO(addMonthsToDate(last.dueDate, 1), 14) : null;
    const dueDate = issueDate ? addDaysISO(issueDate, Number(c?.dueDays) || 7) : null;
    return { monthNumber: 2, issueDate, dueDate };
  }
  return {
    monthNumber: nextNo,
    issueDate: last.issueDate ? addMonthsToDate(last.issueDate, 1) : null,
    dueDate: last.dueDate ? addMonthsToDate(last.dueDate, 1) : null,
  };
}
// Used by the "Add invoice" form's prefill: always surfaces invoice #1 if
// it's still missing, however many later invoices have already auto-generated
// (invoice #1 has no formula — the user fills in its real dates separately,
// whenever they get to it). Once #1 exists, defers to the normal chain.
function nextInvoiceSchedule(clientId) {
  const hasFirst = DB.invoices.some(i => i.clientId === clientId && Number(i.monthNumber) === 1);
  if (!hasFirst) return { monthNumber: 1, issueDate: null, dueDate: null };
  return chainInvoiceSchedule(clientId);
}
// Builds one client's next invoice for `targetMonth` — null if they already
// have an invoice for that month (a hand-added future invoice, e.g. a new
// client onboarded ahead of time, is never overwritten or duplicated).
// Normally just wraps chainInvoiceSchedule(), but if that chain would land
// before targetMonth (a gap from a skipped month, or a churned client being
// brought back after a long absence) the date is resynced fresh via
// bootstrapInvoiceDate() instead — monthNumber still always continues from
// lastInvoiceForClient(), never reset by the gap.
function buildNextInvoiceFor(client, targetMonth) {
  if (DB.invoices.some(i => i.clientId === client.id && i.month === targetMonth)) return null;
  let sched = chainInvoiceSchedule(client.id);
  if (!sched.dueDate || sched.dueDate.slice(0, 7) < targetMonth) {
    sched = { monthNumber: sched.monthNumber, ...bootstrapInvoiceDate(client, targetMonth) };
  }
  return {
    // The invoice's `month` — the one field used everywhere (churn, MRR,
    // package mix, commissions, the Invoices tab itself) — is keyed off the
    // DUE date, not the issue date. Issue/due scheduling itself is unchanged.
    id: uid(), clientId: client.id, month: sched.dueDate.slice(0, 7),
    monthNumber: sched.monthNumber,
    issueDate: sched.issueDate, dueDate: sched.dueDate,
    amountGBP: client.feeGBP || 0,
    amountUSD: client.feeUSD ?? null,
    amountEUR: client.feeEUR ?? null,
    package: client.package || '', packageOverride: false,
    issued: false, paid: false, paidDate: null, notes: '',
    generatedByWizard: true,
    accountManager: (client.accountManager || '').trim()   // who owns this invoice from the start
  };
}
// Applies the Generate-next-month wizard's decisions for every client on its
// roster: leaving clients are churned (no invoice); skipped clients get
// `targetMonth` added to skipMonths (no invoice, but retentionRows() already
// treats a skipped month as present-not-lost via that same field) and simply
// reappear in next month's roster for a fresh decision — nothing "sticky"
// beyond the one month ticked; everyone else gets their next invoice via
// buildNextInvoiceFor(). Advances the wizard's frontier on completion.
function generateInvoicesForMonth(targetMonth, rosterClientIds, { leaving, skip }) {
  const created = [];
  for (const cid of rosterClientIds) {
    const c = clientById(cid);
    if (!c) continue;
    if (leaving.has(cid)) {
      c.status = 'churned';
      c.churnMonth = targetMonth;
      continue;
    }
    if (skip.has(cid)) {
      c.skipMonths ||= [];
      if (!c.skipMonths.includes(targetMonth)) c.skipMonths.push(targetMonth);
      continue;
    }
    const inv = buildNextInvoiceFor(c, targetMonth);
    if (inv) { DB.invoices.push(inv); created.push(inv); }
  }
  DB.settings.invoicingGeneratedThrough = targetMonth;
  touch();
  return created;
}
// Undoes the most recent "Generate next month" run for targetMonth: deletes
// every invoice the wizard itself created for that month (generatedByWizard)
// while leaving any invoice manually added for that month completely alone,
// reverts clients marked Leaving/Skip for that month back to how they were,
// and rolls the frontier back one month so the wizard can be re-run. Only
// ever valid on the current frontier month — clearing an earlier month would
// leave a hole in the middle of already-generated history, which nothing
// downstream (chaining, retention) is designed to handle.
//
// A month generated by the *old* silent auto-generation (before this flag
// existed — true for every month already in the data when this feature
// shipped) has no generatedByWizard-tagged invoices at all. There's no way
// to tell a genuinely hand-added invoice apart from an auto-generated one
// in that case (the old system never recorded the difference either), so
// the whole month is cleared instead. Client status/skipMonths are left
// alone for a legacy month — any churn recorded against it could be a real
// manual decision rather than something this wizard did, and unlike the
// invoice list there's no safe default for undoing that blindly.
function clearMonth(targetMonth) {

  const monthInvoices = DB.invoices.filter(i => i.month === targetMonth);
  const isLegacyMonth = monthInvoices.length > 0 && !monthInvoices.some(i => i.generatedByWizard);
  if (isLegacyMonth) {
    DB.invoices = DB.invoices.filter(i => i.month !== targetMonth);
    DB.settings.invoicingGeneratedThrough = addMonths(targetMonth, -1);
    touch();
    return;
  }
  DB.invoices = DB.invoices.filter(i => !(i.month === targetMonth && i.generatedByWizard));
  for (const c of DB.clients) {
    if (c.status === 'churned' && c.churnMonth === targetMonth) {
      c.status = 'active';
      c.churnMonth = null;
    }
    if (c.skipMonths?.includes(targetMonth)) {
      c.skipMonths = c.skipMonths.filter(m => m !== targetMonth);
    }
  }
  DB.settings.invoicingGeneratedThrough = addMonths(targetMonth, -1);
  touch();
}
// When a client's package changes, carry it forward onto every one of their
// not-yet-issued invoices — except any invoice whose package was deliberately
// set differently from the client's own (packageOverride), which stays locked.
function applyPackageToFutureInvoices(clientId, newPackage) {
  let changed = false;
  for (const inv of DB.invoices) {
    if (inv.clientId !== clientId || inv.issued || inv.packageOverride) continue;
    if (inv.package !== newPackage) { inv.package = newPackage; changed = true; }
  }
  return changed;
}
// ── Account-manager ownership of invoices ──
// Each invoice records the account manager responsible for it (`accountManager`), so when a
// client is handed from one AM to another, the invoices from before the handover stay with the
// previous AM and only later ones go to the new one. An invoice with no AM stamped yet (all the
// older ones) simply follows its client's current AM until something stamps it. A new invoice is
// stamped with the client's AM when it is generated.
const invoiceAM = inv => ((inv.accountManager || '').trim() || (clientById(inv.clientId)?.accountManager || '').trim());

// so changing the client's AM can never rewrite history).
function stampUnassignedInvoices(clientId, am) {
  for (const inv of DB.invoices) if (inv.clientId === clientId && !(inv.accountManager || '').trim()) inv.accountManager = am;
}
// Shown after a client's account manager is changed: history stays with the previous AM and

function openHandoverModal(client, fromAM, toAM) {

    <div class="modal-head"><h3>Account manager change — ${esc(client.companyName)}</h3><button class="modal-x" data-close>×</button></div>

    <div class="fld" style="margin-top:12px"><label>${esc(toAM)} takes over from invoice month</label><input type="month" id="ho-month" value="${nextGen}"></div>

// Changing the account manager straight from a row in the Invoices tab. Always asks whether

function startOfWeekMon(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = (dt.getDay() + 6) % 7; // 0 = Monday .. 6 = Sunday
  dt.setDate(dt.getDate() - dow);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}
function weekdayOf(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).getDay(); // 0 = Sunday
}

async function copyToClipboard(text, el) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
  }
  if (el) {
    el.classList.add('copied');
    clearTimeout(el._copyTimer);
    el._copyTimer = setTimeout(() => el.classList.remove('copied'), 900);
  }
}

const clientById = id => DB.clients.find(c => c.id === id);
const invForClient = id => DB.invoices.filter(i => i.clientId === id)
  .sort((a, b) => (a.month || '').localeCompare(b.month || ''));

function invoiceMonths() {
  return [...new Set(DB.invoices.map(i => i.month).filter(Boolean))].sort();
}
// A client's tenure in months. The old Google-sheet history wasn't kept with these statistics in
// mind, so a client can carry a manual `tenureAdjust` (months, may be negative) that is ADDED to
// the figure worked out from its invoices — so new invoices keep adding on top of a corrected
// history. clientCalcMonthNo is always the invoice-based figure.
function clientCalcMonthNo(id) {
  const nums = DB.invoices.filter(i => i.clientId === id).map(i => Number(i.monthNumber) || 0);
  return nums.length ? Math.max(...nums) : 0;
}
function clientMaxMonthNo(id) {
  const c = clientById(id), base = clientCalcMonthNo(id);
  return c && c.tenureAdjust ? Math.max(0, base + c.tenureAdjust) : base;
}
function isOverdue(inv) {
  return !inv.paid && inv.dueDate && inv.dueDate < todayISO();
}
function isIssueOverdue(inv) {
  return !inv.issued && inv.issueDate && inv.issueDate < todayISO();
}

// `addKey` is the DB.settings list this select is backed by (e.g.
// 'accountManagers') — when given, appends a "+ Add new…" option so the
// select can grow the managed list inline (see the delegated listeners below).
function selectOptions(list, selected, allowBlank, addKey) {
  let h = allowBlank ? `<option value="" ${!selected ? 'selected' : ''}>—</option>` : '';
  const all = [...list];
  if (selected && !all.includes(selected)) all.push(selected);
  for (const v of all) h += `<option value="${esc(v)}" ${v === selected ? 'selected' : ''}>${esc(v)}</option>`;
  if (addKey) h += `<option value="${ADD_NEW_OPTION}">+ Add new…</option>`;
  return h;
}
// Sets a <select>'s value, adding the value as an option first if it isn't already
// present (e.g. a client's stored package differs in case/spelling from the
// canonical Settings list) — otherwise the browser silently ignores the assignment.
function setSelectValue(selectEl, value) {
  if (value && ![...selectEl.options].some(o => o.value === value)) {
    const opt = document.createElement('option');
    opt.value = value; opt.textContent = value;
    selectEl.appendChild(opt);
  }
  selectEl.value = value || '';
}
// "+ Add new…" support for every managed-list <select> (account managers,
// packages, industries, countries, company sizes, sales team) — lets the
// user grow that Settings list inline, from wherever the dropdown is used,
// instead of having to go to Settings first. Delegated on `document` since
// these selects live inside dynamically-rendered modal content. Uses a plain
// prompt() rather than the app's own modal so it doesn't clobber whatever
// form is already open underneath (the modal system only supports one at a time).
const ADD_NEW_OPTION = 'ADD_NEW_OPTION_SENTINEL';
const ADD_LIST_LABELS = {
  accountManagers: 'account manager', packages: 'package', industries: 'industry',
  countries: 'country', companySizes: 'company size', salesTeam: 'sales team member',
};
document.addEventListener('focusin', e => {
  if (e.target.tagName === 'SELECT' && e.target.dataset.addList) e.target.dataset.prevValue = e.target.value;
});
document.addEventListener('change', e => {
  const sel = e.target;
  if (sel.tagName !== 'SELECT' || !sel.dataset.addList) return;
  if (sel.value !== ADD_NEW_OPTION) { sel.dataset.prevValue = sel.value; return; }
  const key = sel.dataset.addList;
  const name = (prompt(`Add a new ${ADD_LIST_LABELS[key] || 'option'}:`) || '').trim();
  if (!name) { sel.value = sel.dataset.prevValue || ''; return; }
  if (!DB.settings[key].includes(name)) {
    DB.settings[key].push(name);
    if (key === 'industries') promptWideIndustry(name);
    touch();
  }

  sel.dataset.prevValue = name;
  sel.dispatchEvent(new Event('input', { bubbles: true }));
});
// A brand-new industry has no wider industry yet — ask once, right then, so it
// doesn't silently land in "Not grouped". Blank leaves it for Operational Settings.
function promptWideIndustry(industry) {
  const wides = DB.settings.wideIndustries || [];
  if (!wides.length) return;
  const ans = (prompt(`Which wider industry does "${industry}" belong to?\n\n${wides.join('\n')}\n\nType one of the above, or leave blank to group it later in Operational Settings.`) || '').trim();
  const hit = wides.find(w => w.toLowerCase() === ans.toLowerCase());
  if (hit) DB.settings.industryGroups[industry] = hit;
}

/* ════════════════ Custom month picker (dark-themed, replaces native input[type=month]) ════════════════ */
let monthPopEl = null;
function closeMonthPicker() {
  if (monthPopEl) {

  document.removeEventListener('keydown', onMonthPickerKey, true);

function onMonthPickerOutside(e) {

}

function openMonthPicker(anchorEl, { value, min, max, onSelect }) {
  closeMonthPicker();
  anchorEl.classList.add('open');
  let [vy] = (value || currentMonthKey()).split('-').map(Number);
  const minKey = min || '0000-01', maxKey = max || '9999-12';

  monthPopEl = document.createElement('div');

  monthPopEl.style.left = (window.scrollX + rect.left) + 'px';

  const render = () => {
    let grid = '';

      const key = `${vy}-${String(m).padStart(2, '0')}`;
      const disabled = key < minKey || key > maxKey;
      const selected = key === value;
      grid += `<button type="button" class="month-cell ${selected ? 'selected' : ''}" data-m="${m}" ${disabled ? 'disabled' : ''}>${MON3[m - 1]}</button>`;
    }
    monthPopEl.innerHTML = `
      <div class="month-pop-head">
        <button type="button" data-nav="-1">‹</button>
        <span class="yr">${vy}</span>
        <button type="button" data-nav="1">›</button>
      </div>
      <div class="month-grid">${grid}</div>`;
    monthPopEl.querySelector('[data-nav="-1"]').onclick = () => { vy--; render(); };
    monthPopEl.querySelector('[data-nav="1"]').onclick = () => { vy++; render(); };
    monthPopEl.querySelectorAll('.month-cell:not(:disabled)').forEach(btn => btn.onclick = () => {
