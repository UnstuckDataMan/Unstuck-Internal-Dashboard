/* ── Revenue "This period" bars ── */
let insBarsReveal = false;   // true for the render that follows opening the page/tab — plays the left-to-right wipe
// The current month first (set slightly apart), then every past-data window in
// time order, shortest to longest — each its own bar of Landed / Expected / Goal.
// Windows that cover exactly the same months as an earlier bar are merged into it
// (labelled with both names) rather than repeated. `custom` adds an optional bar
// with its own From–To range, independent of the graph's timeframes.
function insPeriodBarsHtml(rows, { custom = false } = {}) {
  const cur = currentMonthKey();
  const upTo = rows.filter(r => r.m <= cur);
  const latest = currentSnapshotRow(rows);
  const same = (a, b) => a.length === b.length && a.every((m, i) => m === b[i]);
  // noGoal: the All time bar carries no goal (line or gap) — targets only cover a
  // few months, so a goal against the whole history says nothing useful.
  const statsFor = (months, noGoal = false) => { const s = sumRevenueOverMonths(rows, months); return { ...revBarStats(s.landed, s.expected, noGoal ? null : s.goal), months }; };

  const monthBar = { ...revBarStats(landedForMonth(cur), latest ? (latest.expected ?? latest.mrr) : 0, targetForMonth(cur)), months: [cur] };
  const cats = [
    ['Last 3 months', trailingMonths(rows, 3)],
    ['Last 6 months', trailingMonths(rows, 6)],
    ['Last 12 months', trailingMonths(rows, 12)],
    ['All time', upTo.map(r => r.m)],
  ];
  const bars = [];
  cats.forEach(([label, months]) => {
    if (!months.length || same(months, [cur])) return;
    const dup = bars.find(b => same(b.months, months));
    if (dup) dup.label += ` / ${label.toLowerCase()}`;
    else bars.push({ label, months, noGoal: label === 'All time' });
  });
  // Year to date is its own bar and never merges with another: it stands for the whole financial
  // year (1 Aug – 31 Jul) — landed + expected so far, the cumulative target for the months gone
  // (first line, red hashed gap) and the cumulative target for the full year (second line, orange
  // hashed gap) — so the bar can be seen growing towards the yearly goal.
  const fyStart = fiscalYearStart(cur);
  const fyMonthList = Array.from({ length: 12 }, (_, k) => addMonths(fyStart, k));
  const fyGoal = fyMonthList.reduce((g, m) => { const t = targetForMonth(m); return t == null ? g : (g || 0) + t; }, null);
  const ytdMonths = upTo.filter(r => r.m >= fyStart).map(r => r.m);
  if (ytdMonths.length) bars.push({ label: 'Year to date', months: ytdMonths, fy: true });
  bars.sort((a, b) => a.months.length - b.months.length);

  const cb = custom ? state.insBarCustom : null;
  const customMonths = cb ? upTo.filter(r => r.m >= (cb.from <= cb.to ? cb.from : cb.to) && r.m <= (cb.from <= cb.to ? cb.to : cb.from)).map(r => r.m) : [];

  let i = 0;
  const html = `<div class="progress-bars spaced ${insBarsReveal ? 'reveal' : ''}">
      ${revBarRowHtml(monthLabel(cur), monthBar, '', i++, 'current')}
      ${bars.map(b => revBarRowHtml(b.label.charAt(0).toUpperCase() + b.label.slice(1), b.fy ? (() => { const x = sumRevenueOverMonths(rows, b.months); return { ...revBarStats(x.landed, x.expected, x.goal, fyGoal), sections: fySections(fyMonthList), months: b.months, fyMonths: fyMonthList }; })() : statsFor(b.months, b.noGoal), b.fy ? monthRangeLabel(fyMonthList) : monthRangeLabel(b.months), i++)).join('')}
      ${cb && customMonths.length ? revBarRowHtml('Custom', statsFor(customMonths), monthRangeLabel(customMonths), i++) : ''}
    </div>
    ${custom ? `<div class="pb-custom">${cb
      ? `Custom bar: from <button type="button" class="date-field" id="pb-cust-from">${esc(monthLabelShort(cb.from))}</button> to <button type="button" class="date-field" id="pb-cust-to">${esc(monthLabelShort(cb.to))}</button> <button type="button" class="cmpx-x" id="pb-cust-rm" title="Remove the custom bar">×</button>`
      : `<button type="button" class="btn btn-sm" id="pb-cust-add">＋ Custom bar</button>`}</div>` : ''}`;
  return html;
}
function insWirePeriodBars(root) {
  const cur = currentMonthKey();
  const add = root.querySelector('#pb-cust-add');
  if (add) add.onclick = () => { state.insBarCustom = { from: addMonths(cur, -5), to: cur }; renderInsights(); };
  const rm = root.querySelector('#pb-cust-rm');
  if (rm) rm.onclick = () => { state.insBarCustom = null; renderInsights(); };
  const f = root.querySelector('#pb-cust-from'), t = root.querySelector('#pb-cust-to');
  if (f) f.onclick = () => openMonthPicker(f, { value: state.insBarCustom.from, max: cur,
    onSelect: key => { state.insBarCustom.from = key; if (state.insBarCustom.to < key) state.insBarCustom.to = key; renderInsights(); } });
  if (t) t.onclick = () => openMonthPicker(t, { value: state.insBarCustom.to, max: cur,
    onSelect: key => { state.insBarCustom.to = key; if (state.insBarCustom.from > key) state.insBarCustom.from = key; renderInsights(); } });
}

/* ── Revenue page: Past data / Projections timeframes (these drive the graph only) ── */
function insRevTimeframesHtml() {
  const projSpan = insProjectionSpan();
  return `<div class="tf-groups" style="margin-bottom:14px">
      <div class="tf-group" title="How much history the graph plots — Year-to-date runs 1 Aug to the current month">
        <div class="tf-label">Past data</div>
        <div class="pills" id="ins-trend-pills">
          ${[['1', '1M'], ['3', '3M'], ['6', '6M'], ['12', '12M'], ['ytd', 'YTD'], ['all', 'All'], ['custom', 'Custom']].map(([k, l]) => `<button class="pill ${state.insTrendScale === k ? 'active' : ''}" data-scale="${k}">${l}</button>`).join('')}
        </div>
        ${state.insTrendScale === 'custom' ? `<div class="tf-custom">From <button type="button" class="date-field" id="ins-cust-from" title="First month of the range">${esc(monthLabelShort(state.insTrendFrom || currentMonthKey()))}</button> to <button type="button" class="date-field" id="ins-cust-to" title="Last month of the range (up to the current month)">${esc(monthLabelShort(state.insTrendTo || currentMonthKey()))}</button></div>` : ''}
      </div>
      <button type="button" class="tf-link ${state.insProjMirror ? 'on' : ''}" id="ins-mirror" title="${state.insProjMirror ? 'Mirror is on — changing either side sets the other to the same span. Click to unlink.' : 'Link the two sides so that changing one sets the other to the same span'}">
        <span class="ic">⇄</span>Mirror
      </button>
      <div class="tf-group proj" title="How far ahead the target line runs, after the current month — up to the last month a target is set for">
        <div class="tf-label">Projections${projSpan && ![3, 6, 12].includes(projSpan) ? ` · next ${projSpan} month${projSpan === 1 ? '' : 's'}` : ''}</div>
        <div class="pills" id="ins-proj-pills">
          ${[['off', 'Off'], ['3', '3M'], ['6', '6M'], ['12', '12M']].map(([k, l]) => `<button class="pill ${(k === 'off' ? projSpan === 0 : projSpan === Number(k)) ? 'active' : ''}" data-proj="${k}">${l}</button>`).join('')}
        </div>
      </div>
    </div>`;
}
function insWireRevTimeframes(root) {
  root.querySelectorAll('#ins-trend-pills [data-scale]').forEach(p => p.onclick = () => {
    // First time on Custom: start from whatever range is showing now.
    if (p.dataset.scale === 'custom' && !(state.insTrendFrom && state.insTrendTo)) {
      const w = insTrendWindow(insRevenueMonthList().map(m => ({ m })));
      state.insTrendFrom = w.length ? w[0].m : currentMonthKey();
      state.insTrendTo = w.length ? w[w.length - 1].m : currentMonthKey();
    }
    state.insTrendScale = p.dataset.scale; renderInsights();
  });
  const custFromBtn = root.querySelector('#ins-cust-from'), custToBtn = root.querySelector('#ins-cust-to');
  if (custFromBtn) custFromBtn.onclick = () => openMonthPicker(custFromBtn, {
    value: state.insTrendFrom, max: currentMonthKey(),
    onSelect: key => { state.insTrendFrom = key; if ((state.insTrendTo || '') < key) state.insTrendTo = key; renderInsights(); }
  });
  if (custToBtn) custToBtn.onclick = () => openMonthPicker(custToBtn, {
    value: state.insTrendTo, max: currentMonthKey(),
    onSelect: key => { state.insTrendTo = key; if ((state.insTrendFrom || '') > key) state.insTrendFrom = key; renderInsights(); }
  });
  // Projection pills: with Mirror on, picking a span here sets Past data to the
  // same span (the projection follows automatically); "Off" unlinks and switches
  // projections off. With Mirror off they only set the projection.
  root.querySelectorAll('#ins-proj-pills [data-proj]').forEach(p => p.onclick = () => {
    const k = p.dataset.proj;
    if (k === 'off') { state.insProjScale = 'off'; state.insProjMirror = false; }
    else if (state.insProjMirror) state.insTrendScale = k;
    else state.insProjScale = k;
    renderInsights();
  });
  const mirrorBtn = root.querySelector('#ins-mirror');
  if (mirrorBtn) mirrorBtn.onclick = () => {
    if (state.insProjMirror) { const n = insProjectionSpan(); state.insProjScale = n ? String(n) : 'off'; state.insProjMirror = false; }
    else state.insProjMirror = true;
    renderInsights();
  };
}

/* ── Revenue page: compare timeframes and points ── */
// A base selection (always leftmost) and up to four comparisons to its right. A
// selection is one of: this month, the Past data window, the Projections window,
// a single month picked on the chart (hover to preview, click to lock), or a
// custom From–To range that may span past and projected months. Values per
// month are the same MRR the chart shows: landed cash for past months, what's
// expected to land for the current month, the target for future months.
let insCmpSeq = 0;
let insCmpHover = null;   // month under the cursor while a "Single month" slot is waiting for a pick
const INS_CMP_COLORS = ['#22d3ee', '#f472b6', '#facc15', '#fb923c', '#a3e635'];
const INS_CMP_MAX_OTHERS = 4;
const newCmpSel = type => ({ id: ++insCmpSeq, type });
const insCmpFind = id => state.insCmp && [state.insCmp.base, ...state.insCmp.others].find(s => s.id === id);

function insCmpMonths(sel, ctx, preview = true) {
  if (sel.type === 'this') return [ctx.monthKey];
  if (sel.type === 'past') return ctx.pastMonths;
  if (sel.type === 'proj') return ctx.projMonths;
  if (sel.type === 'month') {
    const m = preview && state.insCmpPick === sel.id && insCmpHover ? insCmpHover : sel.m;
    return m ? [m] : [];
  }
  if (sel.type === 'range') {
    if (!sel.from || !sel.to) return [];
    const a = sel.from <= sel.to ? sel.from : sel.to, b = sel.from <= sel.to ? sel.to : sel.from;
    const out = [];
    for (let m = a, i = 0; m <= b && i < 240; m = addMonths(m, 1), i++) out.push(m);
    return out;
  }
  return [];
}
function insCmpStats(months, ctx) {
  const pts = months.map(m => ctx.value(m)).filter(Boolean);
  if (!pts.length) return null;
  const kinds = new Set(pts.map(p => p.kind));
  const t = kinds.has('target'), a = kinds.has('actual'), e = kinds.has('expected');
  const kind = t && (a || e) ? 'Actual + target' : t ? 'Target (projected)' : e && a ? 'Actual + expected to land' : e ? 'Expected to land' : 'Actual (landed)';
  return { avg: pts.reduce((s, p) => s + p.v, 0) / pts.length, n: pts.length, kind };
}
// Columns in display order: base first, then the rest chronologically (by start
// month) and then by timespan length. Picks still waiting for a month go last.
function insCmpColumns(ctx) {
  const cmp = state.insCmp;
  const key = sel => { const ms = insCmpMonths(sel, ctx, false); return [ms.length ? ms[0] : '9999-99', ms.length || 9999]; };
  const others = [...cmp.others].sort((a, b) => { const ka = key(a), kb = key(b); return ka[0].localeCompare(kb[0]) || ka[1] - kb[1] || a.id - b.id; });
  return [cmp.base, ...others].map((sel, i) => ({ sel, isBase: i === 0, color: INS_CMP_COLORS[i % INS_CMP_COLORS.length], idx: i }));
}

function renderInsCompare(ctx) {
  const panel = document.getElementById('ins-cmp');
  if (!panel) return;
  const cols = insCmpColumns(ctx);
  const m0 = v => v == null ? '—' : '£' + Math.round(Math.abs(v)).toLocaleString('en-GB');
  const signed0 = v => v == null ? '—' : (v < 0 ? '−' : '+') + m0(v);
  const pct1 = v => `${v < 0 ? '−' : '+'}${Math.abs(v).toFixed(1)}%`;
  const baseStats = insCmpStats(insCmpMonths(cols[0].sel, ctx), ctx);
  const rangeText = ms => ms.length === 1 ? monthLabel(ms[0]) : `${monthRangeLabel(ms)} · ${ms.length} months`;
  const typeOptions = [
    ['this', `This month (${monthLabelShort(ctx.monthKey)})`],
    ['past', ctx.pastMonths.length ? `Past data (${monthRangeLabel(ctx.pastMonths)})` : 'Past data'],
    ['proj', ctx.projMonths.length ? `Projected (${monthRangeLabel(ctx.projMonths)})` : 'Projected (off)'],
    ['month', 'Single month — pick on graph'],
    ['range', 'Custom timeframe'],
  ];

  const colHtml = ({ sel, isBase, color }) => {
    const months = insCmpMonths(sel, ctx);
    const st = insCmpStats(months, ctx);
    const picking = state.insCmpPick === sel.id;
    let mid = '';
    if (sel.type === 'range') {
      mid = `<div class="cmpx-custom">From <button type="button" class="date-field" data-cmp-from="${sel.id}">${esc(monthLabelShort(sel.from))}</button> to <button type="button" class="date-field" data-cmp-to="${sel.id}">${esc(monthLabelShort(sel.to))}</button></div>`;
    } else if (sel.type === 'month') {
      mid = picking
        ? `<div class="cmpx-pick on">Hover a month on the graph, then click to lock it.${sel.m ? `<button type="button" class="cmpx-link" data-cmp-cancel="${sel.id}">Cancel</button>` : ''}</div>`
        : `<div class="cmpx-pick">${sel.m ? '' : 'No month chosen. '}<button type="button" class="cmpx-link" style="margin-left:0" data-cmp-repick="${sel.id}">${sel.m ? 'Pick a different month' : 'Pick a month on the graph'}</button></div>`;
    }
    let range = months.length ? rangeText(months) : '';
    if (!months.length && sel.type === 'proj') range = 'Projections are off — switch them on above.';
    else if (!months.length && sel.type === 'month') range = '';
    else if (months.length && !st) range = `${rangeText(months)} — no data`;
    const single = months.length === 1;
    let diffHtml = '';
    if (!isBase) {
      const diff = st && baseStats ? st.avg - baseStats.avg : null;
      const pct = diff != null && baseStats.avg > 0 ? diff / baseStats.avg * 100 : null;
      const cls = diff == null ? '' : diff >= 0 ? 'cmp-up' : 'cmp-down';
      diffHtml = `
        <div class="cmpx-stat"><div class="l">Difference vs. base</div><div class="v sm ${cls}">${signed0(diff)}</div></div>
        ${pct == null ? '<div class="cmp-badge none">% change unavailable</div>'
          : `<div class="cmp-badge ${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '▲' : '▼'} ${pct1(pct)} <span>vs. base</span></div>`}`;
    }
    return `<div class="cmpx-col ${isBase ? 'base' : ''}" style="--c:${color}">
      <div class="cmpx-tag"><span>${isBase ? 'Base' : 'Compare'}</span>${isBase ? '' : `<button type="button" class="cmpx-x" data-cmp-rm="${sel.id}" title="Remove this comparison">×</button>`}</div>
      <select data-cmp-type="${sel.id}">${typeOptions.map(([k, l]) => `<option value="${k}" ${sel.type === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      ${mid}
      <div class="cmpx-range">${esc(range)}</div>
      <div class="cmpx-stat"><div class="l">${single ? 'MRR' : 'Avg MRR'}</div><div class="v">${st ? m0(st.avg) : '—'}</div><div class="s">${st ? esc(st.kind) : ''}</div></div>
      ${diffHtml}
      ${isBase ? '<div class="cmpx-note">Everything to the right is compared to this.</div>' : ''}
    </div>`;
  };

  panel.innerHTML = `
    <div class="cmp-head">
      <h4>Compare</h4>
      <div class="sub">Pick a base on the left and what to compare it with on the right. Choose “Single month”, then hover the graph and click to lock a month.</div>
    </div>
    <div class="cmpx-cols">
      ${cols.map(colHtml).join('')}
      ${state.insCmp.others.length < INS_CMP_MAX_OTHERS ? `<button type="button" class="cmpx-add" id="cmp-add" title="Add another selection to compare"><span class="plus">＋</span>Add</button>` : ''}
    </div>`;
  ctx.wrap.classList.toggle('cmp-picking', !!state.insCmpPick);

  panel.querySelectorAll('[data-cmp-type]').forEach(s => s.onchange = () => {
    const sel = insCmpFind(Number(s.dataset.cmpType));
    if (!sel) return;
    sel.type = s.value;
    if (sel.type === 'range' && !(sel.from && sel.to)) {
      sel.from = ctx.pastMonths[0] || ctx.monthKey;
      sel.to = ctx.projMonths[ctx.projMonths.length - 1] || ctx.monthKey;
    }
    state.insCmpPick = sel.type === 'month' && !sel.m ? sel.id : null;
    insCmpHover = null;
    renderInsCompare(ctx);
  });
  panel.querySelectorAll('[data-cmp-rm]').forEach(b => b.onclick = () => {
    const id = Number(b.dataset.cmpRm);
    state.insCmp.others = state.insCmp.others.filter(s => s.id !== id);
    if (state.insCmpPick === id) state.insCmpPick = null;
    renderInsCompare(ctx);
  });
  panel.querySelectorAll('[data-cmp-repick]').forEach(b => b.onclick = () => { state.insCmpPick = Number(b.dataset.cmpRepick); insCmpHover = null; renderInsCompare(ctx); });
  panel.querySelectorAll('[data-cmp-cancel]').forEach(b => b.onclick = () => { state.insCmpPick = null; insCmpHover = null; renderInsCompare(ctx); });
  const addBtn = panel.querySelector('#cmp-add');
  if (addBtn) addBtn.onclick = () => {
    const used = new Set([state.insCmp.base, ...state.insCmp.others].map(s => s.type));
    const type = ['proj', 'this', 'past', 'range'].find(t => !used.has(t)) || 'month';
    const sel = newCmpSel(type);
    if (type === 'range') { sel.from = ctx.pastMonths[0] || ctx.monthKey; sel.to = ctx.projMonths[ctx.projMonths.length - 1] || ctx.monthKey; }
    state.insCmp.others.push(sel);
    if (type === 'month') state.insCmpPick = sel.id;
    renderInsCompare(ctx);
  };
  panel.querySelectorAll('[data-cmp-from]').forEach(b => b.onclick = () => {
    const sel = insCmpFind(Number(b.dataset.cmpFrom));
    openMonthPicker(b, { value: sel.from, onSelect: key => { sel.from = key; if (sel.to < key) sel.to = key; renderInsCompare(ctx); } });
  });
  panel.querySelectorAll('[data-cmp-to]').forEach(b => b.onclick = () => {
    const sel = insCmpFind(Number(b.dataset.cmpTo));
    openMonthPicker(b, { value: sel.to, onSelect: key => { sel.to = key; if (sel.from > key) sel.from = key; renderInsCompare(ctx); } });
  });
  insCmpPaint(ctx, cols);
}

// Colour bands on the chart showing where each selection sits (pointer-events
// off, so they never get in the way of the chart's own hover).
function insCmpPaint(ctx, cols) {
  const chart = ctx.chart;
  const svgEl = ctx.wrap && ctx.wrap.querySelector('svg');
  if (!svgEl || !chart || !chart.months || !chart.months.length || !chart.xc) return;
  const old = svgEl.querySelector('#cmp-marks');
  if (old) old.remove();
  let out = '';
  (cols || insCmpColumns(ctx)).forEach(({ sel, color, idx }) => {
    const idxs = insCmpMonths(sel, ctx).map(m => chart.months.indexOf(m)).filter(i => i >= 0);
    if (!idxs.length) return;
    const i0 = Math.min(...idxs), i1 = Math.max(...idxs);
    const x0 = chart.xc(i0) - chart.halfW, w = chart.xc(i1) - chart.xc(i0) + 2 * chart.halfW;
    const h = chart.H - chart.padT - chart.padB;
    const previewing = state.insCmpPick === sel.id && insCmpHover;
    out += `<rect x="${x0}" y="${chart.padT}" width="${w}" height="${h}" fill="${color}" opacity="${previewing ? 0.22 : 0.14}"${previewing ? ` stroke="${color}" stroke-dasharray="4 3"` : ''}/>
      <rect x="${x0}" y="${chart.padT + idx * 4}" width="${w}" height="3" fill="${color}"/>`;
  });
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('id', 'cmp-marks');
  g.setAttribute('pointer-events', 'none');
  g.innerHTML = out;
  svgEl.appendChild(g);
}

// Hover/click on the chart while a "Single month" slot is waiting: hover
// previews that month in the slot, a click locks it (and the cursor can move on).
function insCmpWire(ctx) {
  const chart = ctx.chart;
  const svgEl = ctx.wrap && ctx.wrap.querySelector('svg');
  if (!svgEl || !chart || !chart.months || !chart.months.length || !chart.idxAt) return;
  const monthAt = e => {
    const r = svgEl.getBoundingClientRect();
    const i = chart.idxAt((e.clientX - r.left) / r.width * chart.W);
    return i >= 0 ? chart.months[i] : null;
  };
  ctx.wrap.addEventListener('mousemove', e => {
    if (!state.insCmpPick) return;
    const m = monthAt(e);
    if (m !== insCmpHover) { insCmpHover = m; renderInsCompare(ctx); }
  });
  ctx.wrap.addEventListener('mouseleave', () => {
    if (insCmpHover) { insCmpHover = null; if (state.insCmpPick) renderInsCompare(ctx); }
  });
  ctx.wrap.addEventListener('click', e => {
    if (!state.insCmpPick) return;
    const m = monthAt(e);
    const sel = insCmpFind(state.insCmpPick);
    if (!m || !sel) return;
    sel.m = m;
    state.insCmpPick = null; insCmpHover = null;
    renderInsCompare(ctx);
  });
}

function insCmpMount(ctx) {
  insCmpHover = null;
  const cur = currentMonthKey();
  const firstMonth = insRevenueMonthList()[0] || null;
  ctx.value = m => {
    if (m > cur) { const t = targetForMonth(m); return t == null ? null : { v: t, kind: 'target' }; }
    if (firstMonth && m < firstMonth) return null;
    return m === cur ? { v: ctx.monthExpected, kind: 'expected' } : { v: landedForMonth(m), kind: 'actual' };
  };
  if (!state.insCmp) state.insCmp = { base: newCmpSel('past'), others: [newCmpSel(ctx.projMonths.length ? 'proj' : 'this')] };
  renderInsCompare(ctx);
  insCmpWire(ctx);
}

/* ════════════════ AM PERFORMANCE ════════════════ */
// Tracks how each account manager is performing, from who OWNED each invoice (see
// invoiceAM) — so a client handed from one AM to another counts for each of them only
// for their own period. Two sub-tabs: Team (every AM side by side) and Account Managers
// (a searchable list → one AM's detail page → an industry's client list).
//
// Money is the same landed-value logic used everywhere else (invoiceValueForLTV:
// what actually landed once paid, the invoiced amount while unpaid, 0 for an
// uncertain unpaid invoice). A client counts for every AM who has owned one of its
// invoices; churned and handed-over clients stay in that AM's lifetime figures.
const AM_UNASSIGNED = 'Unassigned';
const AM_COLORS = ['#a78bfa', '#22d3ee', '#f472b6', '#facc15', '#fb923c', '#34d399', '#60a5fa', '#f87171', '#c084fc', '#a3e635'];
const AM_TIMEFRAMES = [['month', 'This month'], ['3', '3M'], ['6', '6M'], ['12', '12M'], ['ytd', 'YTD'], ['all', 'All time']];
const AM_BASIS = [
  ['all', 'All clients', 'Every client they have managed — active and churned — using what each has paid so far.'],
  ['realised', 'Realised', 'Churned clients only — final figures.'],
  ['running', 'Running', 'Active clients only — still growing, not final.'],
  ['combination', 'Combination', 'Churned clients plus any active client already past the Realised average.'],
];
const amIsActive = c => c.status !== 'churned';
const amStateLabel = s => ({ active: 'Active', churned: 'Churned', handed: 'Handed over' })[s] || s;
// Who owned what. Built once per render (renderAmPerf clears the cache) from each invoice's
// owner (invoiceAM), so a client who moved from one AM to another appears under BOTH — each
// with only their own invoices. For one (account manager, client) pair this gives a row that
// looks like the client (so the charts and tables can use it as one) plus:
//   _ltv     what that AM's invoices for the client are worth
//   _tenure  how many invoices (months) the AM billed for the client
//   _state   'active' (still theirs), 'churned' (client left) or 'handed' (passed to someone else)
// A handed-over or churned relationship counts as "ended" for Realised / Combination.
function amModel() {
  if (amCache) return amCache;
  const byClient = new Map(DB.clients.map(c => [c.id, c]));
  const curOf = c => (c.accountManager || '').trim() || AM_UNASSIGNED;
  const invOwner = new Map(), timeline = new Map(), rels = new Map();
  const getRel = (name, c) => {
    let m = rels.get(name); if (!m) rels.set(name, m = new Map());
    let r = m.get(c.id); if (!r) m.set(c.id, r = { client: c, name, invoices: [] });
    return r;
  };
  for (const inv of DB.invoices) {
    const c = byClient.get(inv.clientId);
    if (!c) continue;
    const name = ((inv.accountManager || '').trim() || (c.accountManager || '').trim()) || AM_UNASSIGNED;
    invOwner.set(inv.id, name);
    getRel(name, c).invoices.push(inv);
    if (!timeline.has(c.id)) timeline.set(c.id, []);
    timeline.get(c.id).push({ m: inv.month || '', name });
  }
  for (const t of timeline.values()) t.sort((a, b) => a.m.localeCompare(b.m));
  for (const c of DB.clients) getRel(curOf(c), c);   // the current AM always has a relationship, even before their first invoice
  const byName = new Map();
  for (const [name, m] of rels) {
    byName.set(name, [...m.values()].map(r => {
      const c = r.client;
      const state = curOf(c) !== name ? 'handed' : c.status === 'churned' ? 'churned' : 'active';
      // A manual lifetime value / tenure adjustment on the client is history the old sheet missed, so it
      // belongs to the account manager who owned the client's FIRST invoice (the current one if it has none).
      const tl = timeline.get(c.id);
      const isFirst = (tl && tl.length ? tl[0].name : curOf(c)) === name;
      const relVal = r.invoices.reduce((s, i) => s + invoiceValueForLTV(i), 0), relN = r.invoices.length;
      return { ...c, status: state === 'active' ? 'active' : 'churned', _state: state, _am: name,
        _ltv: Math.max(0, relVal + (isFirst ? c.ltvAdjust || 0 : 0)),
        _tenure: Math.max(0, relN + (isFirst ? c.tenureAdjust || 0 : 0)) };
    }));
  }
  // The AM responsible for a client in a given month: the owner of that month's invoice, or of
  // the nearest earlier one (so a skipped / bridged month stays with whoever had the client).
  const ownerAt = (cid, m) => {
    const t = timeline.get(cid);
    if (!t || !t.length) return curOf(byClient.get(cid));
    let pick = null;
    for (const e of t) { if (e.m <= m) pick = e; else break; }
    return (pick || t[0]).name;
  };
  return (amCache = { rels: byName, invOwner, ownerAt });
}
let amCache = null;
// One AM's relationships (optionally only for clients in `poolIds`).
const amRelsOf = (name, poolIds) => (amModel().rels.get(name) || []).filter(r => !poolIds || poolIds.has(r.id));
// Every named AM who has a relationship with at least one client: the ones in Settings
// first, in that order, then any others alphabetically.
function amNames() {
  const real = new Set([...amModel().rels.entries()].filter(([n, rs]) => n !== AM_UNASSIGNED && rs.length).map(([n]) => n));
  const ordered = (DB.settings.accountManagers || []).filter(n => real.has(n));
  const rest = [...real].filter(n => !ordered.includes(n)).sort((a, b) => a.localeCompare(b));
  return [...ordered, ...rest];
}
function amColor(name) {
  if (name === AM_UNASSIGNED) return 'var(--neutral)';
  const i = amNames().indexOf(name);
  return AM_COLORS[(i < 0 ? 0 : i) % AM_COLORS.length];
}
// Invoice months a timeframe pill covers, never past the real current month.
function amWindowMonths(scale) {
  const cur = currentMonthKey();
  const all = invoiceMonths().filter(m => m <= cur);
  if (scale === 'month') return [cur];
  if (scale === 'all') return all;
  if (scale === 'ytd') return all.filter(m => m >= fiscalYearStart(cur));
  return all.slice(-Number(scale));
}
function amWindowLabel(scale) {
  const ms = amWindowMonths(scale);
  return scale === 'month' ? monthLabel(currentMonthKey()) : monthRangeLabel(ms);
}
// How many clients each AM had on the books during the window — a client counts for an AM if
// it was present (invoiced, or bridged/skipped) in any month of it while that AM had it. A client
// handed over inside the window counts for both AMs.
function amClientCountsIn(months, clients = DB.clients) {
  const mset = new Set(months), model = amModel(), counts = new Map();
  for (const c of clients) {
    const present = [...clientEffectiveContinuity(c.id).months, ...(c.skipMonths || [])].filter(m => mset.has(m));
    if (!present.length) continue;
    for (const n of new Set(present.map(m => model.ownerAt(c.id, m)))) counts.set(n, (counts.get(n) || 0) + 1);
  }
  return counts;
}
// The subset of one AM's relationships that were on the books in any month of the window.
function amRelsPresentIn(rels, months) {
  const mset = new Set(months), model = amModel();
  return rels.filter(r => [...clientEffectiveContinuity(r.id).months, ...(r.skipMonths || [])].some(m => mset.has(m) && model.ownerAt(r.id, m) === r._am));
}
// £ per AM from invoices due in the window (invoice.month is the due month), by who owned each invoice.
function amRevenueIn(months, poolIds) {
  const mset = new Set(months), model = amModel(), out = new Map();
  for (const inv of DB.invoices) {
    if (!mset.has(inv.month) || (poolIds && !poolIds.has(inv.clientId))) continue;
    const n = model.invOwner.get(inv.id);
    if (!n) continue;
    out.set(n, (out.get(n) || 0) + invoiceValueForLTV(inv));
  }
  return out;
}
// Average of `key` ('_ltv' | '_tenure') over one AM's relationships, on the chosen basis.
function amPick(rels, key, basis) {
  if (basis === 'all') {
    const vals = rels.map(r => r[key]);
    return { avg: avgOf(vals), count: vals.length };
  }
  const byId = new Map(rels.map(r => [r.id, r]));
  return basisPick(basisSplit(rels, id => byId.get(id)[key]), basis);
}
function amMonthStats(name, m) {
  const model = amModel();
  const invs = DB.invoices.filter(i => i.month === m);
  const mine = invs.filter(i => model.invOwner.get(i.id) === name);
  const value = mine.reduce((s, i) => s + invoiceValueForLTV(i), 0);
  const company = invs.reduce((s, i) => s + invoiceValueForLTV(i), 0);
  const invoiced = new Set(mine.map(i => i.clientId)).size;
  return { value, company, pct: company ? value / company * 100 : null, invoiced, perClient: invoiced ? value / invoiced : null };
}

// Horizontal bars in the same style as the Insights bar charts. rows:
// { name, value, color, note?, attrs? } already sorted by the caller.
function amBarsHtml(rows, { fmt = fmtMoney, valueWidth = 150 } = {}) {
  const rowsWithValue = rows.filter(r => r.value != null);
  if (!rowsWithValue.length) return '<div class="empty">Nothing to show yet.</div>';
  const maxVal = Math.max(1, ...rows.map(r => r.value || 0));
  return `<div class="ins-bars">${rows.map(r => {
    const pct = r.value != null ? Math.max(3, r.value / maxVal * 100) : 0;
    return `<div class="ins-bar-row${r.faded ? ' faded' : ''}">
      <div class="ins-bar-label" title="${esc(r.name)}">${esc(r.name)}</div>
      <div class="ins-bar-track"><div class="ins-bar-fill" style="width:${pct}%; background:${r.color}"></div></div>
      <div class="ins-bar-value${r.attrs ? ' clickable-stat' : ''}" style="width:${valueWidth}px" ${r.attrs || ''}>${r.value != null ? fmt(r.value) : '—'}${r.note ? ` <span class="dim">(${esc(r.note)})</span>` : ''}</div>
    </div>${r.sub ? `<div class="ins-bar-sub">${esc(r.sub)}</div>` : ''}`;
  }).join('')}</div>`;
}
// Donut chart (SVG) — rows: { name, value, color }. `print` swaps the theme
// variables for fixed light-paper colours so it also works in the PDF export.
function amPieSvg(rows, fmt = fmtMoney, { center = true, print = false } = {}) {
  const data = rows.filter(r => r.value > 0);
  const total = data.reduce((s, r) => s + r.value, 0);
  if (!total) return '';
  const ink = print ? '#111' : 'var(--text)', soft = print ? '#666' : 'var(--text-muted)', gap = print ? '#fff' : 'var(--bg-card)';
  const R = 100, r0 = 62, C = 110;
  let angle = 0;
  const pt = (rad, a) => [C + rad * Math.sin(a), C - rad * Math.cos(a)];
  const slices = data.map((d, i) => {
    const frac = d.value / total, a0 = angle, a1 = angle + frac * Math.PI * 2;
    angle = a1;
    const tip = `${d.name} — ${fmt(d.value)} (${(frac * 100).toFixed(1)}%)`;
    if (frac >= 0.9999) {
      return `<circle cx="${C}" cy="${C}" r="${(R + r0) / 2}" fill="none" stroke="${d.color}" stroke-width="${R - r0}" data-i="${i}"><title>${esc(tip)}</title></circle>`;
    }
    const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r0, a1), [x3, y3] = pt(r0, a0);
    const large = a1 - a0 > Math.PI ? 1 : 0;
    return `<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 ${large} 0 ${x3},${y3} Z" fill="${d.color}" stroke="${gap}" stroke-width="2" data-i="${i}"><title>${esc(tip)}</title></path>`;
  }).join('');
  const mid = center ? `<text x="${C}" y="${C - 2}" text-anchor="middle" font-size="11" fill="${soft}">Total</text>
      <text x="${C}" y="${C + 16}" text-anchor="middle" font-size="15" font-weight="800" fill="${ink}">${esc(fmt(total).replace(/\.00$/, ''))}</text>` : '';
  return `<svg viewBox="0 0 220 220" width="220" height="220" role="img">${slices}${mid}</svg>`;
}
// Donut + legend (value and share of the whole) for the on-screen Team charts.
function amPieHtml(rows, fmt = fmtMoney, opts = {}) {
  const data = rows.filter(r => r.value > 0);
  const total = data.reduce((s, r) => s + r.value, 0);
  if (!total) return '<div class="empty">Nothing to show yet.</div>';
  return `<div class="am-pie-wrap">
    ${amPieSvg(rows, fmt, opts)}
    <div class="am-legend">${data.map((d, i) => `<div class="am-legend-row" data-i="${i}"><span class="dot" style="background:${d.color}"></span><span class="nm">${esc(d.name)}</span><span class="v">${fmt(d.value)}</span><span class="p">${(d.value / total * 100).toFixed(1)}%</span></div>`).join('')}</div>
  </div>`;
}

function renderAmPerf() {

      <button type="button" class="am-subtab ${state.amTab === 'team' ? 'active' : ''}" data-am-tab="team">Team</button>
    </div>
    <div id="am-body"></div>`;

const amPills = (key, list, current, title) => `<div class="pills" ${title ? `title="${esc(title)}"` : ''}>${list.map(([k, l, t]) => `<button type="button" class="pill ${current === k ? 'active' : ''}" data-am-set="${key}:${k}" ${t ? `title="${esc(t)}"` : ''}>${esc(l)}</button>`).join('')}</div>`;
// Pie hover: the slice under the cursor grows slightly and its legend row is the
// only one left at full strength (the others fade). Hovering a legend row does
// the same to its slice.
function amWirePies(root) {
  root.querySelectorAll('.am-pie-wrap').forEach(wrap => {

function amWireSetters(root) {

/* ── Team: client filters ── */
// Wider industry / industry / territory (country) / company size. Every Team
// chart (and the export) is computed from just the clients that match all of
// the chosen filters, e.g. Industry = Accounting plus Territory = UK narrows
// everything to UK accounting clients. Independent of the Insights filters.
function amScopeClients() {
  const match = (val, f) => !f || (f === UNCLASSIFIED ? !val : val === f);
  return DB.clients.filter(c =>
    match(wideIndustryOf(c), state.amFilterWide) &&
    match(c.industry, state.amFilterIndustry) &&
    match(c.country, state.amFilterCountry) &&
    match(c.companySize, state.amFilterSize));
}
function amFilterSummary() {
  const nm = v => v === UNCLASSIFIED ? 'Unclassified' : v;
  return [['Wider industry', state.amFilterWide], ['Industry', state.amFilterIndustry], ['Territory', state.amFilterCountry], ['Company size', state.amFilterSize]]
    .filter(([, v]) => v).map(([l, v]) => `${l}: ${nm(v)}`).join(' · ');
}

/* ── Team ── */
// The four Team datasets, shared by the on-screen charts and the PDF/Doc export
// so the two can never disagree. Each: { key, title, note, rows, fmt, ... }.
function amTeamSections() {
  const names = amNames();
  const pool = amScopeClients();   // clients matching the Team filters
  const poolIds = new Set(pool.map(c => c.id));
  const basis = state.amBasis;
  const [, basisName, basisTitle] = AM_BASIS.find(b => b[0] === basis);

  const cMonths = amWindowMonths(state.amClientsScale);
  const counts = amClientCountsIn(cMonths, pool);
  const clientRows = [...names, AM_UNASSIGNED].map(n => ({ name: n, value: counts.get(n) || 0, color: amColor(n) }))
    .filter(r => r.value > 0).sort((a, b) => b.value - a.value);
  const clientTotal = clientRows.reduce((s, r) => s + r.value, 0);
  clientRows.forEach(r => { r.note = `${(r.value / clientTotal * 100).toFixed(0)}%`; });

  const rMonths = amWindowMonths(state.amRevScale);
  const rev = amRevenueIn(rMonths, poolIds);
  const revRows = [...names, AM_UNASSIGNED].map(n => ({ name: n, value: rev.get(n) || 0, color: amColor(n) }))
    .filter(r => r.value > 0).sort((a, b) => b.value - a.value);
  const revTotal = revRows.reduce((s, r) => s + r.value, 0);
  revRows.forEach(r => { r.note = `${(r.value / revTotal * 100).toFixed(1)}%`; });

  // Lifetime value and tenure stay lifetime figures; the timeframe picks which clients
  // are included — those on the books during it ('all' = every client).
  const avgRows = (key, scale) => {
    return names.map(n => {
      let rels = amRelsOf(n, poolIds);
      if (scale !== 'all') rels = amRelsPresentIn(rels, amWindowMonths(scale));
      const p = amPick(rels, key, basis);
      return { name: n, value: p.avg, note: `${p.count} client${p.count === 1 ? '' : 's'}`, color: amColor(n) };
    }).filter(r => r.value != null).sort((a, b) => b.value - a.value);
  };
  const scopeNote = scale => scale === 'all' ? '' : ` Clients on the books during ${amWindowLabel(scale)}; figures are lifetime.`;

  return [
    { key: 'Clients', title: 'Number of clients', timeframe: 'amClientsScale', timeframeTip: 'Clients on the books at any point in this period',
      sub: `Clients each account manager had on the books during ${amWindowLabel(state.amClientsScale)} — ${clientTotal} in total.`,
      rows: clientRows, fmt: v => String(v), valueWidth: 100, center: true, shareLabel: 'Share', valueLabel: 'Clients' },
    { key: 'Rev', title: 'Revenue share', timeframe: 'amRevScale', timeframeTip: 'Invoices due in this period',
      sub: `Each account manager's share of ${fmtMoney(revTotal)} invoiced in ${amWindowLabel(state.amRevScale)}.`,
      rows: revRows, fmt: fmtMoney, valueWidth: 190, center: true, shareLabel: 'Share', valueLabel: 'Revenue' },
    { key: 'Ltv', title: 'Average client lifetime value', basis: true, timeframe: 'amLtvScale', timeframeTip: 'Which clients: those on the books at any point in this period (All time = every client)',
      sub: `${basisName} basis — ${basisTitle}${scopeNote(state.amLtvScale)}`,
      rows: avgRows('_ltv', state.amLtvScale), fmt: fmtMoney, valueWidth: 190, center: false, shareLabel: 'Clients counted', valueLabel: 'Average lifetime value' },
    { key: 'Tenure', title: 'Average client tenure', basis: true, timeframe: 'amTenureScale', timeframeTip: 'Which clients: those on the books at any point in this period (All time = every client)',
      sub: `${basisName} basis — ${basisTitle} Tenure is months billed.${scopeNote(state.amTenureScale)}`,
      rows: avgRows('_tenure', state.amTenureScale), fmt: v => v.toFixed(1) + ' mo', valueWidth: 170, center: false, shareLabel: 'Clients counted', valueLabel: 'Average tenure' },
  ];
}
function renderAmTeam(body) {
  const amSel = (id, label, list, current, field, within = DB.clients) => `<select id="${id}">
      <option value="">All ${esc(label)}</option>
      ${optionsInUse(field, list, current, within).map(v => `<option value="${esc(v)}" ${current === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}
      ${hasUnclassified(field, within) || current === UNCLASSIFIED ? `<option value="${UNCLASSIFIED}" ${current === UNCLASSIFIED ? 'selected' : ''}>Unclassified</option>` : ''}
    </select>`;
  const inScope = amScopeClients().length;
  if (!amNames().length) { body.innerHTML = '<div class="chart-card"><div class="empty">No account managers are assigned to any client yet.</div></div>'; return; }
  const basisTitle = AM_BASIS.find(b => b[0] === state.amBasis)[2];
  const card = s => {
    const chart = state['amChart' + s.key];
    const pieNote = chart === 'pie' && !s.center ? '<div class="note" style="margin:0 0 8px">Slices show each account manager\'s share of the combined averages.</div>' : '';
    return `<div class="chart-card">
      <div class="chart-head">
        <h3>${esc(s.title)}</h3>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
          ${s.timeframe ? amPills(s.timeframe, AM_TIMEFRAMES, state[s.timeframe], s.timeframeTip) : ''}
          ${s.basis ? amPills('amBasis', AM_BASIS, state.amBasis, basisTitle) : ''}
          ${amPills('amChart' + s.key, [['bar', 'Bar'], ['pie', 'Pie']], chart, 'Chart type')}
        </div>
      </div>
      <div class="note" style="margin:-4px 0 12px">${esc(s.sub)}</div>
      ${pieNote}
      ${chart === 'pie' ? amPieHtml(s.rows, s.fmt, { center: s.center }) : amBarsHtml(s.rows, { fmt: s.fmt, valueWidth: s.valueWidth })}
    </div>`;
  };
  // Master controls: Timeframe and Chart type each set every chart at once. A master
  // pill is highlighted only while all four charts agree (changing one chart on its
  // own leaves the master with no highlight and a "mixed" tag).
  const scaleKeys = ['amClientsScale', 'amRevScale', 'amLtvScale', 'amTenureScale'];
  const chartKeys = ['amChartClients', 'amChartRev', 'amChartLtv', 'amChartTenure'];
  const agree = keys => keys.every(k => state[k] === state[keys[0]]) ? state[keys[0]] : null;
  const masterCur = agree(scaleKeys), masterChart = agree(chartKeys);
  body.innerHTML = `
    <div class="am-ctl-row">
      <div class="am-ctl" title="Sets the timeframe on every chart below at once">
        <div class="am-ctl-label">Timeframe · all charts ${masterCur ? '' : '<em>(mixed)</em>'}</div>
        <div class="pills">${AM_TIMEFRAMES.map(([k, l]) => `<button type="button" class="pill ${masterCur === k ? 'active' : ''}" data-am-master="${k}">${l}</button>`).join('')}</div>
      </div>
      <div class="am-ctl" title="Switches every chart below between bars and pies at once">
        <div class="am-ctl-label">Chart type · all charts ${masterChart ? '' : '<em>(mixed)</em>'}</div>
        <div class="pills">${[['bar', 'Bar'], ['pie', 'Pie']].map(([k, l]) => `<button type="button" class="pill ${masterChart === k ? 'active' : ''}" data-am-master-chart="${k}">${l}</button>`).join('')}</div>
      </div>
      <div class="am-ctl am-ctl-export">
        <div class="am-ctl-label">Export</div>
        <div class="am-ctl-btns">
          <button type="button" class="btn btn-sm" id="am-export-pdf" title="Opens a print-ready report — choose “Save as PDF” as the destination">⬇ PDF</button>
          <button type="button" class="btn btn-sm" id="am-export-doc" title="Downloads a document you can open in Google Docs">⬇ Google Doc</button>
        </div>
      </div>
    </div>
    <div class="am-ctl-row">
      <div class="am-ctl filters">
        <div class="am-ctl-label">Filter clients${amFilterSummary() ? ' · active' : ''}</div>
        <div class="am-ctl-selects">
          ${amSel('am-f-wide', 'wider industries', DB.settings.wideIndustries, state.amFilterWide, 'wideIndustry')}
          ${amSel('am-f-industry', 'industries', DB.settings.industries, state.amFilterIndustry, 'industry', clientsInWide(state.amFilterWide))}
          ${amSel('am-f-country', 'territories', DB.settings.countries, state.amFilterCountry, 'country')}
          ${amSel('am-f-size', 'company sizes', DB.settings.companySizes, state.amFilterSize, 'companySize')}
          ${amFilterSummary() ? '<button type="button" class="btn btn-sm" id="am-f-clear">Clear filters</button>' : ''}
        </div>
      </div>
    </div>
    <div class="note" style="margin:0 0 14px">${inScope === DB.clients.length ? `Every account manager side by side — all ${inScope} clients.` : `Showing ${inScope} of ${DB.clients.length} clients${amFilterSummary() ? ` — ${esc(amFilterSummary())}` : ''}.`}</div>
    <div class="am-stack">${amTeamSections().map(card).join('')}</div>`;
  amWireSetters(body);
  amWirePies(body);
  body.querySelectorAll('[data-am-master]').forEach(b => b.onclick = () => { scaleKeys.forEach(k => { state[k] = b.dataset.amMaster; }); renderAmPerf(); });
  body.querySelectorAll('[data-am-master-chart]').forEach(b => b.onclick = () => { chartKeys.forEach(k => { state[k] = b.dataset.amMasterChart; }); renderAmPerf(); });
  const filterEl = (id, key) => { const el = body.querySelector('#' + id); if (el) el.onchange = e => { state[key] = e.target.value; renderAmPerf(); }; };
  const wideEl = body.querySelector('#am-f-wide');
  if (wideEl) wideEl.onchange = e => {
    state.amFilterWide = e.target.value;
    // an industry outside the chosen wider industry can no longer match — drop it
    const inWide = clientsInWide(state.amFilterWide);
    if (state.amFilterIndustry && state.amFilterIndustry !== UNCLASSIFIED && !inWide.some(c => c.industry === state.amFilterIndustry)) state.amFilterIndustry = '';
    renderAmPerf();
  };
  filterEl('am-f-industry', 'amFilterIndustry'); filterEl('am-f-country', 'amFilterCountry'); filterEl('am-f-size', 'amFilterSize');
  const clearBtn = body.querySelector('#am-f-clear');
  if (clearBtn) clearBtn.onclick = () => { state.amFilterWide = state.amFilterIndustry = state.amFilterCountry = state.amFilterSize = ''; renderAmPerf(); };
  body.querySelector('#am-export-pdf').onclick = amExportPdf;
  body.querySelector('#am-export-doc').onclick = amExportDoc;
}

/* ── Team export (PDF via the print dialog, Google Doc via a downloadable .doc) ── */
function amReportSections() {
  // The exports have no theme variables, so the grey "Unassigned" swatch becomes a fixed grey.
  const printColor = c => String(c).startsWith('var(') ? '#9ca3af' : c;
  return amTeamSections().map(s => {
    const rows = s.rows.map(r => ({ ...r, color: printColor(r.color) }));
    const total = rows.reduce((a, r) => a + r.value, 0);
    const isShare = s.center;   // clients / revenue are parts of a whole; the averages are not
    return { ...s, rows, chart: state['amChart' + s.key], total, tableRows: rows.map(r => ({
      name: r.name, color: r.color, value: s.fmt(r.value), extra: isShare ? `${(r.value / total * 100).toFixed(1)}%` : r.note,
    })) };
  });
}
function amReportMeta() {
  const basisName = AM_BASIS.find(b => b[0] === state.amBasis)[1];
  return {
    title: 'AM Performance — Team',
    generated: new Date().toLocaleString('en-GB', { dateStyle: 'long', timeStyle: 'short' }),
    summary: `Clients: ${amWindowLabel(state.amClientsScale)} · Revenue: ${amWindowLabel(state.amRevScale)} · Lifetime value clients: ${state.amLtvScale === 'all' ? 'all time' : amWindowLabel(state.amLtvScale)} · Tenure clients: ${state.amTenureScale === 'all' ? 'all time' : amWindowLabel(state.amTenureScale)} · Lifetime value and tenure basis: ${basisName}${amFilterSummary() ? ` · Filters — ${amFilterSummary()}` : ''}`,
  };
}
function amExportPdf() {
  const meta = amReportMeta();
  const barRow = (r, max) => `<tr><td class="nm"><span class="sw" style="background:${r.color}"></span>${esc(r.name)}</td>
      <td class="bar"><div style="width:${r._w}%; background:${r.color}"></div></td><td class="num">${esc(r.value)}</td><td class="num dim">${esc(r.extra)}</td></tr>`;
  const sectionHtml = s => {
    const max = Math.max(1, ...s.rows.map(r => r.value));
    const rows = s.tableRows.map((r, i) => ({ ...r, _w: Math.max(3, s.rows[i].value / max * 100) }));
    const visual = s.chart === 'pie'
      ? `<div class="pie">${amPieSvg(s.rows, s.fmt, { center: s.center, print: true })}</div>
         <table class="legend"><thead><tr><th>Account manager</th><th class="num">${esc(s.valueLabel)}</th><th class="num">${esc(s.shareLabel)}</th></tr></thead><tbody>${rows.map(r => `<tr><td class="nm"><span class="sw" style="background:${r.color}"></span>${esc(r.name)}</td><td class="num">${esc(r.value)}</td><td class="num dim">${esc(r.extra)}</td></tr>`).join('')}</tbody></table>`
      : `<table class="bars"><thead><tr><th>Account manager</th><th></th><th class="num">${esc(s.valueLabel)}</th><th class="num">${esc(s.shareLabel)}</th></tr></thead><tbody>${rows.map(r => barRow(r)).join('')}</tbody></table>`;
    return `<section><h2>${esc(s.title)}</h2><p class="sub">${esc(s.sub)}</p>${s.rows.length ? visual : '<p class="sub">Nothing to show for this selection.</p>'}</section>`;
  };
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(meta.title)}</title>
    <style>
      @page { margin: 14mm; }
      * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { font: 12px/1.45 Arial, Helvetica, sans-serif; color: #111; margin: 0; }
      h1 { font-size: 22px; margin: 0 0 2px; } .meta { color: #666; margin-bottom: 18px; }
      section { break-inside: avoid; margin-bottom: 22px; } h2 { font-size: 15px; margin: 0 0 2px; } .sub { color: #666; margin: 0 0 8px; }
      table { width: 100%; border-collapse: collapse; } th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #666; border-bottom: 1px solid #ccc; padding: 4px 6px; }
      td { padding: 4px 6px; border-bottom: 1px solid #eee; } .num { text-align: right; white-space: nowrap; } .dim { color: #666; }
      .nm { white-space: nowrap; } .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
      td.bar { width: 45%; } td.bar div { height: 11px; border-radius: 3px; } .pie { text-align: center; margin: 4px 0 8px; } .legend { max-width: 560px; margin: 0 auto; }
    </style></head><body>
    <h1>${esc(meta.title)}</h1><div class="meta">${esc(meta.summary)}<br>Generated ${esc(meta.generated)}</div>
    ${amReportSections().map(sectionHtml).join('')}
    </body></html>`;
  const frame = document.createElement('iframe');
  frame.style.cssText = 'position:fixed; right:0; bottom:0; width:0; height:0; border:0; visibility:hidden';
  document.body.appendChild(frame);
  frame.contentDocument.open(); frame.contentDocument.write(html); frame.contentDocument.close();
  setTimeout(() => {
    frame.contentWindow.focus(); frame.contentWindow.print();
    setTimeout(() => frame.remove(), 2000);
  }, 300);
}
function amExportDoc() {
  const meta = amReportMeta();
  const sectionHtml = s => `<h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p>
    ${s.rows.length ? `<table border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse; border-color:#bbb">
      <tr style="background:#eee"><th align="left">Account manager</th><th align="right">${esc(s.valueLabel)}</th><th align="right">${esc(s.shareLabel)}</th></tr>
      ${s.tableRows.map(r => `<tr><td><span style="color:${r.color}">&#9632;</span> ${esc(r.name)}</td><td align="right">${esc(r.value)}</td><td align="right">${esc(r.extra)}</td></tr>`).join('')}
    </table>` : '<p><i>Nothing to show for this selection.</i></p>'}`;
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${esc(meta.title)}</title></head>
    <body style="font-family:Arial,sans-serif; font-size:11pt">
    <h1>${esc(meta.title)}</h1><p style="color:#666">${esc(meta.summary)}<br>Generated ${esc(meta.generated)}</p>
    ${amReportSections().map(sectionHtml).join('')}
    </body></html>`;
  const name = `AM-Performance-Team-${todayISO()}.doc`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿', html], { type: 'application/msword' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  openModal(`
    <div class="modal-head"><h3>Open it as a Google Doc</h3><button class="modal-x" data-close>×</button></div>

      <li>Right-click the uploaded file → <strong>Open with → Google Docs</strong>.</li>
    </ol>
    <div class="modal-foot"><button class="btn" data-close>Close</button><a class="btn btn-primary" href="https://drive.google.com/drive/my-drive" target="_blank" rel="noopener">Open Google Drive</a></div>`);
}

/* ── Account Managers: searchable list ── */
function renderAmList(body) {
  const names = amNames().filter(n => amRelsOf(n).some(amIsActive));
  const cur = currentMonthKey();
  const cards = names.map(n => {
    const clients = amRelsOf(n);
    const active = clients.filter(amIsActive);
    const st = amMonthStats(n, cur);
    return `<button type="button" class="am-card" data-am-open="${esc(n)}" data-name="${esc(n.toLowerCase())}" style="--c:${amColor(n)}">
      <div class="am-card-name">${esc(n)}</div>
      <div class="am-card-stats">
        <div><div class="v">${active.length}</div><div class="l">Active client${active.length === 1 ? '' : 's'}</div></div>
        <div><div class="v">${fmtMoney(st.value)}</div><div class="l">${esc(monthLabelShort(cur))}</div></div>
      </div>
    </button>`;
  }).join('');
  body.innerHTML = `
    <div class="toolbar" style="margin-bottom:14px">
      <input type="search" id="am-search" placeholder="Search account managers…" style="min-width:260px" value="${esc(state.amSearch || '')}" autocomplete="off">
      <span class="dim" style="font-size:12px">${names.length} account manager${names.length === 1 ? '' : 's'} with an active client</span>
    </div>
    ${names.length ? `<div class="am-list" id="am-list">${cards}</div><div class="empty" id="am-none" style="display:none">No account managers match your search.</div>`
      : '<div class="chart-card"><div class="empty">No account manager has an active client yet.</div></div>'}`;
  const input = body.querySelector('#am-search');
  const apply = () => {
    const q = input.value.trim().toLowerCase();
    state.amSearch = input.value;
    let shown = 0;
    body.querySelectorAll('.am-card').forEach(c => { const hit = !q || c.dataset.name.includes(q); c.style.display = hit ? '' : 'none'; if (hit) shown++; });
    const none = body.querySelector('#am-none');
    if (none) none.style.display = shown ? 'none' : '';
  };
  input.addEventListener('input', apply);
  apply();
  body.querySelectorAll('[data-am-open]').forEach(b => b.onclick = () => { state.amSel = b.dataset.amOpen; state.amIndustry = null; state.amClientStatus = 'all'; renderAmPerf(); revealCharts(document.getElementById('view-amperf')); });
}

/* ── One account manager ── */
function renderAmDetail(body, name) {
  const clients = amRelsOf(name);
  if (!clients.length) { state.amSel = null; renderAmList(body); return; }
  const cur = currentMonthKey();
  const basis = state.amBasis;
  const st = amMonthStats(name, cur);
  const active = clients.filter(amIsActive);
  const nChurned = clients.filter(c => c._state === 'churned').length, nHanded = clients.filter(c => c._state === 'handed').length;
  const careerLtv = clients.reduce((s, c) => s + c._ltv, 0);
  const color = amColor(name);

  const buckets = clientBuckets('industry', clients);
  // Under Combination an industry can have no figure at all — e.g. its only client is
  // still active and hasn't passed the Realised average. Those industries are still
  // listed, below the ranked ones, faded and in italics, at their active clients'
  // current figure (current tenure / lifetime value so far) with the clients named.
  const industryRows = key => {
    const ranked = [], pending = [];
    buckets.forEach(b => {
      const p = amPick(b.clients, key, basis);
      const attrs = `data-am-ind="${esc(b.name)}"`;
      if (p.avg != null) { ranked.push({ name: b.name, value: p.avg, note: `${p.count}`, attrs }); return; }
      const act = basis === 'combination' ? b.clients.filter(amIsActive) : [];
      if (act.length) pending.push({ name: b.name, value: avgOf(act.map(c => c[key])), note: `${act.length} active`, attrs, faded: true,
        sub: `${act.map(c => c.companyName).join(', ')} — still active, current figure` });
    });
    ranked.sort((a, b) => b.value - a.value);
    pending.sort((a, b) => b.value - a.value);
    return [...ranked.map((r, i) => ({ ...r, color: greyFade(i, ranked.length) })), ...pending.map(r => ({ ...r, color: 'var(--neutral)' }))];
  };
  const tenureRowsIn = industryRows('_tenure'), ltvRowsIn = industryRows('_ltv');
  const fadedNote = rows => rows.some(r => r.faded) ? ' Faded italic rows are active clients who don’t have a Combination figure yet, shown at their current figure.' : '';
  const tenureBars = amBarsHtml(tenureRowsIn, { fmt: v => v.toFixed(1) + ' mo', valueWidth: 110 });
  const ltvBars = amBarsHtml(ltvRowsIn, { fmt: fmtMoney, valueWidth: 150 });
  const basisTitle = AM_BASIS.find(b => b[0] === basis)[2];

  const split = buckets.map(b => ({ name: b.name, n: b.clients.length, active: b.clients.filter(amIsActive).length }));
  const maxN = Math.max(1, ...split.map(s => s.n));
  const clientRows = [...clients].sort((a, b) => (amIsActive(b) - amIsActive(a)) || ((b.feeGBP || 0) - (a.feeGBP || 0)) || a.companyName.localeCompare(b.companyName));

  body.innerHTML = `
    <div class="toolbar" style="margin-bottom:14px">
      <button type="button" class="btn btn-sm" id="am-back">← All account managers</button>
      <h2 style="font-size:20px; font-weight:800; letter-spacing:-.3px; display:flex; align-items:center; gap:10px"><span class="dot" style="background:${color}; width:12px; height:12px"></span>${esc(name)}</h2>
      <span class="dim" style="font-size:12px">${active.length} active · ${nChurned} churned${nHanded ? ` · ${nHanded} handed over` : ''}</span>
    </div>

    <div class="stats">
      <div class="stat"><div class="v">${fmtMoney(st.value)}</div><div class="l">${esc(monthLabel(cur))} value</div><div class="s">${st.pct != null ? `${st.pct.toFixed(1)}% of the company's ${fmtMoney(st.company)}` : 'no company revenue yet'}</div></div>
      <div class="stat"><div class="v">${st.perClient != null ? fmtMoney(st.perClient) : '—'}</div><div class="l">Revenue per client — ${esc(monthLabelShort(cur))}</div><div class="s">${st.invoiced} client${st.invoiced === 1 ? '' : 's'} invoiced this month</div></div>
      <div class="stat ok"><div class="v">${fmtMoney(careerLtv)}</div><div class="l">Career lifetime value</div><div class="s">${esc(name)}'s share, across ${clients.length} client${clients.length === 1 ? '' : 's'} (manual adjustments included)</div></div>
    </div>

    <div class="am-grid">
      <div class="chart-card">
        <div class="chart-head"><h3>Average tenure by industry</h3>${amPills('amBasis', AM_BASIS, basis, basisTitle)}</div>
        <div class="note" style="margin:-4px 0 12px">Months billed. ${esc(basisTitle)} Click a bar to see those clients.${esc(fadedNote(tenureRowsIn))}</div>
        ${tenureBars}
      </div>
      <div class="chart-card">
        <div class="chart-head"><h3>Average client lifetime value by industry</h3>${amPills('amBasis', AM_BASIS, basis, basisTitle)}</div>
        <div class="note" style="margin:-4px 0 12px">${esc(basisTitle)} Click a bar to see those clients.${esc(fadedNote(ltvRowsIn))}</div>
        ${ltvBars}
      </div>
    </div>

    <div class="chart-card" style="margin-top:16px">
      <div class="chart-head"><h3>Lifetime industry client split</h3><span class="dim" style="font-size:12px">Every client ${esc(name)} has worked with — click an industry for its clients</span></div>
      <div class="ins-bars">${split.map(s => `<div class="ins-bar-row">
        <div class="ins-bar-label" title="${esc(s.name)}">${esc(s.name)}</div>
        <div class="ins-bar-track"><div class="ins-bar-fill" style="width:${Math.max(3, s.n / maxN * 100)}%; background:${color}"></div></div>
        <div class="ins-bar-value clickable-stat" style="width:150px" data-am-ind="${esc(s.name)}">${s.n} client${s.n === 1 ? '' : 's'} <span class="dim">(${s.active} active)</span></div>
      </div>`).join('')}</div>
    </div>

    <h2 class="section" style="margin-top:20px">${esc(name)}'s clients</h2>
    <div class="toolbar" style="margin-bottom:10px">
      <span class="dim" style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em">Status</span>
      <div class="pills" id="am-status-pills">${[['all', 'All', clients.length], ['active', 'Active', active.length], ['churned', 'Churned', nChurned], ...(nHanded ? [['handed', 'Handed over', nHanded]] : [])]
        .map(([k, l, n]) => `<button type="button" class="pill ${state.amClientStatus === k ? 'active' : ''}" data-am-status="${k}">${l} (${n})</button>`).join('')}</div>
    </div>

      <table>
        <thead><tr><th>Client</th><th>Status</th><th>Industry</th><th class="num">Monthly fee</th><th class="num">Lifetime value</th></tr></thead>
        <tbody>${clientRows.map(c => `<tr data-status="${c._state}">
          <td><strong>${esc(c.companyName)}</strong></td>
          <td class="${amIsActive(c) ? '' : 'dim'}">${amStateLabel(c._state)}</td>
          <td class="dim">${esc(c.industry || 'Unclassified')}</td>
          <td class="num money">${fmtMoney(c.feeGBP)}</td>
          <td class="num money">${fmtMoney(c._ltv)}</td>
        </tr>`).join('')}<tr id="am-clients-empty" style="display:none"><td colspan="5"><div class="empty">No clients with this status.</div></td></tr></tbody>
      </table>
    </div>`;
  amWireSetters(body);
  // Status filter on the client list — filters the rows in place (no page re-render, so the scroll position stays put).
  const applyStatus = () => {
    let shown = 0;
    body.querySelectorAll('tr[data-status]').forEach(tr => { const hit = state.amClientStatus === 'all' || tr.dataset.status === state.amClientStatus; tr.style.display = hit ? '' : 'none'; if (hit) shown++; });
    body.querySelector('#am-clients-empty').style.display = shown ? 'none' : '';
    body.querySelectorAll('[data-am-status]').forEach(b => b.classList.toggle('active', b.dataset.amStatus === state.amClientStatus));
  };
  body.querySelectorAll('[data-am-status]').forEach(b => b.onclick = () => { state.amClientStatus = b.dataset.amStatus; applyStatus(); });
  applyStatus();
  body.querySelector('#am-back').onclick = () => { state.amSel = null; state.amIndustry = null; renderAmPerf(); revealCharts(document.getElementById('view-amperf')); };
  body.querySelectorAll('[data-am-ind]').forEach(el => el.onclick = () => { state.amIndustry = el.dataset.amInd; renderAmPerf(); revealCharts(document.getElementById('view-amperf')); });
}

// Client performance indicator — now the 4th Overview tile (bottom of the
// stack) rather than its own top-level tab. It's already the full tool
// (not a stat preview), so unlike the other three tiles it isn't clickable
// through to anything further.
function renderInsPredictTile(bodyEl) {
  const pillGroup = (title, list, selected, group) => `
    <div class="fld">
      <label>${esc(title)}</label>
      <div class="pills" data-group="${group}">
        ${list.length ? list.map(v => `<button type="button" class="pill ${selected.includes(v) ? 'active' : ''}" data-val="${esc(v)}">${esc(v)}</button>`).join('')
          : `<span class="muted">None set up yet — add some in Settings.</span>`}
      </div>
    </div>`;
  const predict = predictForFilters({ wideIndustries: state.insPredWide, industries: state.insPredIndustries, sizes: state.insPredSizes, countries: state.insPredCountries });
  const basis = state.insPredBasis;
  const ltvPick = basisPick(predict.ltv, basis);
  const tenurePick = basisPick(predict.tenure, basis);
  const churnedCount = predict.ltv.realisedCount;
  const activeCount = predict.ltv.runningCount;
  const thinData = ltvPick.count > 0 && ltvPick.count < 3;

  bodyEl.innerHTML = `
    <div class="chart-card">
      <div class="chart-head"><h3>Client performance indicator</h3></div>
      ${pillGroup('Wider industry', optionsInUse('wideIndustry', DB.settings.wideIndustries, state.insPredWide), state.insPredWide, 'wide')}
      ${pillGroup('Industry', optionsInUse('industry', DB.settings.industries, state.insPredIndustries), state.insPredIndustries, 'industries')}
      ${pillGroup('Company size', optionsInUse('companySize', DB.settings.companySizes, state.insPredSizes), state.insPredSizes, 'sizes')}
      ${pillGroup('Country', optionsInUse('country', DB.settings.countries, state.insPredCountries), state.insPredCountries, 'countries')}
      <div class="fld" style="margin-top:4px">
        <label>Basis</label>
        <div class="pills" id="pred-basis-pills" title="Realised = churned matching clients only, final figures. Running = active matching clients only, still growing. Combination = churned clients plus any active matching client already past the Realised average, blended into one number.">
          ${Object.entries(BASIS_LABEL).map(([k, l]) => `<button type="button" class="pill ${basis === k ? 'active' : ''}" data-basis="${k}">${l}</button>`).join('')}
        </div>
      </div>
      <div class="stats" style="margin-top:14px">
        <div class="stat ok"><div class="v">${tenurePick.avg != null ? tenurePick.avg.toFixed(1) : '—'}</div><div class="l" title="Average months as a customer among ${basis} matching clients">Predicted tenure (months)</div></div>
        <div class="stat"><div class="v">${ltvPick.avg != null ? fmtMoney(ltvPick.avg) : '—'}</div><div class="l">Predicted ${insTerm('LTV')}</div></div>
      </div>
      <p class="note">Based on <strong>${churnedCount}</strong> churned and <strong>${activeCount}</strong> active matching client${(churnedCount + activeCount) === 1 ? '' : 's'}${basis === 'combination' ? ` — ${ltvPick.count - churnedCount} of the active ones already exceed the Realised average and count toward the figures above` : ''}.
      ${churnedCount === 0 && basis !== 'running' ? `<br><span style="color:var(--warn)">No churned clients match this combination yet — ${basis === 'combination' ? 'Combination has no Realised baseline to compare active clients against, so there’s nothing to show' : 'no prediction available'}.</span>` : ''}
      ${basis === 'running' && activeCount === 0 ? `<br><span style="color:var(--warn)">No active clients match this combination yet — no Running estimate available.</span>` : ''}
      ${thinData ? `<br><span style="color:var(--warn)">Only ${ltvPick.count} matching client${ltvPick.count === 1 ? '' : 's'} behind this figure — treat it cautiously.</span>` : ''}
      </p>
    </div>`;

  // Re-renders just this tile (not renderInsights()) so toggling a filter
  // here doesn't replay the Overview's whole page-enter animation — this
  // tile isn't navigating anywhere, just updating its own numbers.
  const PRED_STATE_KEY = { wide: 'insPredWide', industries: 'insPredIndustries', sizes: 'insPredSizes', countries: 'insPredCountries' };
  bodyEl.querySelectorAll('[data-group]').forEach(group => {
