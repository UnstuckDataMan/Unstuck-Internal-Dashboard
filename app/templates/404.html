{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block heading %}Not Found{% endblock %}

{% block content %}
<div style="text-align:center; padding:60px 20px">
  <div style="font-family:var(--font-display); font-size:72px; font-weight:700;
              background:var(--gradient-vivid); -webkit-background-clip:text;
              background-clip:text; color:transparent; line-height:1">404</div>
  <p style="color:var(--text-2); font-size:15px; margin:18px 0 30px">
    This page doesn&rsquo;t exist &mdash; it may have moved, or the link is wrong.
  </p>
  <a href="/" class="btn btn-primary" style="display:inline-flex">&larr; Back to Dashboard</a>
</div>
{% endblock %}
