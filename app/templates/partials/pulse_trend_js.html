{# Tooltip behaviour for every trend strip on the page. Included once.

   Delegated from the document rather than bound per column: a strip can have
   sixty of them, and the portal re-renders on a range change. #}
<script>
(function () {
  function fill(tip, col) {
    tip.querySelector('.trend-tip-label').textContent = col.dataset.label || '';
    tip.querySelectorAll('[data-tip]').forEach(function (slot) {
      var key = slot.getAttribute('data-tip').replace(/-([a-z])/g, function (_, c) {
        return c.toUpperCase();
      });
      slot.textContent = col.dataset[key] || '0';
    });
  }

  function place(wrap, tip, col) {
    // Positioned against the strip, then clamped inside it, so a column at
    // either end does not push the tooltip out of the panel.
    var box = wrap.getBoundingClientRect();
    var bar = col.getBoundingClientRect();
    tip.hidden = false;
    var width = tip.offsetWidth;
    var left = bar.left - box.left + bar.width / 2 - width / 2;
    left = Math.max(0, Math.min(left, box.width - width));
    tip.style.left = left + 'px';
    tip.style.bottom = (box.bottom - bar.top + 8) + 'px';
  }

  function show(col) {
    var wrap = col.closest('.trend-wrap');
    if (!wrap) return;
    var tip = wrap.querySelector('.trend-tip');
    if (!tip) return;
    wrap.querySelectorAll('.trend-col.is-hot').forEach(function (other) {
      other.classList.remove('is-hot');
    });
    col.classList.add('is-hot');
    fill(tip, col);
    place(wrap, tip, col);
  }

  function hide(wrap) {
    if (!wrap) return;
    var tip = wrap.querySelector('.trend-tip');
    if (tip) tip.hidden = true;
    wrap.querySelectorAll('.trend-col.is-hot').forEach(function (col) {
      col.classList.remove('is-hot');
    });
  }

  document.addEventListener('mouseover', function (e) {
    var col = e.target.closest && e.target.closest('.trend-col');
    if (col) show(col);
  });

  document.addEventListener('mouseout', function (e) {
    var wrap = e.target.closest && e.target.closest('.trend-wrap');
    if (wrap && !wrap.contains(e.relatedTarget)) hide(wrap);
  });

  // Touch: the strip has no hover, so a tap acts as one and a tap elsewhere
  // dismisses it.
  document.addEventListener('click', function (e) {
    var col = e.target.closest && e.target.closest('.trend-col');
    if (col) { show(col); return; }
    document.querySelectorAll('.trend-wrap').forEach(hide);
  });
})();
</script>
