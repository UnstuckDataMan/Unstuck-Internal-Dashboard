<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Data Enrichment{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600;12..96,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Brand */
      --purple:    #8b5cf6;
      --purple-2:  #7c3aed;
      --indigo:    #6366f1;
      --pink:      #e879f9;
      --gradient:  linear-gradient(135deg, #180835 0%, #7c3aed 32%, #5b5ea6 62%, #e879f9 100%);
      --gradient-vivid: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #e879f9 100%);

      /* Surfaces */
      --bg:            #10101f;
      --surface:       rgba(255,255,255,.08);
      --surface-hover: rgba(255,255,255,.11);
      --border:        rgba(255,255,255,.13);
      --border-focus:  rgba(139,92,246,.65);

      /* Text */
      --text:   #f0eeff;
      --text-2: rgba(230,225,255,.68);
      --text-3: rgba(210,205,255,.38);

      /* Status */
      --red:     #f87171;
      --red-bg:  rgba(248,113,113,.10);
      --red-bdr: rgba(248,113,113,.28);

      /* Motion */
      --ease:        cubic-bezier(.25,.1,.25,1);
      --ease-spring: cubic-bezier(.34,1.56,.64,1);
      --ease-out:    cubic-bezier(0,0,.2,1);

      /* Typography */
      --font-display: 'Bricolage Grotesque', sans-serif;
      --font:         'DM Sans', sans-serif;

      /* Shadows */
      --sh-sm:   0 1px 3px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
      --sh-md:   0 4px 24px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
      --sh-glow: 0 0 0 1px rgba(139,92,246,.4), 0 4px 24px rgba(139,92,246,.25);
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    /* ── Ambient background orbs ─────────────────────────────── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      /* radial-gradient fade removes the need for filter:blur entirely */
      will-change: transform;
    }
    .orb-1 {
      width: 640px; height: 640px;
      background: radial-gradient(circle, rgba(91,33,182,0.40) 0%, transparent 70%);
      top: -240px; left: -180px;
      animation: orbDrift 16s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 440px; height: 440px;
      background: radial-gradient(circle, rgba(49,46,129,0.36) 0%, transparent 70%);
      bottom: -120px; right: -120px;
      animation: orbDrift 20s ease-in-out infinite alternate-reverse;
    }
    .orb-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(107,33,168,0.22) 0%, transparent 70%);
      top: 40%; right: 10%;
      animation: orbDrift 12s ease-in-out infinite alternate;
    }
    @keyframes orbDrift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(28px, -36px) scale(1.07); }
    }

    /* ── Topbar ──────────────────────────────────────────────── */
    .topbar {
      background: rgba(8,8,18,.72);
      backdrop-filter: saturate(160%) blur(22px);
      -webkit-backdrop-filter: saturate(160%) blur(22px);
      border-bottom: 1px solid var(--border);
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .home-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
      min-width: 140px;
    }
    .home-mark {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(124,58,237,.35);
      transition: transform .22s var(--ease-spring), box-shadow .22s var(--ease);
    }
    .home-link:hover .home-mark {
      transform: scale(1.1) rotate(-4deg);
      box-shadow: 0 4px 18px rgba(124,58,237,.5);
    }
    .home-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      letter-spacing: .01em;
      transition: color .18s var(--ease);
    }
    .home-link:hover .home-label { color: var(--text); }

    .topbar-title {
      flex: 1;
      text-align: center;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -.02em;
      margin-right: 140px;
    }

    /* ── Page layout ─────────────────────────────────────────── */
    .page {
      flex: 1;
      position: relative;
      z-index: 1;
      overflow-y: auto;
      padding: 44px 24px 80px;
      will-change: transform;
    }
    .page-inner {
      max-width: 660px;
      width: 100%;
      margin: 0 auto;
      animation: pageIn .5s var(--ease-out) both;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Page header ─────────────────────────────────────────── */
    .page-header {
      margin-bottom: 28px;
      animation: pageIn .5s var(--ease-out) .05s both;
    }
    .page-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139,92,246,.15);
      border: 1px solid rgba(139,92,246,.3);
      border-radius: 20px;
      padding: 4px 12px 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #a78bfa;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .page-badge svg { flex-shrink: 0; }

    .page-sub {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.65;
      font-weight: 300;
    }
    .page-sub code {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: .82em;
      background: rgba(139,92,246,.15);
      color: #c4b5fd;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid rgba(139,92,246,.2);
    }

    /* ── Glass form card ─────────────────────────────────────── */
    .form-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        var(--sh-md),
        inset 0 1px 0 rgba(255,255,255,.08);
      animation: pageIn .5s var(--ease-out) .10s both;
    }

    /* Gradient bar at top of card — matches landing page cards */
    .form-card::before {
      content: '';
      display: block;
      height: 5px;
      background: var(--gradient-vivid);
      opacity: .85;
    }

    .form-card form {
      padding: 26px 28px 30px;
    }

    /* ── Form elements ───────────────────────────────────────── */
    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    label .opt {
      font-weight: 400;
      color: var(--text-3);
      text-transform: none;
      letter-spacing: 0;
      font-size: 11px;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--text);
      outline: none;
      transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
      -webkit-appearance: none;
    }
    input[type="text"]:hover {
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.18);
    }
    input[type="text"]:focus {
      border-color: var(--border-focus);
      box-shadow: var(--sh-glow);
      background: rgba(255,255,255,.08);
    }
    input[type="text"]::placeholder { color: var(--text-3); }

    /* ── Dropzone ────────────────────────────────────────────── */
    .dropzone-wrap { position: relative; }

    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px 20px;
      background: rgba(255,255,255,.04);
      border: 1.5px dashed rgba(255,255,255,.18);
      border-radius: 14px;
      cursor: pointer;
      transition:
        border-color .22s var(--ease),
        background   .22s var(--ease),
        box-shadow   .22s var(--ease);
      text-align: center;
      user-select: none;
    }
    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--purple);
      background: rgba(139,92,246,.08);
      box-shadow: 0 0 0 3px rgba(139,92,246,.12);
    }
    .dropzone.has-file {
      border-style: solid;
      border-color: rgba(139,92,246,.45);
      background: rgba(139,92,246,.07);
    }

    .dropzone-icon {
      width: 42px; height: 42px;
      background: rgba(139,92,246,.18);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .22s var(--ease-spring), background .22s var(--ease);
    }
    .dropzone:hover .dropzone-icon,
    .dropzone.dragover .dropzone-icon { transform: translateY(-3px) scale(1.06); background: rgba(139,92,246,.28); }
    .dropzone.has-file .dropzone-icon { background: rgba(139,92,246,.25); }

    .dropzone-text {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
    }
    .dropzone-text strong {
      color: #a78bfa;
      font-weight: 600;
    }
    .dropzone-filename {
      display: none;
      font-size: 13px;
      font-weight: 500;
      color: #c4b5fd;
      background: rgba(139,92,246,.12);
      border: 1px solid rgba(139,92,246,.25);
      border-radius: 8px;
      padding: 4px 12px;
    }
    .dropzone.has-file .dropzone-text { display: none; }
    .dropzone.has-file .dropzone-filename { display: block; }

    .dropzone-hint {
      font-size: 11px;
      color: var(--text-3);
      margin-top: -2px;
    }
    .dropzone.has-file .dropzone-hint { display: none; }

    /* Hidden real file input */
    input[type="file"].hidden-file-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      font-size: 0;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-3);
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .form-hint::before {
      content: '→ ';
      color: #a78bfa;
      font-weight: 600;
    }

    /* ── Actions ─────────────────────────────────────────────── */
    .form-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      outline: none;
      transition: all .22s var(--ease);
      text-decoration: none;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--gradient-vivid);
      color: white;
      padding: 11px 26px;
      box-shadow: 0 2px 12px rgba(124,58,237,.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(124,58,237,.5);
    }
    .btn-primary:active {
      transform: none;
      box-shadow: 0 2px 8px rgba(124,58,237,.25);
    }

    .btn-download {
      background: rgba(139,92,246,.12);
      color: #c4b5fd;
      border: 1px solid rgba(139,92,246,.35);
      padding: 10px 20px;
    }
    .btn-download:hover {
      background: var(--purple);
      color: white;
      border-color: var(--purple);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139,92,246,.4);
    }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner {
      display: none;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--text-2);
    }
    .htmx-request .spinner,
    .htmx-request.spinner { display: inline-flex; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { display: inline-flex; }

    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--purple);
      animation: dotPulse 1.1s infinite var(--ease);
    }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes dotPulse {
      0%,100% { opacity:.2; transform:scale(.65); }
      50%      { opacity:1;  transform:scale(1);   }
    }

    /* ── Result area ─────────────────────────────────────────── */
    #result { margin-top: 24px; }

    .result-wrap {
      animation: resultIn .45s var(--ease-out) both;
    }
    @keyframes resultIn {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0);    }
    }

    .result-meta {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-meta strong { color: #a78bfa; font-weight: 600; }
    .result-meta::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px rgba(74,222,128,.6);
      flex-shrink: 0;
    }

    /* ── Table ───────────────────────────────────────────────── */
    .tbl-wrap {
      background: rgba(255,255,255,.09);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: auto;
      margin-bottom: 18px;
      box-shadow: var(--sh-md), inset 0 1px 0 rgba(255,255,255,.07);
    }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

    thead {
      background: rgba(255,255,255,.05);
      position: sticky; top: 0;
      border-bottom: 1px solid var(--border);
    }
    th {
      padding: 11px 16px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-3);
      text-align: left;
      white-space: nowrap;
    }
    td {
      padding: 10px 16px;
      color: rgba(230,225,255,.78);
      white-space: nowrap;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .12s var(--ease); }
    tbody tr:hover { background: rgba(139,92,246,.09); }
    tbody tr:hover td { color: var(--text); }

    /* ── Error ───────────────────────────────────────────────── */
    .err-box {
      background: var(--red-bg);
      border: 1px solid var(--red-bdr);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 14px;
      color: var(--red);
      animation: resultIn .25s var(--ease) both;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .err-box::before {
      content: '!';
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      background: rgba(248,113,113,.2);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── Divider ─────────────────────────────────────────────── */
    .form-divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <!-- Ambient background -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Topbar -->
  <header class="topbar">
    <a href="/" class="home-link">
      <div class="home-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="home-label">Dashboard</span>
    </a>
    <h1 class="topbar-title">{% block heading %}{% endblock %}</h1>
  </header>

  <!-- Main content -->
  <main class="page">
    <div class="page-inner">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    // ── Custom Dropzone ──────────────────────────────────────────────────── //
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.dropzone-wrap').forEach(wrap => {
        const zone  = wrap.querySelector('.dropzone');
        const input = wrap.querySelector('input[type="file"]');
        const fname = wrap.querySelector('.dropzone-filename');
        if (!zone || !input) return;

        function setFile(file) {
          if (!file) return;
          zone.classList.add('has-file');
          fname.textContent = file.name;
        }

        // Click anywhere on zone → open picker
        zone.addEventListener('click', (e) => {
          if (e.target !== input) input.click();
        });

        input.addEventListener('change', () => {
          if (input.files[0]) setFile(input.files[0]);
        });

        // Drag events
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          zone.classList.add('dragover');
        });
        ['dragleave', 'dragend'].forEach(ev =>
          zone.addEventListener(ev, () => zone.classList.remove('dragover'))
        );
        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          zone.classList.remove('dragover');
          const file = e.dataTransfer.files[0];
          if (!file) return;
          // Assign to real input via DataTransfer
          const dt = new DataTransfer();
          dt.items.add(file);
          input.files = dt.files;
          setFile(file);
        });
      });
    });
  </script>
</body>
</html>
